<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力的分解多样性演示 - 精简版</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-color: #333;
            --accent-color: #2196F3;
            --main-force-color: #e91e63; /* 红 */
            --comp1-color: #4caf50;      /* 绿 */
            --comp2-color: #ff9800;      /* 橙 */
            --border-color: #ddd;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左侧画布区 */
        .canvas-area {
            flex: 1;
            position: relative;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        /* 右侧功能区 */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
            z-index: 10;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: var(--text-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .control-group {
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 8px;
        }

        .control-header {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #555;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .val-text {
            font-family: monospace;
            font-weight: bold;
            color: var(--accent-color);
        }

        .result-display {
            font-size: 0.9rem;
            text-align: right;
            font-weight: bold;
            margin-top: -5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s, background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.active-anim {
            background-color: #ff5722;
        }

        .info-box {
            font-size: 0.8rem;
            color: #666;
            background: #e3f2fd;
            padding: 10px;
            border-radius: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="canvas-area" id="canvasWrapper">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="sidebar">
        <h2>力分解演示</h2>

        <div class="info-box">
            拖动滑块改变<strong>分解轴的角度</strong>，观察同一个合力 F 是如何被分解为不同的 F<sub>1</sub> 和 F<sub>2</sub> 的。
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="legend-dot" style="background: var(--main-force-color)"></span>
                合力 F (目标)
            </div>
            <label>大小: <span class="val-text" id="disp-fMag">200</span></label>
            <input type="range" id="in-fMag" min="50" max="300" value="200">
            
            <label>方向: <span class="val-text" id="disp-fAng">90</span>°</label>
            <input type="range" id="in-fAng" min="0" max="360" value="90">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="legend-dot" style="background: var(--comp1-color)"></span>
                分解轴 1
            </div>
            <label>角度 α: <span class="val-text" id="disp-a1Ang">150</span>°</label>
            <input type="range" id="in-a1Ang" min="0" max="360" value="150">
            <div class="result-display" style="color: var(--comp1-color)">
                F<sub>1</sub> = <span id="res-f1">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="legend-dot" style="background: var(--comp2-color)"></span>
                分解轴 2
            </div>
            <label>角度 β: <span class="val-text" id="disp-a2Ang">30</span>°</label>
            <input type="range" id="in-a2Ang" min="0" max="360" value="30">
            <div class="result-display" style="color: var(--comp2-color)">
                F<sub>2</sub> = <span id="res-f2">0</span>
            </div>
        </div>

        <div class="control-group">
            <div class="control-header">动态演示</div>
            <button id="btn-anim" onclick="toggleAnimation()">自动旋转轴 1</button>
        </div>
    </div>
</div>

<script>
    // --- 初始化 ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    // DOM 元素引用
    const dom = {
        inputs: {
            fMag: document.getElementById('in-fMag'),
            fAng: document.getElementById('in-fAng'),
            a1Ang: document.getElementById('in-a1Ang'),
            a2Ang: document.getElementById('in-a2Ang')
        },
        displays: {
            fMag: document.getElementById('disp-fMag'),
            fAng: document.getElementById('disp-fAng'),
            a1Ang: document.getElementById('disp-a1Ang'),
            a2Ang: document.getElementById('disp-a2Ang'),
            f1: document.getElementById('res-f1'),
            f2: document.getElementById('res-f2')
        },
        btnAnim: document.getElementById('btn-anim')
    };

    // 应用状态
    let state = {
        fMag: 200,
        fAng: 90,
        a1Ang: 150,
        a2Ang: 30,
        originX: 0,
        originY: 0,
        isAnimating: false,
        animFrameId: null
    };

    // --- 核心逻辑 ---

    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 绑定滑块事件
        Object.keys(dom.inputs).forEach(key => {
            dom.inputs[key].addEventListener('input', (e) => {
                // 如果正在动画中，用户手动拖动时停止动画
                if (state.isAnimating && key === 'a1Ang') toggleAnimation();

                // 更新状态
                state[key] = parseInt(e.target.value);
                // 更新UI和重绘
                updateUI(); 
                draw();
            });
        });

        // 初始绘制
        updateUI();
        draw();
    }

    function resizeCanvas() {
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        state.originX = canvas.width / 2;
        state.originY = canvas.height / 3; 
        draw();
    }

    // 更新界面文字和滑块位置
    function updateUI() {
        dom.displays.fMag.innerText = state.fMag;
        dom.displays.fAng.innerText = state.fAng;
        dom.displays.a1Ang.innerText = state.a1Ang;
        dom.displays.a2Ang.innerText = state.a2Ang;

        dom.inputs.fMag.value = state.fMag;
        dom.inputs.fAng.value = state.fAng;
        dom.inputs.a1Ang.value = state.a1Ang;
        dom.inputs.a2Ang.value = state.a2Ang;
    }

    // 动画逻辑
    function toggleAnimation() {
        if (state.isAnimating) {
            state.isAnimating = false;
            cancelAnimationFrame(state.animFrameId);
            dom.btnAnim.innerText = "自动旋转轴 1";
            dom.btnAnim.classList.remove('active-anim');
        } else {
            state.isAnimating = true;
            dom.btnAnim.innerText = "停止旋转";
            dom.btnAnim.classList.add('active-anim');
            animateLoop();
        }
    }

    function animateLoop() {
        if (!state.isAnimating) return;
        
        // 每一帧增加轴1的角度
        state.a1Ang = (state.a1Ang + 1) % 360;
        
        updateUI(); // 更新滑块和文字
        draw();     // 重绘画布
        
        state.animFrameId = requestAnimationFrame(animateLoop);
    }

    // --- 数学计算与绘图 ---

    const toRad = deg => deg * Math.PI / 180;

    function solve() {
        const rF = toRad(state.fAng);
        const r1 = toRad(state.a1Ang);
        const r2 = toRad(state.a2Ang);

        const fx = state.fMag * Math.cos(rF);
        const fy = state.fMag * Math.sin(rF);
        
        const u1x = Math.cos(r1), u1y = Math.sin(r1);
        const u2x = Math.cos(r2), u2y = Math.sin(r2);

        const det = u1x * u2y - u1y * u2x;

        if (Math.abs(det) < 0.01) return null; // 平行无解

        const m1 = (fx * u2y - fy * u2x) / det;
        const m2 = (u1x * fy - u1y * fx) / det;

        return { m1, m2 };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制中心
        ctx.beginPath();
        ctx.arc(state.originX, state.originY, 4, 0, Math.PI*2);
        ctx.fillStyle = '#333';
        ctx.fill();

        // 2. 计算分力
        const res = solve();

        if (!res) {
            ctx.fillStyle = 'red';
            ctx.font = '16px Arial';
            ctx.fillText("轴线重合，无法分解", 20, 30);
            dom.displays.f1.innerText = "N/A";
            dom.displays.f2.innerText = "N/A";
            return;
        }

        // 更新结果面板数值
        dom.displays.f1.innerText = Math.abs(res.m1).toFixed(0);
        dom.displays.f2.innerText = Math.abs(res.m2).toFixed(0);

        // 3. 绘制辅助线 (长轴线)
        drawAxisLine(state.a1Ang, '#a5d6a7');
        drawAxisLine(state.a2Ang, '#ffcc80');

        // 4. 计算箭头坐标
        const pF = getVec(state.fMag, state.fAng);
        const p1 = getVec(res.m1, state.a1Ang);
        const p2 = getVec(res.m2, state.a2Ang);

        // 5. 绘制平行四边形虚线
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#999';
        ctx.moveTo(state.originX + p1.x, state.originY + p1.y);
        ctx.lineTo(state.originX + pF.x, state.originY + pF.y);
        ctx.lineTo(state.originX + p2.x, state.originY + p2.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // 6. 绘制箭头
        drawArrow(p1.x, p1.y, '#4caf50', 3, "F1");
        drawArrow(p2.x, p2.y, '#ff9800', 3, "F2");
        drawArrow(pF.x, pF.y, '#e91e63', 5, "F");
    }

    function getVec(mag, angDeg) {
        const r = toRad(angDeg);
        return { x: mag * Math.cos(r), y: mag * Math.sin(r) };
    }

    function drawAxisLine(angDeg, color) {
        const len = 2000;
        const p = getVec(len, angDeg);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.moveTo(state.originX - p.x, state.originY - p.y);
        ctx.lineTo(state.originX + p.x, state.originY + p.y);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawArrow(dx, dy, color, width, label) {
        const x = state.originX + dx;
        const y = state.originY + dy;
        const head = 12;
        const angle = Math.atan2(dy, dx);

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = width;

        // 线
        ctx.beginPath();
        ctx.moveTo(state.originX, state.originY);
        ctx.lineTo(x, y);
        ctx.stroke();

        // 箭头
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - head * Math.cos(angle - Math.PI/6), y - head * Math.sin(angle - Math.PI/6));
        ctx.lineTo(x - head * Math.cos(angle + Math.PI/6), y - head * Math.sin(angle + Math.PI/6));
        ctx.fill();

        if (label) {
            ctx.font = 'bold 16px Arial';
            ctx.fillText(label, x + 10, y + 10);
        }
    }

    init();

</script>
</body>
</html>
