<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物理追及模拟 - 全轨迹同步版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #121212; color: #e0e0e0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .container {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw; padding: 12px;
        }

        h2 { margin: 0 0 10px 0; text-align: center; font-size: 1.2rem; color: #00e5ff; }

        /* 参数控制 */
        .settings {
            display: grid; grid-template-columns: 1fr 1fr auto;
            gap: 12px; background: #1e1e1e; padding: 12px;
            border-radius: 10px; margin-bottom: 10px;
            border: 1px solid #333;
        }
        .obj-panel { border-left: 4px solid #444; padding-left: 12px; }
        .obj-a { border-color: #00aaff; }
        .obj-b { border-color: #ff4444; }
        .row { margin: 5px 0; font-size: 0.9rem; display: flex; align-items: center; }
        label { width: 110px; }
        input { 
            width: 70px; background: #2a2a2a; border: 1px solid #444; 
            color: #fff; padding: 3px 6px; border-radius: 4px; 
        }

        .btns { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        button { 
            padding: 8px 20px; cursor: pointer; border: none; border-radius: 5px; 
            font-weight: bold; transition: 0.2s;
        }
        .go { background: #00c853; color: white; }
        .reset { background: #616161; color: white; }

        /* 动画画布 */
        #road-canvas { 
            background: #000; border-radius: 10px; 
            width: 100%; height: 130px; margin-bottom: 10px;
            border: 1px solid #333;
        }

        /* 图像区域 */
        .chart-grid { 
            flex: 1; display: grid; grid-template-columns: 1fr 1fr; 
            gap: 12px; min-height: 0;
        }
        .chart-item { background: #1e1e1e; border-radius: 10px; padding: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>追及相遇</h2>

    <div class="settings">
        <div class="obj-panel obj-a">
            <strong>物体 A (蓝色)</strong>
            <div class="row"><label>初位置 x0(m):</label><input type="number" id="x0_a" value="0"></div>
            <div class="row"><label>初速度 v0(m/s):</label><input type="number" id="v0_a" value="20"></div>
            <div class="row"><label>加速度 a(m/s²):</label><input type="number" id="a_a" value="0"></div>
        </div>
        <div class="obj-panel obj-b">
            <strong>物体 B (红色)</strong>
            <div class="row"><label>初位置 x0(m):</label><input type="number" id="x0_b" value="80"></div>
            <div class="row"><label>初速度 v0(m/s):</label><input type="number" id="v0_b" value="0"></div>
            <div class="row"><label>加速度 a(m/s²):</label><input type="number" id="a_b" value="2"></div>
        </div>
        <div class="btns">
            <button class="go" id="btnToggle" onclick="toggle()">开始仿真</button>
            <button class="reset" onclick="reset()">重置</button>
        </div>
    </div>

    <canvas id="road-canvas"></canvas>

    <div class="chart-grid">
        <div class="chart-item"><canvas id="xt-chart"></canvas></div>
        <div class="chart-item"><canvas id="vt-chart"></canvas></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('road-canvas');
    const ctx = canvas.getContext('2d');
    let running = false;
    let t = 0;
    let lastTime = 0;
    let aniId = null;
    let xtChart, vtChart;

    const baseConfig = (title, yName) => ({
        type: 'line',
        data: { datasets: [
            { label: '物体 A', borderColor: '#00aaff', data: [], borderWidth: 2, pointRadius: 0, fill: false },
            { label: '物体 B', borderColor: '#ff4444', data: [], borderWidth: 2, pointRadius: 0, fill: false }
        ]},
        options: {
            responsive: true, maintainAspectRatio: false,
            animation: false,
            parsing: false, // 提高大数据量下的性能
            plugins: { title: { display: true, text: title, color: '#00e5ff' }, legend: { labels: { color: '#ccc' } } },
            scales: { 
                x: { type: 'linear', min: 0, title: { display: true, text: '时间 (s)', color: '#999' }, grid: { color: '#333' } },
                y: { title: { display: true, text: yName, color: '#999' }, grid: { color: '#333' } }
            }
        }
    });

    function init() {
        xtChart = new Chart(document.getElementById('xt-chart'), baseConfig('位移-时间 (x-t) 图像', '位置 (m)'));
        vtChart = new Chart(document.getElementById('vt-chart'), baseConfig('速度-时间 (v-t) 图像', '速度 (m/s)'));
    }

    function reset() {
        running = false;
        cancelAnimationFrame(aniId);
        t = 0; lastTime = 0;
        document.getElementById('btnToggle').innerText = '开始仿真';
        xtChart.data.datasets.forEach(d => d.data = []);
        vtChart.data.datasets.forEach(d => d.data = []);
        xtChart.update('none');
        vtChart.update('none');
        draw(0);
    }

    function draw(time) {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const v = (id) => parseFloat(document.getElementById(id).value);
        const a = { x0: v('x0_a'), v0: v('v0_a'), acc: v('a_a') };
        const b = { x0: v('x0_b'), v0: v('v0_b'), acc: v('a_b') };

        const xa = a.x0 + a.v0 * time + 0.5 * a.acc * time * time;
        const xb = b.x0 + b.v0 * time + 0.5 * b.acc * time * time;
        const va = a.v0 + a.acc * time;
        const vb = b.v0 + b.acc * time;

        // 动态视野：确保从 0 到当前最远位置都在屏幕内
        const maxPos = Math.max(xa, xb, a.x0, b.x0);
        const minPos = Math.min(xa, xb, a.x0, b.x0);
        const range = Math.max(maxPos - minPos, 100);
        const scale = (canvas.width - 60) / range;
        const offset = 30 - minPos * scale;

        // 刻度
        ctx.strokeStyle = '#444'; ctx.fillStyle = '#666';
        const step = range > 1000 ? 200 : 50;
        for(let i = Math.floor(minPos/step)*step; i <= maxPos + 100; i+=step) {
            let x = i * scale + offset;
            ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 110); ctx.stroke();
            ctx.fillText(i + 'm', x - 10, 125);
        }

        // 滑块
        ctx.fillStyle = '#00aaff'; ctx.fillRect(xa * scale + offset - 10, 40, 20, 12);
        ctx.fillText('A', xa * scale + offset - 5, 35);
        ctx.fillStyle = '#ff4444'; ctx.fillRect(xb * scale + offset - 10, 70, 20, 12);
        ctx.fillText('B', xb * scale + offset - 5, 65);

        return { xa, xb, va, vb };
    }

    function run(ts) {
        if(!running) return;
        if(!lastTime) lastTime = ts;
        const dt = (ts - lastTime) / 1000;
        lastTime = ts;
        t += dt;

        const res = draw(t);

        // 控制记录频率：大约每秒记录 20 次，保证图像细腻且不卡顿
        if (Math.round(t * 100) % 5 === 0) {
            xtChart.data.datasets[0].data.push({x: t, y: res.xa});
            xtChart.data.datasets[1].data.push({x: t, y: res.xb});
            vtChart.data.datasets[0].data.push({x: t, y: res.va});
            vtChart.data.datasets[1].data.push({x: t, y: res.vb});
            
            // 手动触发更新，不带动画
            xtChart.update('none');
            vtChart.update('none');
        }

        if(t < 100) aniId = requestAnimationFrame(run);
    }

    function toggle() {
        running = !running;
        const b = document.getElementById('btnToggle');
        if(running) {
            b.innerText = '暂停仿真';
            lastTime = 0;
            aniId = requestAnimationFrame(run);
        } else {
            b.innerText = '继续仿真';
        }
    }

    window.onload = () => { init(); draw(0); };
</script>
</body>
</html>
