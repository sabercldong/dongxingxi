<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨滴下落物理模拟 (F = -kv)</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-color: #2b2b36;
            --text-color: #e0e0e0;
            --accent-color: #4facfe;
            --danger-color: #ff5e62;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* 单屏显示 */
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左侧画布区域 */
        .canvas-area {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); /* 模拟天空 */
            background: linear-gradient(to bottom, #cfd9df 0%, #e2ebf0 100%); /* 雨天灰调 */
            border-right: 2px solid #444;
            overflow: hidden;
        }

        canvas#simCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 标尺 */
        .ruler {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50px;
            border-right: 1px solid rgba(0,0,0,0.2);
            pointer-events: none;
        }
        .ruler-mark {
            position: absolute;
            left: 0;
            width: 100%;
            border-top: 1px solid rgba(0,0,0,0.3);
            font-size: 10px;
            color: #555;
            padding-left: 5px;
        }

        /* 右侧功能区 */
        .controls-area {
            width: 350px;
            background-color: var(--panel-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px;}
        h3 { font-size: 1rem; margin-top: 20px; color: var(--accent-color); }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            float: right;
            font-family: monospace;
            color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-start { background-color: var(--accent-color); color: white; }
        .btn-reset { background-color: var(--danger-color); color: white; }
        button:hover { opacity: 0.8; }

        .stats-panel {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 图表容器 */
        .chart-container {
            margin-top: 20px;
            height: 150px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            position: relative;
        }
        canvas#chartCanvas {
            width: 100%;
            height: 100%;
        }

        .formula {
            margin-top: 20px;
            font-style: italic;
            text-align: center;
            color: #888;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="canvas-area" id="canvasArea">
        <div class="ruler" id="ruler"></div>
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="controls-area">
        <h2>物理参数设置</h2>
        
        <div class="control-group">
            <label>质量 (m) <span id="val-m" class="value-display">1.0 kg</span></label>
            <input type="range" id="input-m" min="0.1" max="10" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>阻力系数 (k) <span id="val-k" class="value-display">0.5</span></label>
            <input type="range" id="input-k" min="0" max="2" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <label>重力加速度 (g) <span id="val-g" class="value-display">9.8 m/s²</span></label>
            <input type="range" id="input-g" min="1" max="20" step="0.1" value="9.8">
        </div>

        <div class="btn-group">
            <button class="btn-start" id="btnToggle">开始 / 暂停</button>
            <button class="btn-reset" id="btnReset">重置</button>
        </div>

        <h3>实时数据</h3>
        <div class="stats-panel">
            <div>时间 (t): <span id="stat-time">0.00</span> s</div>
            <div>位移 (y): <span id="stat-pos">0.00</span> m</div>
            <div>速度 (v): <span id="stat-vel">0.00</span> m/s</div>
            <div>加速度 (a): <span id="stat-acc">0.00</span> m/s²</div>
            <div style="color: #ffff00; margin-top:5px;">理论终端速度: <span id="stat-vt">0.00</span> m/s</div>
        </div>

        <h3>v-t 曲线 (速度-时间)</h3>
        <div class="chart-container">
            <canvas id="chartCanvas"></canvas>
        </div>

        <div class="formula">
            F<sub>net</sub> = mg - kv<br>
            a = g - (k/m)v
        </div>
    </div>
</div>

<script>
    // --- 物理引擎常量与变量 ---
    const SCALE = 20; // 1米 = 20像素
    const DT = 0.016; // 时间步长 (约60FPS)

    let state = {
        m: 1.0,
        k: 0.5,
        g: 9.8,
        t: 0,
        y: 0, // 位移 (米)
        v: 0, // 速度 (米/秒)
        a: 0, // 加速度 (米/秒平方)
        running: false,
        history: [] // 用于绘制图表
    };

    // --- DOM 元素 ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const chartCanvas = document.getElementById('chartCanvas');
    const chartCtx = chartCanvas.getContext('2d');
    const ruler = document.getElementById('ruler');

    const inputs = {
        m: document.getElementById('input-m'),
        k: document.getElementById('input-k'),
        g: document.getElementById('input-g')
    };
    const displays = {
        m: document.getElementById('val-m'),
        k: document.getElementById('val-k'),
        g: document.getElementById('val-g')
    };
    const stats = {
        t: document.getElementById('stat-time'),
        y: document.getElementById('stat-pos'),
        v: document.getElementById('stat-vel'),
        a: document.getElementById('stat-acc'),
        vt: document.getElementById('stat-vt')
    };

    // --- 初始化与事件监听 ---
    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        createRuler();

        // 绑定滑块事件
        Object.keys(inputs).forEach(key => {
            inputs[key].addEventListener('input', (e) => {
                state[key] = parseFloat(e.target.value);
                displays[key].innerText = state[key] + (key === 'm' ? ' kg' : (key === 'g' ? ' m/s²' : ''));
                updateTerminalVelocity();
            });
        });

        document.getElementById('btnToggle').addEventListener('click', toggleSim);
        document.getElementById('btnReset').addEventListener('click', resetSim);

        updateTerminalVelocity();
        loop();
    }

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        
        // 设置图表画布分辨率
        chartCanvas.width = chartCanvas.clientWidth;
        chartCanvas.height = chartCanvas.clientHeight;
    }

    function createRuler() {
        ruler.innerHTML = '';
        const heightMeters = Math.ceil(window.innerHeight / SCALE);
        for(let i=0; i<heightMeters; i+=5) {
            const mark = document.createElement('div');
            mark.className = 'ruler-mark';
            mark.style.top = (i * SCALE) + 'px';
            mark.innerText = i + 'm';
            ruler.appendChild(mark);
        }
    }

    function updateTerminalVelocity() {
        const vt = state.k > 0 ? (state.m * state.g) / state.k : "∞";
        stats.vt.innerText = typeof vt === 'number' ? vt.toFixed(2) : vt;
    }

    function toggleSim() {
        state.running = !state.running;
    }

    function resetSim() {
        state.running = false;
        state.t = 0;
        state.y = 0;
        state.v = 0;
        state.a = 0;
        state.history = [];
        updateStats();
        draw();
    }

    // --- 核心物理循环 ---
    function updatePhysics() {
        if (!state.running) return;

        // 1. 计算合力: F_net = mg - kv
        const F_gravity = state.m * state.g;
        const F_drag = state.k * state.v; // 方向向上，在公式中体现为减去
        const F_net = F_gravity - F_drag;

        // 2. 牛顿第二定律: a = F_net / m
        state.a = F_net / state.m;

        // 3. 欧拉积分更新状态
        state.v += state.a * DT;
        state.y += state.v * DT;
        state.t += DT;

        // 记录历史数据用于绘图 (限制数据点数量以优化性能)
        if (state.history.length > 300) state.history.shift();
        state.history.push(state.v);

        // 边界处理：如果超出屏幕，我们让它看起来像是相机在跟随，或者简单的循环
        // 这里为了演示终端速度，我们让雨滴一直下落，但如果超出画布太远，可以重置位置视觉效果，
        // 但物理数据保持不变（为了看速度曲线）。
        // 简单起见：如果y超过画布高度，让它从顶部重新出现，但保留速度v，
        // 这样可以模拟无限长的下落空间。
        const maxH = canvas.height / SCALE;
        if (state.y > maxH) {
            state.y = 0; 
            // 注意：物理上的 y 应该继续增加，但视觉上我们重置。
            // 为了避免数据混乱，这里我们只重置视觉 y。
            // 在 stats 显示时，我们可能需要一个 totalDistance 变量，这里简化处理。
        }
    }

    function updateStats() {
        stats.t.innerText = state.t.toFixed(2);
        stats.y.innerText = state.y.toFixed(2); // 这里的y会循环，仅供参考位置
        stats.v.innerText = state.v.toFixed(2);
        stats.a.innerText = state.a.toFixed(2);
    }

    // --- 绘制逻辑 ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制雨滴
        const screenY = state.y * SCALE;
        const centerX = canvas.width / 2;

        // 拖尾效果 (Visual Trail)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(79, 172, 254, 0.4)';
        ctx.lineWidth = 2;
        ctx.moveTo(centerX, screenY);
        ctx.lineTo(centerX, screenY - (state.v * 0.5)); // 尾巴长度随速度变化
        ctx.stroke();

        // 雨滴本体
        ctx.beginPath();
        ctx.fillStyle = '#4facfe';
        ctx.arc(centerX, screenY, 6, 0, Math.PI * 2);
        ctx.fill();

        // 绘制力向量 (可选，增强理解)
        // 重力 (向下)
        drawVector(centerX, screenY, 0, 30, 'rgba(255,255,0,0.5)'); 
        // 阻力 (向上，长度随kv变化)
        const dragLen = Math.min((state.k * state.v) * 2, 30); // 限制最大长度绘制
        drawVector(centerX, screenY, Math.PI, dragLen, 'rgba(255, 94, 98, 0.7)');

        // 2. 绘制右侧图表
        drawChart();
    }

    function drawVector(x, y, angle, length, color) {
        if(length < 1) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.moveTo(0, 0);
        ctx.lineTo(0, length);
        ctx.stroke();
        // 箭头
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.moveTo(0, length);
        ctx.lineTo(-3, length - 5);
        ctx.lineTo(3, length - 5);
        ctx.fill();
        ctx.restore();
    }

    function drawChart() {
        const w = chartCanvas.width;
        const h = chartCanvas.height;
        chartCtx.clearRect(0, 0, w, h);

        // 坐标轴
        chartCtx.strokeStyle = '#666';
        chartCtx.lineWidth = 1;
        chartCtx.beginPath();
        chartCtx.moveTo(0, h);
        chartCtx.lineTo(w, h); // X轴
        chartCtx.moveTo(0, 0);
        chartCtx.lineTo(0, h); // Y轴
        chartCtx.stroke();

        if (state.history.length < 2) return;

        // 绘制曲线
        chartCtx.beginPath();
        chartCtx.strokeStyle = '#4facfe';
        chartCtx.lineWidth = 2;

        // 找到最大速度用于归一化Y轴 (至少为10，或者当前的终端速度)
        const vt = state.k > 0 ? (state.m * state.g)/state.k : 20;
        const maxV = Math.max(vt * 1.2, 10); 

        const stepX = w / 300; // 对应history长度

        for (let i = 0; i < state.history.length; i++) {
            const val = state.history[i];
            const x = i * stepX;
            const y = h - (val / maxV) * h;
            if (i === 0) chartCtx.moveTo(x, y);
            else chartCtx.lineTo(x, y);
        }
        chartCtx.stroke();

        // 绘制终端速度参考线
        const vtY = h - (vt / maxV) * h;
        if(vtY >= 0) {
            chartCtx.beginPath();
            chartCtx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
            chartCtx.setLineDash([5, 5]);
            chartCtx.moveTo(0, vtY);
            chartCtx.lineTo(w, vtY);
            chartCtx.stroke();
            chartCtx.setLineDash([]);
        }
    }

    function loop() {
        updatePhysics();
        updateStats();
        draw();
        requestAnimationFrame(loop);
    }

    // 启动
    init();

</script>
</body>
</html>
