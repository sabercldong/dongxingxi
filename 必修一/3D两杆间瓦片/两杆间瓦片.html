<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>透明圆柱下滑（修复运动与提亮版）</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Microsoft YaHei', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #ui {
            position: absolute; top: 0; right: 0; width: 300px; height: 100%;
            background: rgba(20,20,20,0.9); color: #ddd; padding: 20px;
            border-left: 1px solid #444; display: flex; flex-direction: column; gap: 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        h3 { margin: 0 0 10px 0; color: #00e5ff; border-bottom: 2px solid #00e5ff; padding-bottom: 5px;}
        
        .control { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; }
        label { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        span.val { color: #00e5ff; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #00e5ff; cursor: pointer; }
        
        .btn-row { display: flex; gap: 10px; }
        button { 
            flex: 1; padding: 10px; border: none; border-radius: 4px; 
            font-weight: bold; cursor: pointer; color: white; transition: 0.2s;
        }
        #btn-start { background: #00b8d4; }
        #btn-start:hover { background: #00e5ff; }
        #btn-reset { background: #37474f; }
        #btn-reset:hover { background: #546e7a; }
        
        #status-text { color: #fff; font-size: 14px; font-weight: bold; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h3>🧊 受力分析 </h3>
        
        <div class="btn-row">
            <button onclick="toggleRun()" id="btn-start">开始下滑</button>
            <button onclick="resetSim()" id="btn-reset">重置</button>
        </div>
        
        <div class="control">
            <label>斜面角度 θ <span id="v-angle" class="val">20°</span></label>
            <input type="range" min="0" max="60" value="20" oninput="updateParams('angle', this.value)">
        </div>

        <div class="control">
            <label>杆间距 (Spacing) <span id="v-space" class="val">4.0</span></label>
            <input type="range" min="2.0" max="7.0" step="0.1" value="4.0" oninput="updateParams('space', this.value)">
        </div>

        <div class="control">
            <label>摩擦系数 μ <span id="v-mu" class="val">0.2</span></label>
            <input type="range" min="0" max="0.8" step="0.05" value="0.2" oninput="updateParams('mu', this.value)">
        </div>

        <div id="status-text">状态: 准备就绪</div>
        
        <div style="margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
            <div class="legend-item"><div class="dot" style="background:#00ffff"></div> N₁, N₂: 两侧分支持力</div>
            <div class="legend-item"><div class="dot" style="background:#ffff00"></div> N_net: 总支持力合力</div>
            <div class="legend-item"><div class="dot" style="background:#ffffff"></div> G: 重力</div>
            <div class="legend-item"><div class="dot" style="background:#ff3300"></div> f: 摩擦力</div>
        </div>
    </div>

    <script>
        const P = {
            R: 4.0, r: 0.3, w: 2.0, angle: 20, mu: 0.2,
            z: 0, v: 0, running: false
        };

        let scene, camera, renderer, controls;
        let mainGroup, cylinderMesh, leftRod, rightRod;
        const arrows = {}; 

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
            camera.position.set(0, 6, 28); 
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.outputEncoding = THREE.sRGBEncoding; // 改善颜色输出
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            if(typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
            }

            // --- 灯光增强 ---
            scene.add(new THREE.AmbientLight(0xffffff, 0.8)); // 提高环境光
            const dl = new THREE.DirectionalLight(0xffffff, 1.3); // 提高平行光
            dl.position.set(10, 25, 15);
            dl.castShadow = true;
            scene.add(dl);
            
            // 添加一个点光源增加局部高光
            const pl = new THREE.PointLight(0x00ffff, 0.5, 50);
            pl.position.set(0, 10, 5);
            scene.add(pl);

            // 参考地板
            const grid = new THREE.GridHelper(100, 40, 0x333333, 0x222222);
            grid.position.y = -10;
            scene.add(grid);

            buildScene();
            updatePhysicsState(); 
        }

        function createGlassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // 更亮的纹理底色
            ctx.fillStyle = 'rgba(100, 220, 255, 0.3)';
            ctx.fillRect(0,0,256,256);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 5;
            for(let i=0; i<10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i*25); ctx.lineTo(256, i*25 + 50);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function buildScene() {
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // 1. 杆子
            const rodGeo = new THREE.CylinderGeometry(P.r, P.r, 80, 32);
            rodGeo.rotateX(Math.PI / 2);
            const rodMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.3 });
            
            leftRod = new THREE.Mesh(rodGeo, rodMat);
            rightRod = new THREE.Mesh(rodGeo, rodMat);
            mainGroup.add(leftRod);
            mainGroup.add(rightRod);

            // 2. 透明圆柱体 (高亮材质)
            const cylGeo = new THREE.CylinderGeometry(P.R, P.R, 8, 64);
            cylGeo.rotateX(Math.PI / 2);
            
            const cylMat = new THREE.MeshPhongMaterial({ 
                color: 0x44bbff,        // 更亮的基础色
                emissive: 0x004466,     // 添加自发光，让它在暗处也亮
                map: createGlassTexture(),
                transparent: true,
                opacity: 0.7,           // 稍微降低透明度，增加实体感
                shininess: 150,         // 更强的高光
                side: THREE.DoubleSide,
                specular: 0xffffff      // 白色高光
            });
            
            cylinderMesh = new THREE.Mesh(cylGeo, cylMat);
            cylinderMesh.castShadow = true;
            mainGroup.add(cylinderMesh);

            // 3. 矢量箭头
            createArrow('N_net', 0xffff00); 
            createArrow('N1', 0x00ffff);    
            createArrow('N2', 0x00ffff);    
            createArrow('G', 0xffffff);     
            createArrow('f', 0xff3300);     
        }

        function updatePhysicsState() {
            leftRod.position.set(-P.w, 0, -20);
            rightRod.position.set(P.w, 0, -20);

            const dist = P.R + P.r;
            let h = (dist > P.w) ? Math.sqrt(dist*dist - P.w*P.w) : -P.R;
            cylinderMesh.position.set(0, h, P.z);
            
            // --- 修复：移除了导致运动奇怪的自转代码 ---
            // cylinderMesh.rotation.y = P.z / P.R; 

            const rad = THREE.MathUtils.degToRad(P.angle);
            mainGroup.rotation.x = -rad;

            const G = 5 * 9.8; 
            const G_slide = G * Math.sin(rad);
            const G_perp = G * Math.cos(rad);
            
            const cosAlpha = (dist > P.w && h > 0) ? (h / dist) : 1;
            const N_single_mag = G_perp / (2 * cosAlpha);
            const N_net_mag = G_perp;
            const f_max = P.mu * (2 * N_single_mag); 

            const s = 0.12; // 缩放

            const worldPos = new THREE.Vector3();
            cylinderMesh.getWorldPosition(worldPos);
            updateArrow('G', worldPos, new THREE.Vector3(0, -1, 0), G * s);
            updateArrow('f', cylinderMesh.position.clone().add(new THREE.Vector3(0, -P.R, 0)), new THREE.Vector3(0, 0, 1), Math.min(G_slide, f_max) * s * 2);
            updateArrow('N_net', cylinderMesh.position.clone().add(new THREE.Vector3(0, P.R*0.8, 0)), new THREE.Vector3(0, 1, 0), N_net_mag * s);

            if (h > 0 && dist > P.w) {
                const dirN1 = new THREE.Vector3(P.w, h, 0).normalize();
                const dirN2 = new THREE.Vector3(-P.w, h, 0).normalize();
                const startN1 = new THREE.Vector3(-P.w, 0, P.z).add(dirN1.clone().multiplyScalar(P.r));
                const startN2 = new THREE.Vector3(P.w, 0, P.z).add(dirN2.clone().multiplyScalar(P.r));
                updateArrow('N1', startN1, dirN1, N_single_mag * s);
                updateArrow('N2', startN2, dirN2, N_single_mag * s);
            } else {
                updateArrow('N1', new THREE.Vector3(), new THREE.Vector3(0,1,0), 0);
                updateArrow('N2', new THREE.Vector3(), new THREE.Vector3(0,1,0), 0);
            }

            return { G_slide, f_max };
        }

        function animate() {
            requestAnimationFrame(animate);
            if (P.running) {
                const forces = updatePhysicsState();
                let netForce = forces.G_slide - forces.f_max;
                if (netForce > 0) {
                    P.v += (netForce / 5) * 0.05; 
                    document.getElementById('status-text').innerText = "状态: 正在加速下滑";
                } else if (P.v > 0) {
                    P.v -= ((forces.f_max - forces.G_slide) / 5) * 0.05;
                    if (P.v < 0) P.v = 0;
                    document.getElementById('status-text').innerText = "状态: 摩擦力较大，减速中";
                } else {
                    P.v = 0;
                    document.getElementById('status-text').innerText = "状态: 卡住 (静止)";
                }
                P.z -= P.v;
                if (P.z < -40) { P.running = false; document.getElementById('status-text').innerText = "状态: 已滑出边界"; }
            } else {
                updatePhysicsState();
            }
            if(controls) controls.update();
            renderer.render(scene, camera);
        }

        function createArrow(name, color) {
            // 增加箭头亮度
            const arrowColor = new THREE.Color(color);
            arrowColor.multiplyScalar(1.5); 
            const arrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(), 1, arrowColor, 0.6, 0.3);
            if (name === 'G') scene.add(arrow); else mainGroup.add(arrow);
            arrows[name] = arrow;
        }

        function updateArrow(name, pos, dir, len) {
            const arr = arrows[name];
            arr.position.copy(pos);
            arr.setDirection(dir);
            if (len < 0.01) {
                arr.visible = false;
            } else {
                arr.visible = true;
                arr.setLength(len);
            }
        }

        window.updateParams = function(key, val) {
            val = parseFloat(val);
            if (key === 'space') P.w = val / 2;
            if (key === 'angle') P.angle = val;
            if (key === 'mu')    P.mu = val;
            document.getElementById('v-'+key).innerText = (key==='angle')?val+'°':val;
            updatePhysicsState();
        }

        window.toggleRun = function() {
            if (P.z < -39) resetSim();
            P.running = !P.running;
            document.getElementById('btn-start').innerText = P.running ? "暂停" : "继续";
        }

        window.resetSim = function() {
            P.running = false; P.z = 0; P.v = 0;
            document.getElementById('btn-start').innerText = "开始下滑";
            document.getElementById('status-text').innerText = "状态: 已重置";
            updatePhysicsState();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
