<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惯性演示：匀速行驶的车中跳跃</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 主容器：Flex布局，左右结构 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左侧画布区域 */
        .canvas-area {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 60%, #555 60%, #333 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右侧控制区 */
        .controls-area {
            width: 300px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            font-size: 1.2rem;
        }

        .control-group {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .value-display {
            float: right;
            color: var(--accent-color);
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: #555;
            margin-top: 10px;
        }
        
        button.secondary:hover {
            background-color: #666;
        }

        .legend {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .info-box {
            margin-top: auto;
            font-size: 0.8rem;
            color: #aaa;
            border-top: 1px solid #444;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="canvas-area" id="canvasContainer">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="controls-area">
        <h2>控制面板</h2>

        <div class="control-group">
            <button id="jumpBtn">🕴️ 跳跃 (Jump)</button>
        </div>

        <div class="control-group">
            <label>行驶速度 (km/h) <span id="speedVal" class="value-display">60</span></label>
            <input type="range" id="speedRange" min="0" max="150" value="60">
        </div>

        <div class="control-group">
            <label>跳跃力度 <span id="forceVal" class="value-display">中</span></label>
            <input type="range" id="forceRange" min="10" max="25" value="18">
        </div>

        <div class="control-group legend">
            <label>图例说明：</label>
            <div><span class="dot" style="background:red;"></span> 相对轨迹 (人眼中的直线)</div>
            <div><span class="dot" style="background:yellow;"></span> 绝对轨迹 (路人眼中的抛物线)</div>
        </div>

        <button id="resetBtn" class="secondary">重置模拟</button>

        <div class="info-box">
            <p><strong>原理说明：</strong><br>人跳起前具有与车相同的水平速度。跳起后，水平方向不受外力（忽略空气阻力），根据牛顿第一定律，水平速度保持不变，因此会落在车内原地。</p>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    // 状态变量
    let animationId;
    let width, height;
    let groundY;
    
    // 物理参数
    const gravity = 0.8;
    
    // 实体对象
    const car = {
        w: 300,
        h: 120,
        x: 0, // 屏幕中心计算
        y: 0,
        wheelSize: 25,
        speed: 5 // 像素/帧
    };

    const person = {
        w: 20,
        h: 60,
        relativeX: 0, // 相对于车的中心
        y: 0,
        vy: 0,
        isJumping: false,
        trailRelative: [], // 相对轨迹
        trailAbsolute: []  // 绝对轨迹
    };

    // 背景对象（用于产生移动感）
    let trees = [];
    let roadMarkers = [];

    // DOM 元素
    const speedInput = document.getElementById('speedRange');
    const speedDisplay = document.getElementById('speedVal');
    const forceInput = document.getElementById('forceRange');
    const forceDisplay = document.getElementById('forceVal');
    const jumpBtn = document.getElementById('jumpBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 初始化
    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        // 初始化背景元素
        for(let i=0; i<5; i++) {
            trees.push({x: i * 300, h: 50 + Math.random() * 50});
        }
        for(let i=0; i<10; i++) {
            roadMarkers.push({x: i * 200});
        }

        loop();
    }

    function resize() {
        width = container.clientWidth;
        height = container.clientHeight;
        canvas.width = width;
        canvas.height = height;
        
        groundY = height * 0.6; // 地面位置
        car.x = width / 2 - car.w / 2; // 车始终在屏幕中间
        car.y = groundY - car.h - car.wheelSize;
        
        resetPerson();
    }

    function resetPerson() {
        person.relativeX = car.w / 2 - person.w / 2;
        person.y = car.y - person.h;
        person.vy = 0;
        person.isJumping = false;
        person.trailRelative = [];
        person.trailAbsolute = [];
    }

    // 事件监听
    speedInput.addEventListener('input', (e) => {
        // 将km/h 粗略转换为 像素/帧 用于演示
        const val = parseInt(e.target.value);
        speedDisplay.innerText = val;
        car.speed = val * 0.15; 
    });

    forceInput.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        let text = "弱";
        if(val > 15) text = "中";
        if(val > 20) text = "强";
        forceDisplay.innerText = text;
    });

    jumpBtn.addEventListener('click', () => {
        if (!person.isJumping) {
            person.vy = -parseInt(forceInput.value);
            person.isJumping = true;
            // 清空旧轨迹
            person.trailRelative = [];
            person.trailAbsolute = [];
        }
    });

    resetBtn.addEventListener('click', () => {
        resetPerson();
    });

    // 逻辑更新
    function update() {
        // 1. 背景移动（模拟车在动，其实是背景在向左退）
        // 只有当车速大于0时背景才动
        if (car.speed > 0) {
            trees.forEach(t => {
                t.x -= car.speed;
                if (t.x < -100) t.x = width + 100;
            });
            roadMarkers.forEach(m => {
                m.x -= car.speed;
                if (m.x < -100) m.x = width + 100;
            });
        }

        // 2. 人物物理逻辑
        // 人在X轴始终跟随车（因为有相同的水平速度），除非我们想模拟空气阻力，这里忽略空气阻力
        // 所以 person.x (绝对) = car.x + person.relativeX
        // 但为了画出“绝对轨迹”，我们需要模拟一个虚拟的X位移
        
        if (person.isJumping) {
            person.y += person.vy;
            person.vy += gravity;

            // 落地检测
            if (person.y >= car.y - person.h) {
                person.y = car.y - person.h;
                person.isJumping = false;
                person.vy = 0;
            }

            // 记录轨迹
            // 相对轨迹：相对于车的位置
            person.trailRelative.push({
                x: car.x + person.relativeX + person.w/2, 
                y: person.y + person.h/2
            });

            // 绝对轨迹：这就难办了，因为车在屏幕不动。
            // 为了视觉效果，我们让绝对轨迹向左偏移，模拟“车开过去了，轨迹留在空中”
            // 每一帧，旧的轨迹点都要向左移动 car.speed
            person.trailAbsolute.forEach(pt => {
                pt.x -= car.speed;
            });
            person.trailAbsolute.push({
                x: car.x + person.relativeX + person.w/2, 
                y: person.y + person.h/2
            });
        } else {
             // 即使没跳，为了让绝对轨迹随背景后退
             person.trailAbsolute.forEach(pt => {
                pt.x -= car.speed;
            });
        }
    }

    // 绘图
    function draw() {
        ctx.clearRect(0, 0, width, height);

        // 1. 画背景 (天空已在CSS中)
        // 画树
        ctx.fillStyle = '#2E7D32';
        trees.forEach(t => {
            ctx.beginPath();
            ctx.moveTo(t.x, groundY);
            ctx.lineTo(t.x + 30, groundY - t.h);
            ctx.lineTo(t.x + 60, groundY);
            ctx.fill();
        });

        // 2. 画路面
        ctx.fillStyle = '#555';
        ctx.fillRect(0, groundY, width, height - groundY);
        
        // 路面标线
        ctx.fillStyle = '#FFF';
        roadMarkers.forEach(m => {
            ctx.fillRect(m.x, groundY + 80, 100, 10);
        });

        // 3. 画车 (车身)
        ctx.fillStyle = '#FF5722'; // 橙色车身
        // 车体主体
        ctx.beginPath();
        ctx.roundRect(car.x, car.y, car.w, car.h, 10);
        ctx.fill();
        
        // 车窗（模拟内部）
        ctx.fillStyle = '#81D4FA'; // 玻璃色
        ctx.fillRect(car.x + 20, car.y + 10, car.w - 40, car.h - 50);

        // 车轮
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(car.x + 50, groundY - car.wheelSize, car.wheelSize, 0, Math.PI * 2);
        ctx.arc(car.x + car.w - 50, groundY - car.wheelSize, car.wheelSize, 0, Math.PI * 2);
        ctx.fill();
        
        // 轮毂动画 (转动效果)
        ctx.strokeStyle = '#CCC';
        ctx.lineWidth = 3;
        const rotation = (Date.now() / 100) * (car.speed * 0.2);
        [car.x + 50, car.x + car.w - 50].forEach(cx => {
            ctx.save();
            ctx.translate(cx, groundY - car.wheelSize);
            ctx.rotate(rotation);
            ctx.beginPath();
            ctx.moveTo(-15, 0); ctx.lineTo(15, 0);
            ctx.moveTo(0, -15); ctx.lineTo(0, 15);
            ctx.stroke();
            ctx.restore();
        });

        // 4. 画轨迹
        // 绝对轨迹 (黄色抛物线 - 路人视角)
        if (person.trailAbsolute.length > 0) {
            ctx.strokeStyle = 'yellow';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(person.trailAbsolute[0].x, person.trailAbsolute[0].y);
            for (let i = 1; i < person.trailAbsolute.length; i++) {
                ctx.lineTo(person.trailAbsolute[i].x, person.trailAbsolute[i].y);
            }
            ctx.stroke();
        }

        // 相对轨迹 (红色直线 - 车内视角)
        if (person.trailRelative.length > 0) {
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(person.trailRelative[0].x, person.trailRelative[0].y);
            for (let i = 1; i < person.trailRelative.length; i++) {
                ctx.lineTo(person.trailRelative[i].x, person.trailRelative[i].y);
            }
            ctx.stroke();
        }

        // 5. 画人
        const px = car.x + person.relativeX;
        const py = person.y;
        
        ctx.fillStyle = '#FFF';
        // 头
        ctx.beginPath();
        ctx.arc(px + person.w/2, py, 10, 0, Math.PI*2);
        ctx.fill();
        // 身体
        ctx.fillRect(px, py, person.w, person.h);
        // 手脚 (简单示意)
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 4;
        ctx.beginPath();
        // 如果在跳跃，手举起来
        if(person.isJumping) {
            ctx.moveTo(px, py + 10); ctx.lineTo(px - 10, py - 10);
            ctx.moveTo(px + person.w, py + 10); ctx.lineTo(px + person.w + 10, py - 10);
        } else {
            ctx.moveTo(px + person.w/2, py + 20); ctx.lineTo(px + person.w/2, py + 40);
        }
        ctx.stroke();

    }

    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }

    // 启动
    init();

</script>

</body>
</html>
