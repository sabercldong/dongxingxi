<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 光学演示 (全反射修复版)</title>
    <style>
        /* ============ 样式区 ============ */
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; background-color: #000; color: #fff; }
        
        #canvas-container {
            position: absolute; left: 0; top: 0; width: calc(100% - 300px); height: 100%; z-index: 1;
        }

        #ui-panel {
            position: absolute; right: 0; top: 0; width: 300px; height: 100%;
            background: #1e1e1e; padding: 20px; box-sizing: border-box;
            overflow-y: auto; z-index: 2; border-left: 1px solid #333;
        }

        #chart-container {
            position: absolute; top: 20px; left: 20px; width: 340px; height: 240px;
            background: rgba(255, 255, 255, 0.95); border-radius: 8px; padding: 10px;
            z-index: 100; cursor: move; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        h2 { border-bottom: 2px solid #4CAF50; padding-bottom: 10px; font-size: 18px; margin-top: 0; }
        .control-group { margin-bottom: 15px; background: #2a2a2a; padding: 10px; border-radius: 5px; }
        label { display: block; font-size: 14px; color: #ccc; margin-bottom: 5px; }
        .val-display { float: right; color: #4CAF50; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        #btn-start { background: #4CAF50; }
        #btn-pause { background: #FF9800; }
        #btn-reset { background: #f44336; }

        .legend-item { display: flex; align-items: center; margin-top: 5px; font-size: 12px; }
        .color-box { width: 15px; height: 15px; margin-right: 8px; border-radius: 2px; }

        #warning-msg { 
            background-color: rgba(255, 0, 0, 0.2); border: 1px solid #ff4444; 
            color: #ff4444; font-weight: bold; text-align: center; 
            display: none; margin-top: 10px; padding: 8px; border-radius: 4px;
        }
    </style>

    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-container" title="按住拖动">
        <canvas id="myChart"></canvas>
    </div>

    <div id="ui-panel">
        <h2>控制面板</h2>
        
        <div class="btn-row">
            <button id="btn-start">开始演示</button>
            <button id="btn-pause">暂停</button>
            <button id="btn-reset">还原</button>
        </div>

        <div class="control-group">
            <label>入射角 (θ1): <span id="disp-angle" class="val-display">45°</span></label>
            <input type="range" id="inp-angle" min="0" max="89.9" step="0.1" value="45">
        </div>

        <div class="control-group">
            <label>介质1 (上方 n1): <span id="disp-n1" class="val-display">1.5</span></label>
            <input type="range" id="inp-n1" min="1.0" max="2.5" step="0.01" value="1.5">
            <div style="font-size:12px; color:#aaa; margin-top:2px;">试试调大这个 (如 1.5)</div>
        </div>

        <div class="control-group">
            <label>介质2 (下方 n2): <span id="disp-n2" class="val-display">1.0</span></label>
            <input type="range" id="inp-n2" min="1.0" max="2.5" step="0.01" value="1.0">
            <div style="font-size:12px; color:#aaa; margin-top:2px;">试试调小这个 (如 1.0)</div>
        </div>

        <div class="control-group">
            <label>图例</label>
            <div class="legend-item"><div class="color-box" style="background:#ffff00"></div>入射光线</div>
            <div class="legend-item"><div class="color-box" style="background:#ff0000"></div>反射光线</div>
            <div class="legend-item"><div class="color-box" style="background:#00ffff"></div>折射光线</div>
            <div id="warning-msg">⚠️ 发生全反射!</div>
        </div>
    </div>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls, chart;
        let incidentRay, reflectedRay, refractedRay;
        // 默认设置为 n1 > n2 以便容易观察全反射
        let params = {
            angle: 45,
            n1: 1.5, // 玻璃
            n2: 1.0, // 空气
            animating: false,
            animSpeed: 0.5,
            animDir: 1
        };

        // ================= 初始化 =================
        window.onload = function() {
            if (typeof THREE === 'undefined') {
                alert('错误：未检测到 three.min.js'); return;
            }
            // 更新输入框初始值
            document.getElementById('inp-n1').value = params.n1;
            document.getElementById('inp-n2').value = params.n2;
            
            init3D();
            initChart();
            animate();
        };

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // 相机
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 5, 25);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 控制器
            const OrbitControlsConstructor = THREE.OrbitControls || window.OrbitControls;
            if (OrbitControlsConstructor) {
                controls = new OrbitControlsConstructor(camera, renderer.domElement);
                controls.enableDamping = true;
            }

            // 辅助元素
            scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
            
            // 介质块 (下方)
            const geometryBlock = new THREE.BoxGeometry(10, 5, 5);
            const materialBlock = new THREE.MeshBasicMaterial({ 
                color: 0x00aaff, transparent: true, opacity: 0.2, side: THREE.DoubleSide
            });
            const block = new THREE.Mesh(geometryBlock, materialBlock);
            block.position.y = -2.5; 
            scene.add(block);

            // 界面线 & 法线
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-10,0,0), new THREE.Vector3(10,0,0)]);
            scene.add(new THREE.Line(lineGeo, lineMat));

            const normalMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.5, gapSize: 0.2 });
            const normalGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,6,0), new THREE.Vector3(0,-6,0)]);
            const normalLine = new THREE.Line(normalGeo, normalMat);
            normalLine.computeLineDistances();
            scene.add(normalLine);

            // 光线对象
            incidentRay = createRay(0xffff00); scene.add(incidentRay);
            reflectedRay = createRay(0xff0000); scene.add(reflectedRay);
            refractedRay = createRay(0x00ffff); scene.add(refractedRay);

            bindEvents();
            updatePhysics();
        }

        function createRay(color) {
            // 光线：圆柱体，原点在底部
            const geo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
            geo.translate(0, 0.5, 0); 
            const mat = new THREE.MeshBasicMaterial({ color: color });
            return new THREE.Mesh(geo, mat);
        }

        // ================= 核心物理计算 (修复了全反射逻辑) =================
        function updatePhysics() {
            // 1. 获取参数
            params.angle = parseFloat(document.getElementById('inp-angle').value);
            params.n1 = parseFloat(document.getElementById('inp-n1').value);
            params.n2 = parseFloat(document.getElementById('inp-n2').value);

            // 更新显示
            document.getElementById('disp-angle').textContent = params.angle.toFixed(1) + "°";
            document.getElementById('disp-n1').textContent = params.n1.toFixed(2);
            document.getElementById('disp-n2').textContent = params.n2.toFixed(2);

            const rad1 = params.angle * (Math.PI / 180);
            const n1 = params.n1;
            const n2 = params.n2;
            const len = 7;

            // 2. 入射光 (Incident) - 从第二象限射向原点
            // 计算起点
            const incX = -Math.sin(rad1) * len;
            const incY = Math.cos(rad1) * len;
            incidentRay.scale.set(1, len, 1);
            incidentRay.position.set(incX, incY, 0);
            incidentRay.lookAt(0,0,0);
            incidentRay.rotateX(Math.PI/2); // 修正Cylinder方向

            // 3. 反射光 (Reflected) - 永远存在
            const refX = Math.sin(rad1) * len;
            const refY = Math.cos(rad1) * len;
            reflectedRay.scale.set(1, len, 1);
            reflectedRay.position.set(0,0,0);
            reflectedRay.lookAt(refX, refY, 0);
            reflectedRay.rotateX(Math.PI/2);

            // 4. 折射光 (Refracted) - 关键修复
            const sinTheta2 = (n1 / n2) * Math.sin(rad1);
            
            const warningEl = document.getElementById('warning-msg');

            // 全反射判断条件：sinTheta2 的绝对值大于 1
            if (Math.abs(sinTheta2) > 1.0) {
                // === 全反射发生 ===
                refractedRay.visible = false; // 隐藏折射光
                warningEl.style.display = 'block';
                updateChartDot(params.angle, null); // 图表传入 null
            } else {
                // === 正常折射 ===
                refractedRay.visible = true;
                warningEl.style.display = 'none';

                const rad2 = Math.asin(sinTheta2);
                const deg2 = rad2 * (180 / Math.PI);

                // 折射光在第四象限 (x>0, y<0)
                const refrX = Math.sin(rad2) * len;
                const refrY = -Math.cos(rad2) * len;

                refractedRay.scale.set(1, len, 1);
                refractedRay.position.set(0,0,0);
                refractedRay.lookAt(refrX, refrY, 0);
                refractedRay.rotateX(Math.PI/2);
                
                updateChartDot(params.angle, deg2);
            }
        }

        // ================= 图表逻辑 =================
        function initChart() {
            if (typeof Chart === 'undefined') return;
            const ctx = document.getElementById('myChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '折射角曲线',
                            data: [],
                            borderColor: '#00ffff',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: false,
                            spanGaps: false // 关键：不允许跨越空值连线，这样全反射时线会断开
                        },
                        {
                            label: '当前状态',
                            data: [],
                            pointRadius: 6,
                            backgroundColor: 'red',
                            showLine: false
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: {
                        x: { type: 'linear', min: 0, max: 90, title:{display:true, text:'入射角'} },
                        y: { min: 0, max: 90, title:{display:true, text:'折射角'} }
                    }
                }
            });
            updateChartCurve();
        }

        let lastN1 = 0, lastN2 = 0;
        function updateChartCurve() {
            if (!chart) return;
            // 只有当n1或n2变化时才重算整条曲线
            if (lastN1 === params.n1 && lastN2 === params.n2) return;
            
            lastN1 = params.n1; lastN2 = params.n2;
            const data = [];
            for (let i = 0; i < 90; i++) {
                const rad = i * Math.PI / 180;
                const sin2 = (params.n1 / params.n2) * Math.sin(rad);
                
                if (Math.abs(sin2) <= 1.0) {
                    data.push({ x: i, y: Math.asin(sin2) * 180 / Math.PI });
                } else {
                    // 全反射区域：插入 null 使线条断开
                    data.push({ x: i, y: null });
                }
            }
            chart.data.datasets[0].data = data;
            chart.update();
        }

        function updateChartDot(x, y) {
            if (!chart) return;
            updateChartCurve(); // 检查是否需要更新背景曲线
            
            if (y === null) {
                // 全反射：不显示红点
                chart.data.datasets[1].data = [];
            } else {
                chart.data.datasets[1].data = [{ x: x, y: y }];
            }
            chart.update();
        }

        // ================= 交互与其他 =================
        function animate() {
            requestAnimationFrame(animate);
            if (params.animating) {
                let v = parseFloat(document.getElementById('inp-angle').value);
                v += params.animSpeed * params.animDir;
                if (v >= 89.9) params.animDir = -1;
                if (v <= 0.1) params.animDir = 1;
                document.getElementById('inp-angle').value = v;
                updatePhysics();
            }
            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        function bindEvents() {
            document.getElementById('btn-start').onclick = () => params.animating = true;
            document.getElementById('btn-pause').onclick = () => params.animating = false;
            document.getElementById('btn-reset').onclick = () => {
                params.animating = false;
                document.getElementById('inp-angle').value = 45;
                document.getElementById('inp-n1').value = 1.5;
                document.getElementById('inp-n2').value = 1.0;
                updatePhysics();
            };
            ['inp-angle','inp-n1','inp-n2'].forEach(id=>{
                document.getElementById(id).oninput = ()=>{
                    if(id==='inp-angle') params.animating=false;
                    updatePhysics();
                }
            });
            window.onresize = () => {
                const c = document.getElementById('canvas-container');
                camera.aspect = c.clientWidth / c.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(c.clientWidth, c.clientHeight);
            };
            
            // 简单的拖拽实现
            const d = document.getElementById('chart-container');
            let isD=false, ox, oy;
            d.onmousedown=(e)=>{isD=true; ox=e.clientX-d.offsetLeft; oy=e.clientY-d.offsetTop;}
            window.onmouseup=()=>{isD=false;}
            window.onmousemove=(e)=>{if(isD){ d.style.left=(e.clientX-ox)+'px'; d.style.top=(e.clientY-oy)+'px'; }}
        }
    </script>
</body>
</html>
