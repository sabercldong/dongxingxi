<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单缝衍射 - 真实衰减版</title>
    <style>
        :root {
            --bg-color: #000000;
            --control-bg: rgba(20, 20, 20, 0.9);
            --text-color: #e0e0e0;
            --accent-color: #00ff88;
            --slider-track: #333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* 画布容器 */
        .canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-width: 0; 
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右侧控制区 */
        .controls {
            width: 280px;
            padding: 25px;
            background-color: var(--control-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: -5px 0 20px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            letter-spacing: 1px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #bbb;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: monospace;
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent-color);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px var(--accent-color);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--slider-track);
            border-radius: 2px;
        }

        .info-box {
            margin-top: auto;
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            color: #888;
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #555;
            font-family: monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="canvas-container" id="container">
        <canvas id="simCanvas"></canvas>
        <div class="watermark">Single Slit Diffraction</div>
    </div>

    <div class="controls">
        <h2>单缝衍射实验</h2>

        <div class="control-group">
            <label>波长 (λ) <span id="lbl-lambda" class="val-display">532 nm</span></label>
            <input type="range" id="lambda" min="400" max="700" value="532" step="1">
        </div>

        <div class="control-group">
            <label>缝宽 (a) <span id="lbl-a" class="val-display">0.10 mm</span></label>
            <input type="range" id="a" min="0.05" max="0.30" step="0.01" value="0.10">
        </div>

        <div class="control-group">
            <label>屏间距 (L) <span id="lbl-L" class="val-display">1.0 m</span></label>
            <input type="range" id="L" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>显示亮度增强 <span id="lbl-boost" class="val-display">2.5</span></label>
            <input type="range" id="boost" min="1.0" max="5.0" step="0.1" value="2.5">
            <small style="color:#555; font-size:10px;">调整此项可观察暗淡的次级条纹</small>
        </div>

        <div class="info-box">
            <strong>观察重点：</strong><br>
            1. <strong>中央亮纹</strong>最宽且最亮。<br>
            2. 两侧条纹亮度<strong>迅速衰减</strong>。<br>
            3. 光线汇聚点指示<strong>第一级暗纹</strong>位置 (中央亮纹的边界)。
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');

    const ui = {
        lambda: document.getElementById('lambda'),
        a: document.getElementById('a'),
        L: document.getElementById('L'),
        boost: document.getElementById('boost'),
        lblLambda: document.getElementById('lbl-lambda'),
        lblA: document.getElementById('lbl-a'),
        lblL: document.getElementById('lbl-L'),
        lblBoost: document.getElementById('lbl-boost')
    };

    let params = {
        lambda: 532, 
        a: 0.1,      
        L: 1.0,     
        boost: 2.5   
    };

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        draw();
    }
    const resizeObserver = new ResizeObserver(() => resize());
    resizeObserver.observe(container);

    function wavelengthToColor(wl) {
        let r, g, b;
        if (wl >= 380 && wl < 440) { r = -(wl - 440) / (440 - 380); g = 0; b = 1; }
        else if (wl >= 440 && wl < 490) { r = 0; g = (wl - 440) / (490 - 440); b = 1; }
        else if (wl >= 490 && wl < 510) { r = 0; g = 1; b = -(wl - 510) / (510 - 490); }
        else if (wl >= 510 && wl < 580) { r = (wl - 510) / (580 - 510); g = 1; b = 0; }
        else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / (645 - 580); b = 0; }
        else if (wl >= 645 && wl <= 780) { r = 1; g = 0; b = 0; }
        else { r = 0; g = 0; b = 0; }
        return `rgb(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)})`;
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const w = canvas.width;
        const h = canvas.height;
        if (w === 0 || h === 0) return;

        const cy = h / 2;
        const color = wavelengthToColor(params.lambda);
        document.documentElement.style.setProperty('--accent-color', color);

        // --- 布局计算 ---
        const sourceX = w * 0.1; 
        const slitX = w * 0.3;   

        // 动态计算屏幕位置 (根据 L)
        const minScreenPos = w * 0.5;
        const maxScreenPos = w * 0.85;
        const lPercent = (params.L - 0.5) / (2.0 - 0.5); 
        const screenX = minScreenPos + lPercent * (maxScreenPos - minScreenPos);

        // 条纹显示区域宽度
        let patternWidth = Math.floor(w - screenX);
        if (patternWidth < 1) patternWidth = 1;

        // --- 物理计算关键参数 ---
        // 我们需要定义一个比例尺：多少像素代表屏幕上的1毫米
        // 假设屏幕高度 h 对应物理尺寸 0.1米 (10cm)，以便观察细节
        const physicalScreenHeight = 0.15; // 米
        const pixelsPerMeter = h / physicalScreenHeight;

        // 计算第一级暗纹的位置 (First Minimum)
        // condition: a * sin(theta) = lambda
        // y = L * tan(theta) ≈ L * sin(theta) = L * lambda / a
        // 注意单位转换：a(mm->m), lambda(nm->m)
        const y_min_meters = (params.L * params.lambda * 1e-9) / (params.a * 1e-3);
        const y_min_pixels = y_min_meters * pixelsPerMeter;


        // --- 绘制几何示意图 ---
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        // 中心轴
        ctx.beginPath();
        ctx.strokeStyle = '#333';
        ctx.setLineDash([5, 5]);
        ctx.moveTo(sourceX, cy);
        ctx.lineTo(screenX, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // 光源
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(sourceX, cy, 5, 0, Math.PI * 2);
        ctx.fill();

        // 挡板和缝 (视觉上的缝宽)
        // 单缝：上下各一个挡板，中间留空
        const visualScaleFactor = 200; 
        const slitGapVisual = params.a * visualScaleFactor; 
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        
        // 上挡板
        ctx.beginPath();
        ctx.moveTo(slitX, 0);
        ctx.lineTo(slitX, cy - slitGapVisual / 2);
        ctx.stroke();
        
        // 下挡板
        ctx.beginPath();
        ctx.moveTo(slitX, h);
        ctx.lineTo(slitX, cy + slitGapVisual / 2);
        ctx.stroke();

        // --- 绘制光线 (指示第一级暗纹) ---
        // 光线汇聚到中央亮纹的边缘 (第一暗纹处)
        // 这直观显示了中央亮纹的宽度
        const targetY = cy - y_min_pixels;

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.7;
        
        // 上边缘光线
        ctx.beginPath();
        ctx.moveTo(sourceX, cy);
        ctx.lineTo(slitX, cy - slitGapVisual / 2);
        ctx.lineTo(screenX, targetY);
        ctx.stroke();

        // 下边缘光线
        ctx.beginPath();
        ctx.moveTo(sourceX, cy);
        ctx.lineTo(slitX, cy + slitGapVisual / 2);
        ctx.lineTo(screenX, targetY);
        ctx.stroke();
        
        // 汇聚点标记
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(screenX, targetY, 3, 0, Math.PI*2);
        ctx.fill();
        
        ctx.globalAlpha = 1.0;

        // --- 绘制单缝衍射条纹 ---
        const imgData = ctx.createImageData(patternWidth, h);
        const data = imgData.data;

        // 提取RGB
        let rVal = 0, gVal = 0, bVal = 0;
        const rgbMatch = color.match(/rgb\((\d+),(\d+),(\d+)\)/);
        if (rgbMatch) {
            rVal = parseInt(rgbMatch[1]);
            gVal = parseInt(rgbMatch[2]);
            bVal = parseInt(rgbMatch[3]);
        }

        // 夫琅禾费衍射公式计算
        // I = I0 * (sin(beta) / beta)^2
        // beta = (pi * a * sin(theta)) / lambda
        
        for (let y = 0; y < h; y++) {
            let dy = Math.abs(y - cy); 
            let pos_m = dy / pixelsPerMeter; // 转回物理米
            
            // sin(theta) ≈ tan(theta) = pos / L
            let sinTheta = pos_m / params.L;
            
            // beta 计算
            let beta = (Math.PI * (params.a * 1e-3) * sinTheta) / (params.lambda * 1e-9);

            let intensity = 1.0;
            if (Math.abs(beta) > 1e-6) {
                intensity = Math.pow(Math.sin(beta) / beta, 2);
            }

            // 视觉校正 (Gamma Correction)
            // 单缝衍射的次级极大值非常暗 (0.047, 0.016...)
            // 必须进行非线性增强才能在屏幕上看到，否则只有一条线
            let visibleIntensity = Math.pow(intensity, 1 / params.boost);

            // 绘制一行
            for (let x = 0; x < patternWidth; x++) {
                let index = (y * patternWidth + x) * 4;
                
                // 简单的边缘虚化
                let alpha = 255;
                if (x < 10) alpha = x * 25;

                data[index] = rVal * visibleIntensity;     
                data[index + 1] = gVal * visibleIntensity; 
                data[index + 2] = bVal * visibleIntensity; 
                data[index + 3] = alpha;                   
            }
        }
        
        ctx.putImageData(imgData, screenX, 0);

        // 屏幕边框
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenX, 0);
        ctx.lineTo(screenX, h);
        ctx.stroke();
    }

    function update() {
        params.lambda = parseInt(ui.lambda.value);
        params.a = parseFloat(ui.a.value);
        params.L = parseFloat(ui.L.value);
        params.boost = parseFloat(ui.boost.value);

        ui.lblLambda.textContent = params.lambda + " nm";
        ui.lblA.textContent = params.a.toFixed(2) + " mm";
        ui.lblL.textContent = params.L.toFixed(1) + " m";
        ui.lblBoost.textContent = params.boost.toFixed(1);

        draw();
    }

    Object.values(ui).forEach(el => {
        if(el.tagName === 'INPUT') el.addEventListener('input', update);
    });

    setTimeout(() => { resize(); update(); }, 100);

</script>
</body>
</html>
