<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杨氏双缝干涉 - 教学演示版</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1a1a1a;
            --text-color: #eee;
            --accent-color: #00ffcc;
            --slider-bg: #333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* 画布区域 */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右侧控制面板 */
        .controls {
            width: 280px; /* 固定宽度 */
            padding: 25px;
            background-color: var(--panel-bg);
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 10;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #fff;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #bbb;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: monospace;
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 滑块样式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 5px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent-color);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px var(--accent-color);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--slider-bg);
            border-radius: 2px;
        }

        .info-box {
            margin-top: auto;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            color: #888;
        }

        .watermark {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: #444;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="canvas-container" id="container">
        <canvas id="simCanvas"></canvas>
        <div class="watermark">Young's Interference Demo</div>
    </div>

    <div class="controls">
        <h2>杨氏双缝干涉</h2>

        <div class="control-group">
            <label>波长 (λ) <span id="val-lambda" class="val-display">500 nm</span></label>
            <input type="range" id="lambda" min="400" max="700" value="500" step="1">
        </div>

        <div class="control-group">
            <label>双缝间距 (d) <span id="val-d" class="val-display">0.50 mm</span></label>
            <input type="range" id="d" min="0.2" max="1.5" step="0.05" value="0.5">
        </div>

        <div class="control-group">
            <label>屏间距 (L) <span id="val-L" class="val-display">1.0 m</span></label>
            <input type="range" id="L" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="info-box">
            <strong>演示说明：</strong><br>
            光线自动汇聚在<b>第一级明纹(n=1)</b>处。<br><br>
            观察：<br>
            1. 增大 L，屏幕右移，条纹变宽。<br>
            2. 减小 d，条纹变宽。<br>
            3. 波长越长(红)，条纹越宽。
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');

    const inputs = {
        lambda: document.getElementById('lambda'),
        d: document.getElementById('d'),
        L: document.getElementById('L')
    };
    
    const displays = {
        lambda: document.getElementById('val-lambda'),
        d: document.getElementById('val-d'),
        L: document.getElementById('val-L')
    };

    let params = {
        lambda: 500,
        d: 0.5,
        L: 1.0
    };

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        draw();
    }
    const resizeObserver = new ResizeObserver(() => resize());
    resizeObserver.observe(container);

    function wavelengthToColor(wl) {
        let r, g, b;
        if (wl >= 380 && wl < 440) { r = -(wl - 440) / (440 - 380); g = 0; b = 1; }
        else if (wl >= 440 && wl < 490) { r = 0; g = (wl - 440) / (490 - 440); b = 1; }
        else if (wl >= 490 && wl < 510) { r = 0; g = 1; b = -(wl - 510) / (510 - 490); }
        else if (wl >= 510 && wl < 580) { r = (wl - 510) / (580 - 510); g = 1; b = 0; }
        else if (wl >= 580 && wl < 645) { r = 1; g = -(wl - 645) / (645 - 580); b = 0; }
        else if (wl >= 645 && wl <= 780) { r = 1; g = 0; b = 0; }
        else { r = 0; g = 0; b = 0; }
        return `rgb(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)})`;
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;
        const cy = h / 2;

        const color = wavelengthToColor(params.lambda);
        document.documentElement.style.setProperty('--accent-color', color);

        // --- 坐标布局系统 (关键修改：屏幕位置动态化) ---
        
        // 双缝固定在左侧 20% 处
        const slitX = w * 0.2;
        
        // 屏幕位置根据 L 动态变化 (范围：画布宽度的 45% 到 85%)
        // L: 0.5m -> 2.0m 映射到 visual min -> max
        const minScreenPos = w * 0.45;
        const maxScreenPos = w * 0.85;
        const lPercent = (params.L - 0.5) / (2.0 - 0.5); // 0 到 1
        const screenX = minScreenPos + lPercent * (maxScreenPos - minScreenPos);

        // 衍射条纹显示区域 (屏幕右侧)
        const patternX = screenX + 5; 
        const patternWidth = w - patternX;

        // --- 1. 绘制几何物体 ---

        // 光轴 (虚线)
        ctx.strokeStyle = '#333';
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(slitX - 50, cy);
        ctx.lineTo(screenX, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // 双缝 (缝隙视觉宽度随参数变化)
        const visualD = params.d * 40; // 视觉放大系数
        const slitH = 4; // 缝的缺口高度
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        
        // 上板
        ctx.beginPath();
        ctx.moveTo(slitX, 0);
        ctx.lineTo(slitX, cy - visualD/2 - slitH);
        ctx.stroke();
        // 中板
        ctx.beginPath();
        ctx.moveTo(slitX, cy - visualD/2 + slitH);
        ctx.lineTo(slitX, cy + visualD/2 - slitH);
        ctx.stroke();
        // 下板
        ctx.beginPath();
        ctx.moveTo(slitX, cy + visualD/2 + slitH);
        ctx.lineTo(slitX, h);
        ctx.stroke();

        // 屏幕线 (随 L 移动)
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(screenX, 0);
        ctx.lineTo(screenX, h);
        ctx.stroke();

        // --- 2. 绘制光线 (自动汇聚) ---
        
        // 关键物理计算：第一级明纹的位置 y
        // y = (L * lambda) / d
        // 我们需要一个视觉比例尺，把物理单位转换成像素
        // 假设 visualScale: 1m (物理) 对应 (screenX - slitX) 像素
        const pixelDistance = screenX - slitX;
        // 让物理 L (例如1.0) 对应当前的 pixelDistance
        // 视觉条纹间距 dy_pixel = (lambda * pixelDistance) / (d * k) 
        // k 是一个调节系数，用来让条纹“变胖” (不那么密集)
        
        // 调节系数：数值越小，条纹越宽
        const densityFactor = 0.002; 
        
        // 计算第一级明纹在屏幕上的垂直偏移量 (像素)
        // Delta Y = (L * lambda) / d
        // 这里的公式经过视觉系数调整，直接用于绘图
        const fringeY_offset = (params.lambda * pixelDistance) / (params.d * 1000) * 0.8; 

        // 汇聚点坐标
        const targetY = cy - fringeY_offset; // 向上偏转 (对应上方第一条亮纹)

        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.8;
        
        // 上光线
        ctx.beginPath();
        ctx.moveTo(slitX, cy - visualD/2);
        ctx.lineTo(screenX, targetY);
        ctx.stroke();

        // 下光线
        ctx.beginPath();
        ctx.moveTo(slitX, cy + visualD/2);
        ctx.lineTo(screenX, targetY);
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // 绘制汇聚点标记
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(screenX, targetY, 4, 0, Math.PI*2);
        ctx.fill();

        // --- 3. 绘制干涉条纹 (Pattern) ---
        
        // 创建 ImageData
        // 确保宽度为正整数
        if (patternWidth <= 0) return;
        const imgData = ctx.createImageData(Math.floor(patternWidth), h);
        const data = imgData.data;

        // 颜色提取
        let r=0, g=0, b=0;
        const rgb = color.match(/\d+/g);
        if(rgb) { r = +rgb[0]; g = +rgb[1]; b = +rgb[2]; }

        for (let y = 0; y < h; y++) {
            let dy = y - cy;
            
            // 物理模拟：相位差
            // I = I0 * cos²( (π * d * y) / (L * λ) )
            // 为了让条纹和上面的光线对应，我们需要使用相同的几何比例
            // phase = (Math.PI * dy) / fringeY_offset; // 这样 dy = fringeY_offset 时，phase = PI，刚好是暗纹？
            // 实际上 y = Delta X 时，相位差是 2PI (光程差 lambda)
            
            // 修正公式：当 y = fringeY_offset (第一级明纹) 时，cos内部应该是 PI (光程差lambda/2? 不，光程差lambda对应2PI)
            // 简单的 cos 模拟：
            // cos(0) = 1 (中心亮)
            // cos(PI) = -1 (平方后亮) -> 这是第二级?
            // 我们需要 period 对应 fringeY_offset
            
            let intensity = Math.pow(Math.cos(Math.PI * dy / fringeY_offset), 2);

            // 绘制一行
            for (let x = 0; x < patternWidth; x++) {
                let idx = (y * Math.floor(patternWidth) + x) * 4;
                
                // 简单的边缘渐变
                let alpha = (x < 10) ? x * 25 : 255;
                
                data[idx] = r * intensity;
                data[idx+1] = g * intensity;
                data[idx+2] = b * intensity;
                data[idx+3] = alpha;
            }
        }
        ctx.putImageData(imgData, patternX, 0);
    }

    function update() {
        params.lambda = parseInt(inputs.lambda.value);
        params.d = parseFloat(inputs.d.value);
        params.L = parseFloat(inputs.L.value);

        displays.lambda.textContent = params.lambda + " nm";
        displays.d.textContent = params.d.toFixed(2) + " mm";
        displays.L.textContent = params.L.toFixed(1) + " m";

        draw();
    }

    Object.values(inputs).forEach(el => el.addEventListener('input', update));

    // 初始化
    update();

</script>
</body>
</html>
