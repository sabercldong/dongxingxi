<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 肥皂膜干涉 (Chart.js + Three.js)</title>
    <style>
        /* 全局样式 */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        /* 1. 主3D容器 */
        #canvas-container { 
            position: absolute; left: 0; top: 0; 
            width: calc(100vw - 260px); /* 留出右侧面板宽度 */
            height: 100vh; 
            display: block; 
        }

        /* 2. 右侧功能区 (替代 dat.gui) */
        #control-panel {
            position: absolute; right: 0; top: 0; bottom: 0;
            width: 260px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto; /* 允许滚轮 */
            color: #eee;
            z-index: 10;
        }

        .panel-group { margin-bottom: 25px; }
        .panel-label { display: block; margin-bottom: 8px; font-size: 14px; color: #bbb; }
        .panel-value { float: right; color: #fff; font-weight: bold; }
        
        /* 自定义滑块样式 */
        input[type=range] {
            width: 100%; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #4caf50; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; background: #444; border-radius: 2px;
        }
        
        /* 4. 还原按钮 */
        #reset-btn {
            width: 100%; padding: 10px; margin-top: 10px;
            background: #444; color: white; border: none; border-radius: 4px;
            cursor: pointer; transition: 0.2s;
        }
        #reset-btn:hover { background: #666; }

        /* 5. 左上角图表 (Chart.js 容器) */
        #chart-wrapper {
            position: absolute; top: 20px; left: 20px;
            width: 360px; height: 240px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #555;
            border-radius: 8px;
            z-index: 100;
            cursor: move; /* 抓手图标 */
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #chart-title { text-align: center; color: #ddd; font-size: 12px; margin-bottom: 5px; pointer-events: none; }
        /* 错误提示 */
        #error-msg { 
            position: absolute; top: 0; left: 0; width: 100%; background: #a00; color: white; 
            padding: 10px; display: none; z-index: 9999; 
        }
    </style>

    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./chart.min.js"></script>
</head>
<body>

    <div id="error-msg"></div>

    <div id="canvas-container"></div>

    <div id="chart-wrapper">
        <div id="chart-title">干涉强度 vs 膜厚度 (RGB)</div>
        <canvas id="myChart"></canvas>
    </div>

    <div id="control-panel">
        <h3 style="margin-top:0; border-bottom:1px solid #444; padding-bottom:10px;">肥皂膜参数</h3>
        
        <div class="panel-group">
            <label class="panel-label">基础厚度 (nm) <span id="val-thickness" class="panel-value">400</span></label>
            <input type="range" id="inp-thickness" min="100" max="1000" step="10" value="400">
        </div>

        <div class="panel-group">
            <label class="panel-label">折射率 <span id="val-refractive" class="panel-value">1.33</span></label>
            <input type="range" id="inp-refractive" min="1.0" max="2.0" step="0.01" value="1.33">
        </div>

        <div class="panel-group">
            <label class="panel-label">流动速度 <span id="val-speed" class="panel-value">1.0</span></label>
            <input type="range" id="inp-speed" min="0" max="5.0" step="0.1" value="1.0">
        </div>

        <div class="panel-group">
            <label class="panel-label">表面扰动 <span id="val-noise" class="panel-value">0.2</span></label>
            <input type="range" id="inp-noise" min="0" max="1.0" step="0.05" value="0.2">
        </div>

        <hr style="border:0; border-top:1px solid #444; margin: 20px 0;">
        <button id="reset-btn">还原设置</button>
        
        <div style="margin-top:20px; font-size:12px; color:#666;">
            提示: <br>
            - 左键: 旋转<br>
            - 右键: 平移<br>
            - 滚轮: 缩放<br>
            - 左上角图表可拖拽
        </div>
    </div>

    <script>
        // 错误捕捉
        window.onerror = function(msg) {
            var el = document.getElementById('error-msg');
            el.style.display = 'block';
            el.innerHTML = "错误: " + msg + "<br>请检查文件 chart.min.js, OrbitControls.js, three.min.js 是否存在且版本正确。";
        };

        // 全局变量
        var scene, camera, renderer, controls;
        var soapFilm, uniforms, clock;
        var myChart; // Chart.js 实例

        // 参数状态
        var params = {
            thickness: 400,
            refractiveIndex: 1.33,
            speed: 1.0,
            noiseStrength: 0.2
        };

        // 初始相机位置
        var initialCamPos = { x: 0, y: 0, z: 14 };

        window.onload = function() {
            // 简单检查库是否加载
            if(typeof THREE === 'undefined') throw "Three.js 未加载";
            if(typeof Chart === 'undefined') throw "Chart.js 未加载";
            
            // 兼容性处理 OrbitControls
            if (typeof THREE.OrbitControls === 'undefined') {
                if (typeof OrbitControls !== 'undefined') THREE.OrbitControls = OrbitControls;
            }

            init3D();
            initChart();
            initUI();
            animate();
        };

        // --- 1. 3D 场景初始化 ---
        function init3D() {
            var container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(initialCamPos.x, initialCamPos.y, initialCamPos.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 控制器
            if(THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }

            // 创建肥皂膜
            createSoapFilm();
            
            // 响应窗口大小
            window.addEventListener('resize', function() {
                var w = container.clientWidth;
                var h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        }

        function createSoapFilm() {
            // Shader 代码：模拟薄膜干涉
            var vs = `
                varying vec2 vUv;
                varying vec3 vViewPosition;
                varying vec3 vNormal;
                uniform float uTime;
                uniform float uSpeed;
                uniform float uNoiseStrength;

                // 噪声函数
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy) );
                    vec2 x0 = v -   i + dot(i, C.xx);
                    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                    m = m*m ; m = m*m ;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                    vec3 g;
                    g.x  = a0.x  * x0.x  + h.x  * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }

                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    
                    // 动态波动
                    vec3 pos = position;
                    float n = snoise(uv * 2.5 + vec2(0.0, uTime * 0.1 * uSpeed));
                    pos.z += n * uNoiseStrength;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            var fs = `
                varying vec2 vUv;
                varying vec3 vViewPosition;
                varying vec3 vNormal;

                uniform float uThickness; 
                uniform float uRefractiveIndex;
                uniform float uTime;
                uniform float uSpeed;

                // 物理光学：计算RGB干涉强度
                vec3 interference(float opd) {
                    // R=650nm, G=530nm, B=450nm
                    float r = 0.5 + 0.5 * cos(opd / 650.0 * 6.28318);
                    float g = 0.5 + 0.5 * cos(opd / 530.0 * 6.28318);
                    float b = 0.5 + 0.5 * cos(opd / 450.0 * 6.28318);
                    return vec3(r, g, b);
                }

                void main() {
                    vec3 viewDir = normalize(vViewPosition);
                    vec3 normal = normalize(vNormal);
                    float cosTheta = abs(dot(viewDir, normal));
                    
                    // 模拟重力流动效果：下方(y=0)厚，上方(y=1)薄
                    // 加入一点正弦扰动让厚度分布不那么死板
                    float flow = vUv.y + uTime * 0.05 * uSpeed;
                    float thicknessMap = (1.0 - vUv.y) * 1.5 + 0.2 * sin(flow * 10.0);
                    float d = uThickness * max(0.1, thicknessMap);

                    // 光程差 OPD ≈ 2 * n * d * cos(theta)
                    float opd = 2.0 * uRefractiveIndex * d * cosTheta;

                    vec3 color = interference(opd);
                    
                    // 菲涅尔边缘高光
                    float fresnel = pow(1.0 - cosTheta, 3.0);
                    color += vec3(0.3) * fresnel;

                    gl_FragColor = vec4(color, 0.9);
                }
            `;

            uniforms = {
                uTime: { value: 0 },
                uThickness: { value: params.thickness },
                uRefractiveIndex: { value: params.refractiveIndex },
                uSpeed: { value: params.speed },
                uNoiseStrength: { value: params.noiseStrength }
            };

            var geometry = new THREE.PlaneGeometry(10, 10, 128, 128);
            var material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vs,
                fragmentShader: fs,
                transparent: true,
                side: THREE.DoubleSide
            });

            soapFilm = new THREE.Mesh(geometry, material);
            scene.add(soapFilm);

            // 边框
            var border = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.PlaneGeometry(10, 10)),
                new THREE.LineBasicMaterial({ color: 0x666666 })
            );
            scene.add(border);

            clock = new THREE.Clock();
        }

        // --- 2. Chart.js 初始化与更新 ---
        function initChart() {
            var ctx = document.getElementById('myChart').getContext('2d');
            
            // 初始化空数据，稍后在 updateChartData 填充
            var initialData = {
                labels: [], // X轴：厚度
                datasets: [
                    { label: 'Red (650nm)', data: [], borderColor: 'rgb(255, 99, 132)', borderWidth: 1, pointRadius: 0, fill: false },
                    { label: 'Green (530nm)', data: [], borderColor: 'rgb(75, 192, 192)', borderWidth: 1, pointRadius: 0, fill: false },
                    { label: 'Blue (450nm)', data: [], borderColor: 'rgb(54, 162, 235)', borderWidth: 1, pointRadius: 0, fill: false }
                ]
            };

            myChart = new Chart(ctx, {
                type: 'line',
                data: initialData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, // 禁用动画以提高性能
                    scales: {
                        x: { display: true, title: {display: true, text: '光程差 (nm)'}, ticks: { color: '#888' } },
                        y: { display: false, min: 0, max: 1.1 }
                    },
                    plugins: {
                        legend: { labels: { color: '#ccc', boxWidth: 10 } }
                    }
                }
            });

            updateChartData(); // 首次填充
            setupDraggable(); // 启用拖动
        }

        function updateChartData() {
            if (!myChart) return;

            // 我们绘制 光程差(OPD) vs 强度 的图
            // X轴范围：0 到 2000nm (典型的薄膜干涉范围)
            var points = 100;
            var maxOPD = 2000;
            
            var labels = [];
            var dataR = [];
            var dataG = [];
            var dataB = [];

            for (var i = 0; i <= points; i++) {
                var opd = (i / points) * maxOPD;
                labels.push(Math.round(opd));

                // 干涉公式 I = cos^2(delta/2) = 0.5 + 0.5*cos(delta)
                // delta = 2*PI*OPD/lambda
                var ir = 0.5 + 0.5 * Math.cos(2 * Math.PI * opd / 650);
                var ig = 0.5 + 0.5 * Math.cos(2 * Math.PI * opd / 530);
                var ib = 0.5 + 0.5 * Math.cos(2 * Math.PI * opd / 450);

                dataR.push(ir);
                dataG.push(ig);
                dataB.push(ib);
            }

            myChart.data.labels = labels;
            myChart.data.datasets[0].data = dataR;
            myChart.data.datasets[1].data = dataG;
            myChart.data.datasets[2].data = dataB;
            
            // 使用 Chart.js 的 update (不带动画)
            myChart.update('none');
        }

        // --- 3. UI 交互逻辑 ---
        function initUI() {
            var ids = ['thickness', 'refractive', 'speed', 'noise'];
            
            ids.forEach(function(key) {
                var el = document.getElementById('inp-' + key);
                var valDisplay = document.getElementById('val-' + key);
                
                el.addEventListener('input', function(e) {
                    var val = parseFloat(e.target.value);
                    params[key] = val;
                    valDisplay.innerText = val; // 更新数字显示
                    
                    // Chart更新：虽然图表显示的是理论光程差，但我们可以根据折射率微调显示范围(可选)
                    // 为简化，这里主要更新 3D Shader
                });
            });

            // 还原按钮
            document.getElementById('reset-btn').addEventListener('click', function() {
                // 重置数据
                params = { thickness: 400, refractiveIndex: 1.33, speed: 1.0, noiseStrength: 0.2 };
                
                // 重置滑块位置
                document.getElementById('inp-thickness').value = 400;
                document.getElementById('inp-refractive').value = 1.33;
                document.getElementById('inp-speed').value = 1.0;
                document.getElementById('inp-noise').value = 0.2;
                
                // 重置文字
                document.getElementById('val-thickness').innerText = 400;
                document.getElementById('val-refractive').innerText = 1.33;
                document.getElementById('val-speed').innerText = 1.0;
                document.getElementById('val-noise').innerText = 0.2;

                // 重置相机
                controls.reset();
            });
        }

        // --- 工具：图表拖拽 ---
        function setupDraggable() {
            var el = document.getElementById('chart-wrapper');
            var isDown = false, offX, offY;
            
            el.addEventListener('mousedown', function(e) {
                isDown = true;
                offX = e.clientX - el.offsetLeft;
                offY = e.clientY - el.offsetTop;
                el.style.cursor = 'grabbing';
            });
            
            window.addEventListener('mouseup', function() {
                isDown = false;
                el.style.cursor = 'move';
            });
            
            window.addEventListener('mousemove', function(e) {
                if (!isDown) return;
                el.style.left = (e.clientX - offX) + 'px';
                el.style.top = (e.clientY - offY) + 'px';
            });
        }

        // --- 4. 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            
            var dt = clock.getElapsedTime();

            // 更新 Shader 变量
            if (uniforms) {
                uniforms.uTime.value = dt;
                uniforms.uThickness.value = params.thickness;
                uniforms.uRefractiveIndex.value = params.refractiveIndex;
                uniforms.uSpeed.value = params.speed;
                uniforms.uNoiseStrength.value = params.noiseStrength;
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
