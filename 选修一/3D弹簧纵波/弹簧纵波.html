<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 弹簧纵波演示 (螺旋弹簧版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; background-color: #111; }
        
        /* 1. 功能区在右侧 */
        #control-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 250px;
            height: 100vh;
            background: rgba(30, 30, 30, 0.9);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        /* 5. 图表在左上角，且可以拖动 */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            height: 250px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 10px;
            cursor: move; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 20;
        }

        h2 { margin-top: 0; font-size: 18px; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px;}
        
        .control-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type=range] { width: 100%; cursor: pointer; }

        .btn-container { display: flex; justify-content: space-between; gap: 5px; }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #btn-play { background-color: #4CAF50; color: white; }
        #btn-pause { background-color: #FF9800; color: white; }
        #btn-reset { background-color: #f44336; color: white; }
        button:hover { opacity: 0.8; }
        
        #chart-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 30px;
            background: rgba(0,0,0,0.1);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        #chart-overlay:hover { background: rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-wrapper">
        <div id="chart-overlay" title="按住此处拖动"></div>
        <canvas id="waveChart"></canvas>
    </div>

    <div id="control-panel">
        <h2>控制面板</h2>
        
        <div class="btn-container">
            <button id="btn-play">开始</button>
            <button id="btn-pause">暂停</button>
            <button id="btn-reset">还原</button>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid #444; margin: 15px 0;">

        <div class="control-group">
            <label>振幅 (Amplitude): <span id="val-amp">1.5</span></label>
            <input type="range" id="slider-amp" min="0" max="5" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <label>频率 (Frequency): <span id="val-freq">1.0</span></label>
            <input type="range" id="slider-freq" min="0.1" max="5" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>波速/波数 (Wave Number): <span id="val-k">0.5</span></label>
            <input type="range" id="slider-k" min="0.1" max="2" step="0.1" value="0.5">
        </div>
        
        <div style="margin-top: auto; font-size: 12px; color: #888;">
            <p>提示：<br>弹簧已根据物理距离实时伸缩<br>左键旋转 / 右键平移</p>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let particles = []; 
        let springs = [];   
        let isPlaying = true;
        let time = 0;
        
        const particleCount = 20; // 减少一点数量以保证弹簧渲染性能
        const spacing = 2.0;      
        
        // 弹簧视觉参数
        const springRadius = 0.3; // 弹簧粗细
        const coils = 8;          // 每一段弹簧的圈数
        const pointsPerCoil = 12; // 每一圈由多少个点组成（平滑度）
        const totalPoints = coils * pointsPerCoil;

        let params = {
            amplitude: 1.5,
            frequency: 1.0,
            k: 0.5, 
            speed: 0.05 
        };

        let myChart;

        // ================= 初始化程序 =================
        initThree();
        initChart();
        initControls();
        initDrag();
        animate();

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // 调整相机位置
            camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 250) / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, renderer.domElement);
            }
            if(controls) {
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }

            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x333333);
            scene.add(gridHelper);

            // === 创建材质 ===
            const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0x00aaff, shininess: 100 });
            // 弹簧材质：使用白色或金属色
            const springMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc, linewidth: 2 });

            // === 生成小球和弹簧 ===
            for (let i = 0; i < particleCount; i++) {
                let x0 = (i - particleCount / 2) * spacing;
                
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                sphere.position.set(x0, 0, 0);
                sphere.castShadow = true;
                sphere.userData = { originalX: x0, index: i };
                scene.add(sphere);
                particles.push(sphere);

                // 如果不是第一个球，创建连接上一个球的弹簧
                if (i > 0) {
                    // 创建弹簧的 BufferGeometry
                    const geometry = new THREE.BufferGeometry();
                    const vertices = new Float32Array(totalPoints * 3);
                    
                    // 初始填充（暂时全是0，updatePhysics 会计算具体位置）
                    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                    
                    const line = new THREE.Line(geometry, springMaterial);
                    line.frustumCulled = false; // 防止弹簧拉长时消失
                    scene.add(line);

                    springs.push({ 
                        mesh: line, 
                        fromIndex: i-1, 
                        toIndex: i,
                        // 预计算 cos 和 sin 值以提高性能
                        spiralData: generateSpiralTemplate() 
                    });
                }
            }
            
            window.addEventListener('resize', onWindowResize, false);
        }

        // 预生成螺旋的 Y 和 Z 坐标模板（因为它们是不变的）
        function generateSpiralTemplate() {
            let data = [];
            for (let j = 0; j < totalPoints; j++) {
                const angle = (j / pointsPerCoil) * Math.PI * 2;
                data.push({
                    y: Math.cos(angle) * springRadius,
                    z: Math.sin(angle) * springRadius
                });
            }
            return data;
        }

        function initChart() {
            const ctx = document.getElementById('waveChart').getContext('2d');
            const initialData = new Array(particleCount).fill(0);
            const labels = Array.from({length: particleCount}, (_, i) => i + 1);

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '位移',
                        data: initialData,
                        backgroundColor: 'rgba(0, 170, 255, 0.6)',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        y: { min: -5, max: 5 },
                        x: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function initControls() {
            document.getElementById('btn-play').onclick = () => { isPlaying = true; };
            document.getElementById('btn-pause').onclick = () => { isPlaying = false; };
            document.getElementById('btn-reset').onclick = () => { 
                isPlaying = false; 
                time = 0; 
                updatePhysics(); 
                renderer.render(scene, camera);
            };

            const sliderAmp = document.getElementById('slider-amp');
            const sliderFreq = document.getElementById('slider-freq');
            const sliderK = document.getElementById('slider-k');

            sliderAmp.addEventListener('input', (e) => {
                params.amplitude = parseFloat(e.target.value);
                document.getElementById('val-amp').innerText = params.amplitude;
                myChart.options.scales.y.min = -params.amplitude * 1.5;
                myChart.options.scales.y.max = params.amplitude * 1.5;
            });

            sliderFreq.addEventListener('input', (e) => {
                params.frequency = parseFloat(e.target.value);
                document.getElementById('val-freq').innerText = params.frequency;
            });

            sliderK.addEventListener('input', (e) => {
                params.k = parseFloat(e.target.value);
                document.getElementById('val-k').innerText = params.k;
            });
        }

        function initDrag() {
            const elmnt = document.getElementById("chart-wrapper");
            const dragger = document.getElementById("chart-overlay");
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            dragger.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function onWindowResize() {
            camera.aspect = (window.innerWidth - 250) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
        }

        function updatePhysics() {
            let displacements = [];

            // 1. 更新所有小球位置
            particles.forEach((p, i) => {
                const x0 = p.userData.originalX;
                const displacement = params.amplitude * Math.cos(params.k * x0 - params.frequency * time);
                p.position.x = x0 + displacement;
                displacements.push(displacement);
            });

            // 2. 更新所有弹簧 (螺旋线)
            springs.forEach(spring => {
                const p1 = particles[spring.fromIndex].position;
                const p2 = particles[spring.toIndex].position;
                
                // 获取两个球的当前 X 坐标
                const startX = p1.x;
                const endX = p2.x;
                const currentLength = endX - startX;

                // 获取 Geometry 的位置属性数组
                const positions = spring.mesh.geometry.attributes.position.array;
                const spiralTemplate = spring.spiralData;

                // 重新计算螺旋线上的每一个点
                for (let j = 0; j < totalPoints; j++) {
                    // 进度 (0 到 1)
                    const progress = j / (totalPoints - 1);
                    
                    // X: 在 startX 和 endX 之间线性插值
                    positions[j * 3] = startX + progress * currentLength;
                    
                    // Y 和 Z: 使用预计算的螺旋偏移 (保持圆的半径不变，只拉长X)
                    positions[j * 3 + 1] = spiralTemplate[j].y;
                    positions[j * 3 + 2] = spiralTemplate[j].z;
                }

                // 标记属性需要更新
                spring.mesh.geometry.attributes.position.needsUpdate = true;
            });

            // 更新图表
            myChart.data.datasets[0].data = displacements;
            myChart.update('none');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying) {
                time += params.speed;
                updatePhysics();
            }
            if(controls) controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
