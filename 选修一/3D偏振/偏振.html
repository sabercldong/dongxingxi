<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 偏振演示 (修正版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; }
        
        #container { display: flex; width: 100vw; height: 100vh; }
        #canvas-wrapper { flex-grow: 1; position: relative; overflow: hidden; background: radial-gradient(circle at center, #222, #000); }
        
        /* 标签样式 */
        .scene-label {
            position: absolute;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            pointer-events: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        /* 右侧侧边栏 */
        #sidebar {
            width: 300px;
            background: #181818;
            border-left: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 20;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 10px 0; font-size: 18px; color: #4caf50; border-bottom: 2px solid #4caf50; padding-bottom: 5px; }
        
        .control-group { background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        
        input[type="range"] { width: 100%; margin: 10px 0; cursor: pointer; }
        
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 8px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; color: white;
            transition: 0.2s; font-size: 13px;
        }
        #btn-start { background: #2196F3; }
        #btn-pause { background: #FF9800; }
        #btn-reset { background: #F44336; }
        button:hover { opacity: 0.9; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        .highlight { color: #4caf50; font-weight: bold; font-family: monospace; font-size: 14px; }

        /* 左上角图表 */
        #chart-card {
            position: absolute;
            top: 20px; left: 20px;
            width: 320px; height: 240px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            cursor: grab;
            z-index: 100;
        }
        #chart-card:active { cursor: grabbing; border-color: #4caf50; }
        #chart-title { text-align: center; font-size: 12px; color: #888; margin-bottom: 5px; pointer-events: none; }
    </style>
</head>
<body>

<div id="container">
    <div id="canvas-wrapper">
        <div id="label-source" class="scene-label">光源 (垂直偏振)</div>
        <div id="label-polarizer" class="scene-label">检偏器 (旋转轴)</div>
        <div id="label-screen" class="scene-label">光屏</div>

        <div id="chart-card">
            <div id="chart-title">:: 拖动 :: 马吕斯定律 (I = I₀cos²θ)</div>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div id="sidebar">
        <h2>控制面板</h2>
        
        <div class="control-group">
            <label>运行控制</label>
            <div class="btn-row">
                <button id="btn-start">开始</button>
                <button id="btn-pause">暂停</button>
                <button id="btn-reset">还原</button>
            </div>
        </div>

        <div class="control-group">
            <label>检偏器角度: <span id="angle-text" class="highlight">0°</span></label>
            <input type="range" id="angle-slider" min="0" max="360" value="0" step="1">
            <div style="font-size: 12px; color: #888; margin-top:5px; line-height: 1.4;">
                现在的偏振片已正对光路。<br>
                拖动滑块旋转透光缝隙。
            </div>
        </div>

        <div class="control-group">
            <label>实时数据</label>
            <div class="stat-row">
                <span>透光率 (cos²θ):</span>
                <span id="trans-text" class="highlight">100%</span>
            </div>
            <div class="stat-row">
                <span>出射光强 (I):</span>
                <span id="intensity-text" class="highlight">1.00</span>
            </div>
        </div>
    </div>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="chart.min.js"></script>

<script>
let scene, camera, renderer, controls;
let isRunning = true;
let time = 0;

// 核心对象
let waveIn, waveOut;
let polarizerGroup; // 旋转容器
let polarizerMeshGroup; // 视觉模型容器
let screenMesh;

// 标签引用
let labelSource, labelPolarizer, labelScreen;

// 参数
const WAVE_NODES = 200;
const MAX_AMP = 2.5; 
let currentAngle = 0; // 弧度

// 图表
let intensityChart;
const chartBuffer = Array(30).fill(1);

function init() {
    const container = document.getElementById('canvas-wrapper');

    // 1. 场景
    scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0x404040, 2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(0, 10, 5);
    scene.add(dirLight);

    // 2. 相机 (调整角度以便观察“穿过”的效果)
    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(10, 8, 20); 
    camera.lookAt(0, 0, 0);

    // 3. 渲染器
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // 4. 控制器
    if (typeof THREE.OrbitControls !== 'undefined') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
    }

    createSceneObjects();
    initChart();
    setupUI();
    setupDraggableChart();
    
    window.addEventListener('resize', onResize);
    animate();
}

function createSceneObjects() {
    // 网格辅助
    const grid = new THREE.GridHelper(40, 40, 0x333333, 0x111111);
    scene.add(grid);

    // --- A. 光源框 (左侧) ---
    const sourceGeo = new THREE.BoxGeometry(0.5, 4, 0.5); // 沿Z轴压扁，沿Y轴拉长
    const sourceMat = new THREE.MeshBasicMaterial({ color: 0xff3333, wireframe: true });
    const sourceMesh = new THREE.Mesh(sourceGeo, sourceMat);
    sourceMesh.position.set(-15, 0, 0);
    scene.add(sourceMesh);

    // --- B. 偏振片 (核心修正处) ---
    polarizerGroup = new THREE.Group(); // 这是一个专门用来做“X轴旋转”的容器
    polarizerMeshGroup = new THREE.Group(); // 这里面放视觉模型
    
    // 1. 外框
    const rimGeo = new THREE.TorusGeometry(3.5, 0.2, 16, 50);
    const rimMat = new THREE.MeshPhongMaterial({ color: 0x999999 });
    const rim = new THREE.Mesh(rimGeo, rimMat);
    // 修正：将圆环旋转90度，使其面朝X轴
    rim.rotation.y = Math.PI / 2; 
    polarizerMeshGroup.add(rim);

    // 2. 栅格 (缝隙)
    const barMat = new THREE.MeshPhongMaterial({ color: 0xcccccc });
    for(let i = -2.5; i <= 2.5; i+=0.8) {
        // 创建长条
        const barGeo = new THREE.BoxGeometry(0.1, 6, 0.2); // 注意尺寸调整
        const bar = new THREE.Mesh(barGeo, barMat);
        // 位置偏移 (在Y轴分布是错的，应该是在Z轴分布)
        // 因为我们旋转了Rim，坐标系变了。
        // 简单方法：直接在世界坐标系思考，然后通过旋转父级来实现
        
        // 修正：让栅格本身就在YZ平面内生成
        // Z轴是宽度方向，Y轴是高度方向
        bar.position.set(0, 0, i); 
        polarizerMeshGroup.add(bar);
    }

    // 3. 红色指示箭头 (表示透光轴方向)
    // 箭头默认指向Y正方向
    const arrowDir = new THREE.Vector3(0, 1, 0);
    const arrowOrigin = new THREE.Vector3(0, -4, 0);
    const arrowHelper = new THREE.ArrowHelper(arrowDir, arrowOrigin, 8, 0xff0000, 0.5, 0.5);
    // 箭头也在YZ平面上，不需要额外旋转，因为它默认就在Y轴上
    polarizerMeshGroup.add(arrowHelper);

    // 将视觉模型放入旋转容器
    polarizerGroup.add(polarizerMeshGroup);
    scene.add(polarizerGroup);


    // --- C. 光屏 (右侧) ---
    const screenGeo = new THREE.PlaneGeometry(8, 8);
    const screenMat = new THREE.MeshPhongMaterial({ 
        color: 0x00ff00, 
        transparent: true, 
        opacity: 0.5,
        side: THREE.DoubleSide,
        emissive: 0x00ff00,
        emissiveIntensity: 0.5
    });
    screenMesh = new THREE.Mesh(screenGeo, screenMat);
    // 修正：光屏也要面朝X轴 (旋转90度)
    screenMesh.rotation.y = -Math.PI / 2;
    screenMesh.position.set(15, 0, 0);
    scene.add(screenMesh);


    // --- D. 波形 (Line) ---
    // 入射波 (左)
    const waveInGeo = new THREE.BufferGeometry();
    const posIn = new Float32Array(WAVE_NODES * 3);
    waveInGeo.setAttribute('position', new THREE.BufferAttribute(posIn, 3));
    waveIn = new THREE.Line(waveInGeo, new THREE.LineBasicMaterial({ color: 0xff4444, linewidth: 3 }));
    scene.add(waveIn);

    // 出射波 (右)
    const waveOutGeo = new THREE.BufferGeometry();
    const posOut = new Float32Array(WAVE_NODES * 3);
    waveOutGeo.setAttribute('position', new THREE.BufferAttribute(posOut, 3));
    waveOut = new THREE.Line(waveOutGeo, new THREE.LineBasicMaterial({ color: 0x44ff44, linewidth: 3 }));
    scene.add(waveOut);

    // 获取标签
    labelSource = document.getElementById('label-source');
    labelPolarizer = document.getElementById('label-polarizer');
    labelScreen = document.getElementById('label-screen');
}

function animate() {
    requestAnimationFrame(animate);

    if (isRunning) {
        time += 0.15;
        updatePhysics();
    }

    if(controls) controls.update();
    updateLabels();
    renderer.render(scene, camera);
}

function updatePhysics() {
    // 物理计算
    let cosTheta = Math.cos(currentAngle);
    let intensity = cosTheta * cosTheta;

    // UI 更新
    document.getElementById('trans-text').innerText = (intensity * 100).toFixed(0) + "%";
    document.getElementById('intensity-text').innerText = intensity.toFixed(2);
    
    if(screenMesh) {
        // 光屏闪烁效果
        screenMesh.material.opacity = 0.1 + (intensity * 0.6);
        screenMesh.material.emissiveIntensity = intensity * 0.8;
    }

    // 1. 入射波 (-15 -> 0), 始终在Y轴振动 (垂直偏振)
    const posIn = waveIn.geometry.attributes.position.array;
    for (let i = 0; i < WAVE_NODES; i++) {
        let x = -15 + (i / (WAVE_NODES - 1)) * 15;
        // 在Y轴方向振动
        let y = MAX_AMP * Math.sin(x - time);
        let z = 0;
        posIn[i*3] = x; posIn[i*3+1] = y; posIn[i*3+2] = z;
    }
    waveIn.geometry.attributes.position.needsUpdate = true;


    // 2. 出射波 (0 -> 15), 振动方向随偏振片旋转
    const posOut = waveOut.geometry.attributes.position.array;
    for (let i = 0; i < WAVE_NODES; i++) {
        let x = (i / (WAVE_NODES - 1)) * 15;
        
        let baseWave = Math.sin(x - time);
        // 振幅衰减 (马吕斯)
        let amp = MAX_AMP * cosTheta * baseWave;

        // 关键：出射光的振动平面与偏振片缝隙平行
        // currentAngle 是偏振片绕X轴旋转的角度
        // Y 和 Z 是横截面上的坐标
        let y = amp * Math.cos(currentAngle);
        let z = amp * Math.sin(currentAngle);

        posOut[i*3] = x; posOut[i*3+1] = y; posOut[i*3+2] = z;
    }
    waveOut.geometry.attributes.position.needsUpdate = true;

    // 3. 图表
    chartBuffer.push(intensity);
    chartBuffer.shift();
    if(intensityChart) {
        intensityChart.data.datasets[0].data = chartBuffer;
        intensityChart.update('none');
    }
}

function updateLabels() {
    // 将3D坐标投射到屏幕
    function project(obj, el, yOffset) {
        if(!obj) return;
        const v = new THREE.Vector3();
        obj.getWorldPosition(v);
        v.y += yOffset;
        v.project(camera);
        
        const x = (v.x * .5 + .5) * renderer.domElement.clientWidth;
        const y = (-(v.y * .5) + .5) * renderer.domElement.clientHeight;

        if(v.z > 1) { el.style.display = 'none'; } 
        else {
            el.style.display = 'block';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        }
    }
    project(scene.children.find(c => c.geometry && c.geometry.type === 'BoxGeometry'), labelSource, 2.5);
    project(polarizerGroup, labelPolarizer, 4.5);
    project(screenMesh, labelScreen, 4.5);
}

function setupUI() {
    document.getElementById('btn-start').onclick = () => isRunning = true;
    document.getElementById('btn-pause').onclick = () => isRunning = false;
    document.getElementById('btn-reset').onclick = () => {
        document.getElementById('angle-slider').value = 0;
        updateAngle(0);
        time = 0;
        isRunning = true;
    };
    
    document.getElementById('angle-slider').oninput = (e) => updateAngle(e.target.value);
}

function updateAngle(deg) {
    document.getElementById('angle-text').innerText = deg + "°";
    currentAngle = deg * (Math.PI / 180);
    
    // 修正：现在我们旋转的是整个 Group 绕 X 轴 (光轴)
    if(polarizerGroup) {
        polarizerGroup.rotation.x = currentAngle;
    }
    
    if(!isRunning) {
        updatePhysics();
        renderer.render(scene, camera);
        updateLabels();
    }
}

function initChart() {
    const ctx = document.getElementById('myChart').getContext('2d');
    intensityChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array(30).fill(''),
            datasets: [{
                data: chartBuffer,
                borderColor: '#4caf50',
                backgroundColor: 'rgba(76, 175, 80, 0.1)',
                borderWidth: 2,
                fill: true,
                pointRadius: 0,
                tension: 0.1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: { y: { min: 0, max: 1.1, display: true, grid:{color:'#333'} }, x: { display: false } },
            plugins: { legend: { display: false } }
        }
    });
}

function setupDraggableChart() {
    const card = document.getElementById('chart-card');
    let isDragging = false;
    let offset = {x:0, y:0};
    card.onmousedown = (e) => { isDragging = true; offset.x = e.clientX - card.offsetLeft; offset.y = e.clientY - card.offsetTop; card.style.zIndex=1000; };
    document.onmouseup = () => isDragging = false;
    document.onmousemove = (e) => {
        if(isDragging) {
            e.preventDefault();
            card.style.left = (e.clientX - offset.x) + 'px';
            card.style.top = (e.clientY - offset.y) + 'px';
        }
    };
}

function onResize() {
    const wrapper = document.getElementById('canvas-wrapper');
    camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
}

init();
</script>
</body>
</html>
