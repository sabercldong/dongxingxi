<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>杨氏双缝干涉实验 - 3D 模拟</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        
        /* 1. 3D 画布容器 */
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* 2. 右侧功能区 */
        #ui-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2, h3 { margin: 0 0 10px 0; text-align: center; color: #4db8ff; }
        
        .control-group {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }

        label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            justify-content: center; /* 修改：只有一个按钮时居中更好看，或者保持 space-between 也可以 */
            margin-top: 10px;
        }

        button {
            background: #4db8ff;
            border: none;
            padding: 8px 15px;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%; /* 修改：让还原按钮填满容器，或者去掉这行保持原样 */
        }
        button:hover { background: #209cee; }
        button.stop { background: #ff4d4d; }
        button.stop:hover { background: #e03030; }

        /* 5. 左上角可拖动图表 */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px; 
            /* 修改：增加了高度，防止横轴文字被切断 */
            height: 320px; 
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            padding: 10px;
            cursor: grab;
            z-index: 100;
        }
        #chart-wrapper:active { cursor: grabbing; }
        
        /* 拖动把手 */
        #drag-handle {
            width: 100%;
            height: 20px;
            background: #ddd;
            margin-bottom: 5px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
            color: #666;
            line-height: 20px;
            user-select: none;
        }
        
        /* 确保 canvas 不会溢出 */
        canvas {
            display: block;
            width: 100%;
            height: calc(100% - 25px); /* 减去把手的高度 */
        }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-wrapper">
        <div id="drag-handle">按住此处拖动图表</div>
        <canvas id="interferenceChart"></canvas>
    </div>

    <div id="ui-panel">
        <h2>双缝干涉控制台</h2>
        
        <div class="control-group">
            <h3>播放控制</h3>
            <div class="btn-group">
                <button id="btn-reset">还原</button>
            </div>
        </div>

        <div class="control-group">
            <label>波长 (λ): <span id="val-lambda">500</span> nm</label>
            <input type="range" id="slider-lambda" min="400" max="700" value="500">
        </div>

        <div class="control-group">
            <label>双缝间距 (d): <span id="val-d">20</span> μm</label>
            <input type="range" id="slider-d" min="5" max="50" step="0.5" value="20">
        </div>

        <div class="control-group">
            <label>缝屏距离 (L): <span id="val-L">10</span> m</label>
            <input type="range" id="slider-L" min="5" max="20" step="0.5" value="10">
        </div>
        
        <div class="control-group" style="font-size: 0.8em; color: #aaa;">
            <p>说明：<br>
            鼠标左键：旋转<br>
            鼠标右键：平移<br>
            滚轮：缩放<br>
            光源颜色随波长改变。</p>
        </div>
    </div>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let animationId;
        let isPlaying = true;
        let time = 0;

        // 物理参数
        const params = {
            lambda: 500, // nm
            d: 20,       // um
            L: 10        // m
        };

        // 3D 对象引用
        let screenMesh, particlesSystem;
        let slitWall, lightSourceMesh, sourceLight;
        let rayLinesGroup; 

        // 图表对象
        let myChart;

        // 辅助函数：将波长(nm)转换为近似的RGB颜色对象
        function getSpectralColor(wavelength) {
            let r, g, b;
            if (wavelength >= 380 && wavelength < 440) {
                r = -(wavelength - 440) / (440 - 380);
                g = 0.0;
                b = 1.0;
            } else if (wavelength >= 440 && wavelength < 490) {
                r = 0.0;
                g = (wavelength - 440) / (490 - 440);
                b = 1.0;
            } else if (wavelength >= 490 && wavelength < 510) {
                r = 0.0;
                g = 1.0;
                b = -(wavelength - 510) / (510 - 490);
            } else if (wavelength >= 510 && wavelength < 580) {
                r = (wavelength - 510) / (580 - 510);
                g = 1.0;
                b = 0.0;
            } else if (wavelength >= 580 && wavelength < 645) {
                r = 1.0;
                g = -(wavelength - 645) / (645 - 580);
                b = 0.0;
            } else if (wavelength >= 645 && wavelength <= 780) {
                r = 1.0;
                g = 0.0;
                b = 0.0;
            } else {
                r = 0.0; g = 0.0; b = 0.0;
            }
            return { r: r, g: g, b: b };
        }

        // ================= 1. 初始化 3D 场景 =================
        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-20, 15, 25);
            camera.lookAt(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, renderer.domElement);
            }
            if(controls) {
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }

            const gridHelper = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
            scene.add(ambientLight);

            createSceneObjects();
            
            window.addEventListener('resize', onWindowResize, false);
        }

        // ================= 创建物体 =================
        function createSceneObjects() {
            const centerY = 5;

            // 1. 光源 
            const sourceGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const sourceMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
            lightSourceMesh = new THREE.Mesh(sourceGeo, sourceMat);
            lightSourceMesh.position.set(0, centerY, -5); 
            scene.add(lightSourceMesh);

            sourceLight = new THREE.PointLight(0xffffff, 1.5, 30);
            lightSourceMesh.add(sourceLight);

            // 2. 双缝挡板
            const wallGeo = new THREE.BoxGeometry(20, 10, 0.2);
            const wallMat = new THREE.MeshPhongMaterial({ color: 0x333333, side: THREE.DoubleSide });
            slitWall = new THREE.Mesh(wallGeo, wallMat);
            slitWall.position.set(0, centerY, 0);
            scene.add(slitWall);

            // 模拟缝
            const slitGeo = new THREE.BoxGeometry(0.2, 4, 0.3);
            const slitMat = new THREE.MeshBasicMaterial({ color: 0x222222 }); 
            const slit1 = new THREE.Mesh(slitGeo, slitMat);
            const slit2 = new THREE.Mesh(slitGeo, slitMat);
            slit1.name = "slit1";
            slit2.name = "slit2";
            slitWall.add(slit1);
            slitWall.add(slit2);

            // 3. 接收屏
            const screenGeo = new THREE.PlaneGeometry(30, 15, 128, 64);
            const screenMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                vertexColors: true 
            });
            screenMesh = new THREE.Mesh(screenGeo, screenMat);
            scene.add(screenMesh);

            // 4. 光线
            rayLinesGroup = new THREE.Group();
            scene.add(rayLinesGroup);

            // 5. 粒子
            const particlesGeo = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                positions[i*3] = (Math.random() - 0.5) * 20; 
                positions[i*3+1] = Math.random() * 10;        
                positions[i*3+2] = Math.random() * params.L; 
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particlesMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.1,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            particlesSystem = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particlesSystem);

            updatePhysics();
        }

        // ================= 物理计算与更新 =================
        function updatePhysics() {
            // --- 0. 颜色同步 ---
            const specColor = getSpectralColor(params.lambda);
            const colorThree = new THREE.Color(specColor.r, specColor.g, specColor.b);

            lightSourceMesh.material.color = colorThree;
            sourceLight.color = colorThree;
            particlesSystem.material.color = colorThree;

            // --- 1. 缝位置 ---
            const slit1 = slitWall.getObjectByName("slit1");
            const slit2 = slitWall.getObjectByName("slit2");
            const visualD = params.d / 5; 
            
            if (slit1 && slit2) {
                slit1.position.set(-visualD / 2, 0, 0);
                slit2.position.set(visualD / 2, 0, 0);
            }

            // --- 2. 屏幕位置 ---
            screenMesh.position.z = params.L;
            screenMesh.position.y = 5; 

            // --- 3. 光线 ---
            while(rayLinesGroup.children.length > 0){ 
                rayLinesGroup.remove(rayLinesGroup.children[0]); 
            }

            const sourcePos = lightSourceMesh.position;
            const s1Pos = new THREE.Vector3(-visualD / 2, 5, 0);
            const s2Pos = new THREE.Vector3(visualD / 2, 5, 0);
            
            const lineMat = new THREE.LineBasicMaterial({ 
                color: colorThree, 
                transparent: true, 
                opacity: 0.4 
            });

            rayLinesGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([sourcePos, s1Pos]), lineMat));
            rayLinesGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([sourcePos, s2Pos]), lineMat));

            const rayCount = 20;
            const screenWidth = 30;
            for(let k=0; k<=rayCount; k++) {
                const targetX = -screenWidth/2 + (screenWidth * k / rayCount);
                const targetPos = new THREE.Vector3(targetX, 5, params.L);
                rayLinesGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([s1Pos, targetPos]), lineMat));
                rayLinesGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([s2Pos, targetPos]), lineMat));
            }

            // --- 4. 屏幕干涉条纹 ---
            const geometry = screenMesh.geometry;
            const positions = geometry.attributes.position;
            const colors = [];
            
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                // 干涉公式
                const theta = (Math.PI * params.d * x) / (params.lambda * params.L * 0.05); 
                let intensity = Math.pow(Math.cos(theta), 2);
                intensity *= Math.exp(-0.05 * Math.abs(x));

                colors.push(
                    specColor.r * intensity, 
                    specColor.g * intensity, 
                    specColor.b * intensity
                );
            }
            
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.attributes.color.needsUpdate = true;

            // --- 5. 更新图表 ---
            updateChart(specColor);
        }

        function animateWaves() {
            if (!isPlaying) return;
            time += 0.05;
            const positions = particlesSystem.geometry.attributes.position.array;
            for(let i=0; i< positions.length/3; i++) {
                positions[i*3+2] += 0.2; 
                if (positions[i*3+2] > params.L) {
                    positions[i*3+2] = 0;
                    positions[i*3] = (Math.random() - 0.5) * 20; 
                }
                const z = positions[i*3+2];
                positions[i*3+1] = 5 + Math.sin(z * 2 - time) * 0.2 + (Math.random()-0.5)*0.5;
            }
            particlesSystem.geometry.attributes.position.needsUpdate = true;
        }

        // ================= 2. 图表功能 (UI Fix) =================
        function initChart() {
            const ctx = document.getElementById('interferenceChart').getContext('2d');
            
            Chart.defaults.font.family = "'Segoe UI', 'Helvetica', 'Arial', sans-serif";
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], 
                    datasets: [{
                        label: '光强分布',
                        data: [],
                        borderColor: '#4db8ff',
                        backgroundColor: 'rgba(77, 184, 255, 0.2)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // 修改：增加图表内边距，防止标签贴边被切
                    layout: {
                        padding: {
                            left: 0,
                            right: 10,
                            top: 10,
                            bottom: 10
                        }
                    },
                    scales: {
                        x: { 
                            display: true,
                            title: {
                                display: true,
                                text: '屏幕位置 (x)',
                                font: { weight: 'bold', size: 12 },
                                color: '#333'
                            },
                            ticks: {
                                color: '#666',
                                maxTicksLimit: 10
                            },
                            grid: {
                                color: '#eee'
                            }
                        }, 
                        y: { 
                            beginAtZero: true,
                            max: 1.1,
                            title: {
                                display: true,
                                text: '相对光强 (I)',
                                font: { weight: 'bold', size: 12 },
                                color: '#333'
                            },
                            ticks: {
                                color: '#666',
                                stepSize: 0.2
                            },
                            grid: { color: '#ddd' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                        }
                    }
                }
            });
        }

        function updateChart(specColor) {
            if (!myChart) return;
            
            const dataPoints = [];
            const labels = [];
            const range = 15; 
            const step = 0.2;
            
            for (let x = -range; x <= range; x += step) {
                const theta = (Math.PI * params.d * x) / (params.lambda * params.L * 0.05);
                let intensity = Math.pow(Math.cos(theta), 2);
                intensity *= Math.exp(-0.05 * Math.abs(x));
                dataPoints.push(intensity);
                labels.push(x.toFixed(1));
            }

            myChart.data.labels = labels;
            myChart.data.datasets[0].data = dataPoints;
            
            const r = Math.floor(specColor.r * 255);
            const g = Math.floor(specColor.g * 255);
            const b = Math.floor(specColor.b * 255);
            
            myChart.data.datasets[0].borderColor = `rgba(${r}, ${g}, ${b}, 1)`;
            myChart.data.datasets[0].backgroundColor = `rgba(${r}, ${g}, ${b}, 0.2)`;

            myChart.update();
        }

        // ================= 3. 拖动功能 =================
        function initDraggable() {
            const wrapper = document.getElementById('chart-wrapper');
            const handle = document.getElementById('drag-handle');
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            handle.addEventListener('mousedown', (e) => {
                isDragging = true;
                offset.x = e.clientX - wrapper.offsetLeft;
                offset.y = e.clientY - wrapper.offsetTop;
            });
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    wrapper.style.left = (e.clientX - offset.x) + 'px';
                    wrapper.style.top = (e.clientY - offset.y) + 'px';
                }
            });
            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        // ================= UI 交互 =================
        function initUI() {
            const sliderLambda = document.getElementById('slider-lambda');
            const sliderD = document.getElementById('slider-d');
            const sliderL = document.getElementById('slider-L');
            
            const updateAll = () => {
                document.getElementById('val-lambda').innerText = params.lambda;
                document.getElementById('val-d').innerText = params.d;
                document.getElementById('val-L').innerText = params.L;
                updatePhysics();
            };

            sliderLambda.addEventListener('input', (e) => {
                params.lambda = parseFloat(e.target.value);
                updateAll();
            });
            sliderD.addEventListener('input', (e) => {
                params.d = parseFloat(e.target.value);
                updateAll();
            });
            sliderL.addEventListener('input', (e) => {
                params.L = parseFloat(e.target.value);
                updateAll();
            });

            // 已移除开始和暂停的监听器，只保留还原
            document.getElementById('btn-reset').addEventListener('click', () => {
                params.lambda = 500;
                params.d = 20;
                params.L = 10;
                sliderLambda.value = 500;
                sliderD.value = 20;
                sliderL.value = 10;
                camera.position.set(-20, 15, 25);
                camera.lookAt(0, 5, 10);
                controls.reset();
                updateAll();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            animateWaves();
            renderer.render(scene, camera);
        }

        window.onload = function() {
            if (typeof THREE === 'undefined' || typeof Chart === 'undefined') {
                alert("错误：请确保 three.min.js, OrbitControls.js 和 chart.min.js 与 html 文件在同一目录下。");
                return;
            }
            initThree();
            initChart();
            initDraggable();
            initUI();
            animate();
        };

    </script>
</body>
</html>
