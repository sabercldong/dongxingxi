<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物理动量与能量仿真 - 三滑块模型 (修复弹簧版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; }
        
        /* 布局容器 */
        #container { width: 100vw; height: 100vh; display: flex; }
        
        /* 3D 视图区 */
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; }
        
        /* 右侧功能区 */
        #sidebar {
            width: 320px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 10;
        }

        /* 题干样式 */
        .problem-text {
            background: #34495e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 4px solid #f1c40f;
        }

        /* 控件区域 */
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            font-size: 14px;
        }
        .btn-start { background-color: #27ae60; color: white; }
        .btn-start:hover { background-color: #2ecc71; }
        .btn-pause { background-color: #f39c12; color: white; }
        .btn-pause:hover { background-color: #f1c40f; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-reset:hover { background-color: #c0392b; }
        .btn-cut { background-color: #9b59b6; color: white; border: 1px solid #8e44ad; }
        .btn-cut:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        /* 状态显示 */
        .status-panel {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .status-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { color: #3498db; }

        /* 悬浮图表容器 */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            height: 250px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        #chart-header {
            padding: 8px 15px;
            background: #ddd;
            border-radius: 8px 8px 0 0;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            user-select: none;
        }
        #chart-body { flex-grow: 1; padding: 5px; position: relative; }
        .close-btn { cursor: pointer; color: #555; }
        .close-btn:hover { color: red; }
        
        /* 开关图表按钮 */
        #toggle-chart { margin-top: auto; background: #7f8c8d; color: white; }

    </style>
</head>
<body>

<div id="container">
    <div id="chart-wrapper">
        <div id="chart-header">
            <span>实时速度监控 (v-t图)</span>
            <span class="close-btn" onclick="toggleChart()">×</span>
        </div>
        <div id="chart-body">
            <canvas id="velocityChart"></canvas>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="sidebar">
        <h2>三滑块动量模型</h2>
        
        <div class="problem-text">
            <strong>题目描述：</strong><br>
            A、B、C 三个木块质量均为 m。B、C 间有轻质弹簧，用细线连接使弹簧压缩。A 以初速度 v0 撞击 B 并粘合。之后细线突然断开，弹簧伸展使 C 分离。
            <br><br>
            <strong>已知：</strong> C 最终速度恰为 v0。<br>
            <strong>求：</strong> 弹簧释放的势能。
        </div>

        <div class="controls">
            <button class="btn-start" onclick="startSim()">▶ 开始仿真</button>
            <button class="btn-pause" onclick="pauseSim()">⏸ 暂停</button>
            <button class="btn-cut" id="btn-cut" onclick="cutString()" disabled>✂ 切断细线 (自动/手动)</button>
            <button class="btn-reset" onclick="resetSim()">↺ 还原重置</button>
        </div>

        <div class="status-panel">
            <div class="status-row"><span>状态:</span> <span id="sim-state" class="val" style="color:white">准备就绪</span></div>
            <div class="status-row"><span>时间 (t):</span> <span id="sim-time" class="val">0.00</span> s</div>
            <hr style="border-color:#444">
            <div class="status-row"><span>速度 A:</span> <span id="vel-a" class="val">0.00</span></div>
            <div class="status-row"><span>速度 B:</span> <span id="vel-b" class="val">0.00</span></div>
            <div class="status-row"><span>速度 C:</span> <span id="vel-c" class="val">0.00</span></div>
        </div>

        <button id="toggle-chart" onclick="toggleChart()">显示/隐藏 图表</button>
    </div>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="chart.min.js"></script>

<script>
    // ================= 全局变量 =================
    let scene, camera, renderer, controls;
    let blockA, blockB, blockC, springLine, stringMesh;
    let floor, grid;
    let isRunning = false;
    let time = 0;
    
    // 物理参数
    const m = 1; 
    const v0 = 10; // 初始速度
    const boxSize = 2;
    const initialGapBC = 2.5; // 压缩状态下的B和C间距
    const naturalGapBC = 6.0; // 弹簧原长对应的间距
    
    // 状态机
    const STATE = {
        READY: 0,
        APPROACHING: 1, // A 接近 B
        MERGED: 2,      // A 撞上 B，ABC一起运动
        SEPARATING: 3,  // 线断了，弹簧弹开
        FINAL: 4        // C 离开
    };
    let currentState = STATE.READY;

    // 对象位置与速度
    let posA, posB, posC;
    let velA, velB, velC;

    // 图表相关
    let vChart;
    let chartData = { labels: [], a: [], b: [], c: [] };
    let frameCount = 0;

    // ================= 初始化 Three.js 场景 =================
    function init3D() {
        const container = document.getElementById('canvas-container');

        // 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.Fog(0xa0a0a0, 20, 100);

        // 相机
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 0, 0);

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 灯光
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff);
        dirLight.position.set(-3, 10, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 地面
        floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        grid = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        // 轨道控制器
        const OrbitControlsConstructor = THREE.OrbitControls || window.OrbitControls;
        if (OrbitControlsConstructor) {
            controls = new OrbitControlsConstructor(camera, renderer.domElement);
            controls.enableDamping = true;
        }

        createObjects();
        resetSim();
        window.addEventListener('resize', onWindowResize);
        animate();
    }

    // 创建物体
    function createObjects() {
        const geometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        
        // Block A (红色)
        blockA = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: 0xe74c3c }));
        blockA.castShadow = true;
        scene.add(blockA);

        // Block B (蓝色)
        blockB = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: 0x3498db }));
        blockB.castShadow = true;
        scene.add(blockB);

        // Block C (绿色)
        blockC = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: 0x2ecc71 }));
        blockC.castShadow = true;
        scene.add(blockC);

        // === 弹簧 (黄色螺旋线) ===
        // 预分配顶点，使用 LineLoop 提高性能
        const springPoints = 200; // 弹簧精度
        const positions = new Float32Array(springPoints * 3);
        const springGeo = new THREE.BufferGeometry();
        springGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const springMat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 3 }); // 黄色，显眼
        springLine = new THREE.Line(springGeo, springMat);
        springLine.frustumCulled = false; // 防止某些角度被裁切
        scene.add(springLine);

        // 细线 (白色直线)
        const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        stringMesh = new THREE.Line(lineGeo, lineMat);
        scene.add(stringMesh);
    }

    // ================= 物理与动画逻辑 =================

    function resetSim() {
        isRunning = false;
        time = 0;
        currentState = STATE.READY;
        frameCount = 0;

        // 初始位置
        posB = 0;
        posC = boxSize + initialGapBC; 
        posA = -15;

        // 初始速度
        velA = v0;
        velB = 0;
        velC = 0;

        updateMeshPositions();
        resetChart();
        updateUI();
        
        document.getElementById('btn-cut').disabled = true;
        document.getElementById('sim-state').innerText = "准备就绪";
        document.getElementById('sim-state').style.color = "white";
        
        springLine.visible = true;
        stringMesh.visible = true;
    }

    function startSim() {
        if (currentState === STATE.FINAL) resetSim();
        isRunning = true;
        if (currentState === STATE.READY) currentState = STATE.APPROACHING;
    }

    function pauseSim() {
        isRunning = false;
    }

    function cutString() {
        if (currentState === STATE.MERGED) {
            currentState = STATE.SEPARATING;
            document.getElementById('sim-state').innerText = "细线断开，弹簧释放";
            document.getElementById('sim-state').style.color = "#f39c12";
            document.getElementById('btn-cut').disabled = true;
            stringMesh.visible = false; // 细线消失
            
            // 物理突变
            velC = v0;
            velA = 0;
            velB = 0;
        }
    }

    function physicsStep(dt) {
        if (!isRunning) return;

        time += dt;

        if (currentState === STATE.APPROACHING) {
            posA += velA * dt;
            if (posA + boxSize/2 >= posB - boxSize/2) {
                posA = posB - boxSize; 
                currentState = STATE.MERGED;
                document.getElementById('sim-state').innerText = "A与B碰撞并粘合 (3m共速)";
                document.getElementById('sim-state').style.color = "#e74c3c";
                const vCommon = velA / 3;
                velA = vCommon;
                velB = vCommon;
                velC = vCommon;
                document.getElementById('btn-cut').disabled = false;
                
                setTimeout(() => {
                    if(isRunning && currentState === STATE.MERGED) cutString();
                }, 1500);
            }
        } 
        else if (currentState === STATE.MERGED) {
            posA += velA * dt;
            posB += velB * dt;
            posC += velC * dt;
            posA = posB - boxSize;
            posC = posB + boxSize + initialGapBC;
        }
        else if (currentState === STATE.SEPARATING) {
            posA += velA * dt;
            posB += velB * dt; 
            posC += velC * dt; 
            posA = posB - boxSize;

            const dist = posC - posB - boxSize;
            if (dist > naturalGapBC) {
                currentState = STATE.FINAL;
                springLine.visible = false; // 弹簧消失
                document.getElementById('sim-state').innerText = "分离完成 (C以v0远去)";
                document.getElementById('sim-state').style.color = "#2ecc71";
            }
        }
        else if (currentState === STATE.FINAL) {
            posC += velC * dt;
        }

        updateMeshPositions();
        updateUI();
        updateChart();
    }

    function updateMeshPositions() {
        blockA.position.set(posA, boxSize/2, 0);
        blockB.position.set(posB, boxSize/2, 0);
        blockC.position.set(posC, boxSize/2, 0);
        
        updateSpringGeometry();
        updateStringGeometry();
    }

    function updateSpringGeometry() {
        // 如果不可见就跳过计算
        if (!springLine.visible) return;

        const startX = posB + boxSize/2;
        const endX = posC - boxSize/2;
        const dist = endX - startX;
        
        // 如果距离异常，不画
        if (dist <= 0) return;

        const positions = springLine.geometry.attributes.position.array;
        const coils = 12; // 圈数
        const radius = 0.6; // 弹簧半径
        const numPoints = positions.length / 3;

        for (let i = 0; i < numPoints; i++) {
            const t = i / (numPoints - 1);
            const x = startX + t * dist;
            const angle = t * Math.PI * 2 * coils;
            const y = Math.sin(angle) * radius + boxSize/2; // 高度偏移
            const z = Math.cos(angle) * radius;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;
        }
        springLine.geometry.attributes.position.needsUpdate = true;
    }

    function updateStringGeometry() {
        if (!stringMesh.visible) return;
        
        const startX = posB + boxSize/2;
        const endX = posC - boxSize/2;
        
        const positions = stringMesh.geometry.attributes.position.array;
        // 起点
        positions[0] = startX;
        positions[1] = boxSize/2 + 0.8; // 稍微偏上一点，避免和弹簧重合
        positions[2] = 0;
        // 终点
        positions[3] = endX;
        positions[4] = boxSize/2 + 0.8;
        positions[5] = 0;
        
        stringMesh.geometry.attributes.position.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = 0.016 * 1.5; 
        physicsStep(dt);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = document.getElementById('canvas-container').clientWidth / document.getElementById('canvas-container').clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(document.getElementById('canvas-container').clientWidth, document.getElementById('canvas-container').clientHeight);
    }

    // ================= 图表逻辑 (Chart.js) =================
    function initChart() {
        const ctx = document.getElementById('velocityChart').getContext('2d');
        vChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'v(A)', data: [], borderColor: '#e74c3c', borderWidth: 2, fill: false, pointRadius: 0 },
                    { label: 'v(B)', data: [], borderColor: '#3498db', borderWidth: 2, fill: false, pointRadius: 0 },
                    { label: 'v(C)', data: [], borderColor: '#2ecc71', borderWidth: 2, fill: false, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { min: -1, max: 12, title: { display: true, text: 'Velocity' } }
                }
            }
        });
        
        const wrapper = document.getElementById('chart-wrapper');
        const header = document.getElementById('chart-header');
        let isDragging = false, offsetX, offsetY;

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - wrapper.offsetLeft;
            offsetY = e.clientY - wrapper.offsetTop;
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                wrapper.style.left = (e.clientX - offsetX) + 'px';
                wrapper.style.top = (e.clientY - offsetY) + 'px';
            }
        });
        document.addEventListener('mouseup', () => { isDragging = false; });
    }

    function updateChart() {
        if (!isRunning) return;
        frameCount++;
        if (frameCount % 5 !== 0) return;

        if (chartData.labels.length > 100) {
            chartData.labels.shift();
            chartData.a.shift();
            chartData.b.shift();
            chartData.c.shift();
        }

        chartData.labels.push(time.toFixed(1));
        chartData.a.push(velA);
        chartData.b.push(velB);
        chartData.c.push(velC);

        vChart.data.labels = chartData.labels;
        vChart.data.datasets[0].data = chartData.a;
        vChart.data.datasets[1].data = chartData.b;
        vChart.data.datasets[2].data = chartData.c;
        vChart.update();
    }

    function resetChart() {
        if (!vChart) return;
        chartData = { labels: [], a: [], b: [], c: [] };
        vChart.data.labels = [];
        vChart.data.datasets.forEach(d => d.data = []);
        vChart.update();
    }

    function toggleChart() {
        const el = document.getElementById('chart-wrapper');
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    function updateUI() {
        document.getElementById('sim-time').innerText = time.toFixed(2);
        document.getElementById('vel-a').innerText = velA.toFixed(2);
        document.getElementById('vel-b').innerText = velB.toFixed(2);
        document.getElementById('vel-c').innerText = velC.toFixed(2);
    }

    window.onload = function() {
        init3D();
        initChart();
    };

</script>
</body>
</html>
