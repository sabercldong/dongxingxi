<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DNA 结构与衍射模拟</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        
        /* 1. 画布全屏 */
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 0; }

        /* 2. 右侧功能区 */
        #sidebar {
            position: absolute; right: 0; top: 0;
            width: 300px; height: 100vh;
            background: rgba(20, 20, 20, 0.9);
            border-left: 1px solid #444;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 10;
        }

        /* 控件样式 */
        .control-group { margin-bottom: 25px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        h2 { color: #00e5ff; margin-top: 0; text-align: center; }
        h3 { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #ddd; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        /* 按钮 */
        button.btn-reset {
            width: 100%; padding: 12px;
            background: #00e5ff; color: #000;
            border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        button.btn-reset:hover { background: #00b7cc; }

        /* 5. 左上角可拖动图表 */
        #chart-draggable {
            position: absolute; top: 20px; left: 20px;
            width: 320px; height: 260px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00e5ff;
            border-radius: 8px; z-index: 100;
            display: flex; flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #chart-header {
            padding: 10px; background: #004e57;
            cursor: move; color: white; font-weight: bold;
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            user-select: none;
        }
        #chart-body { flex: 1; padding: 10px; background: white; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-draggable">
        <div id="chart-header">📊 衍射强度 (拖动我)</div>
        <div id="chart-body"><canvas id="diffractionChart"></canvas></div>
    </div>

    <div id="sidebar">
        <h2>DNA 衍射模拟器</h2>
        <div class="control-group">
            <h3>视图操作</h3>
            <button class="btn-reset" onclick="resetView()">🔄 还原视图</button>
            <p style="font-size: 12px; color: #888;">左键旋转 / 右键平移 / 滚轮缩放</p>
        </div>
        <div class="control-group">
            <h3>DNA 参数 (影响衍射)</h3>
            <label>旋转速度</label>
            <input type="range" id="speed" min="0" max="100" value="20">
            
            <label>双螺旋半径 (Radius)</label>
            <input type="range" id="radius" min="1" max="6" value="3" step="0.1">
            
            <label>螺距/层间距 (Pitch)</label>
            <input type="range" id="length" min="10" max="60" value="30">
        </div>
        <div class="control-group">
            <p style="font-size:12px; color:#aaa;">
                * 调节半径：改变"X"的角度<br>
                * 调节螺距：改变层线间距
            </p>
        </div>
    </div>

    <script>
        // === 错误检测 ===
        if (typeof THREE === 'undefined') {
            alert('错误：无法加载 three.min.js，请检查文件名是否正确。');
        }

        // === 变量定义 ===
        let scene, camera, renderer, controls;
        let dnaGroup, particlesSystem;
        let myChart;

        // === 初始化 ===
        function init() {
            // 1. 场景与相机
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 25);

            // 2. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 3. 控制器 (防错处理)
            try {
                if (typeof THREE.OrbitControls !== 'undefined') {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                } else if (typeof OrbitControls !== 'undefined') {
                    controls = new OrbitControls(camera, renderer.domElement);
                } else if (window.OrbitControls) {
                    controls = new window.OrbitControls(camera, renderer.domElement);
                } else {
                    console.warn('OrbitControls not found inside standard namespaces.');
                }
            } catch (e) { console.error(e); }

            if (controls) {
                controls.enableDamping = true;
            }

            // 4. 灯光
            scene.add(new THREE.AmbientLight(0x444444));
            const pl = new THREE.PointLight(0xffffff, 1);
            pl.position.set(10, 10, 10);
            scene.add(pl);

            // 5. 创建内容
            createDNA();
            updateDiffraction(); // 初始生成衍射图
            initChart();

            // 6. 事件监听 (解决拖动不更新的问题)
            window.addEventListener('resize', onResize);
            
            // 监听滑块
            document.getElementById('radius').addEventListener('input', () => { createDNA(); updateDiffraction(); });
            document.getElementById('length').addEventListener('input', () => { createDNA(); updateDiffraction(); });

            animate();
        }

        // === DNA 模型逻辑 ===
        function createDNA() {
            if (dnaGroup) scene.remove(dnaGroup);
            dnaGroup = new THREE.Group();

            const radius = parseFloat(document.getElementById('radius').value);
            const pitchHeight = parseFloat(document.getElementById('length').value);
            const count = 40;

            const geo = new THREE.SphereGeometry(0.3, 16, 16);
            const matRed = new THREE.MeshPhongMaterial({ color: 0xff0055 });
            const matBlue = new THREE.MeshPhongMaterial({ color: 0x0055ff });
            const matLine = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.3, transparent: true });

            for (let i = 0; i < count; i++) {
                const t = i / count;
                const angle = t * Math.PI * 4; 
                const y = (t - 0.5) * pitchHeight; // 高度由螺距控制

                // 双螺旋坐标
                const x1 = Math.cos(angle) * radius;
                const z1 = Math.sin(angle) * radius;
                const x2 = Math.cos(angle + Math.PI) * radius;
                const z2 = Math.sin(angle + Math.PI) * radius;

                // 原子
                const m1 = new THREE.Mesh(geo, matRed); m1.position.set(x1, y, z1);
                const m2 = new THREE.Mesh(geo, matBlue); m2.position.set(x2, y, z2);
                dnaGroup.add(m1); dnaGroup.add(m2);

                // 连线
                const pts = [new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2)];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                dnaGroup.add(new THREE.Line(lineGeo, matLine));
            }

            dnaGroup.rotation.z = Math.PI / 6; // 稍微倾斜
            scene.add(dnaGroup);
        }

        // === 衍射图逻辑 (核心修复) ===
        function updateDiffraction() {
            if (particlesSystem) {
                scene.remove(particlesSystem);
                if(particlesSystem.geometry) particlesSystem.geometry.dispose();
            }

            const radius = parseFloat(document.getElementById('radius').value);
            const pitch = parseFloat(document.getElementById('length').value);

            // 物理模拟参数
            // 半径越大，X越陡峭(slope大)
            const slope = radius * 0.6; 
            // 螺距越大，层线越密(spacing小)
            const layerSpacing = 180 / pitch; 

            const pos = [];
            const cols = [];
            const color = new THREE.Color();
            const zPos = -20; // 背景位置

            // 生成 2000 个光点
            for (let i = 0; i < 2000; i++) {
                let x = (Math.random() - 0.5) * 30;
                let y = (Math.random() - 0.5) * 30;

                // 1. X形判定
                const dist1 = Math.abs(y - x * slope);
                const dist2 = Math.abs(y + x * slope);
                const distCross = Math.min(dist1, dist2);

                // 2. 层线判定 (取模)
                // 让 y 对 spacing 取模，看是否接近 0 或 spacing
                let modY = Math.abs(y) % layerSpacing;
                if (modY > layerSpacing / 2) modY = layerSpacing - modY;
                
                let intensity = 0;

                // 中心极亮
                if (x*x + y*y < 3) {
                    intensity = 1;
                } 
                // X臂 + 层线交点
                else if (distCross < 1.5) {
                    if (modY < 0.8) {
                        intensity = 0.8 - (distCross * 0.3);
                    }
                }

                if (Math.random() > intensity) continue; // 丢弃暗点

                pos.push(x, y, zPos);
                color.setHSL(0.6, 0.8, intensity);
                cols.push(color.r, color.g, color.b);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
            
            const mat = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, blending: THREE.AdditiveBlending });
            particlesSystem = new THREE.Points(geo, mat);
            scene.add(particlesSystem);
        }

        // === 动画循环 ===
        function animate() {
            requestAnimationFrame(animate);
            
            const speed = document.getElementById('speed').value;
            if (dnaGroup && speed > 0) {
                dnaGroup.rotation.y += speed * 0.002;
            }

            if (controls) controls.update();
            renderer.render(scene, camera);

            // 图表随机跳动
            if (myChart && Math.random() > 0.9) updateChart();
        }

        // === 工具函数 ===
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function resetView() {
            if(controls) controls.reset();
            camera.position.set(0, 0, 25);
            if(dnaGroup) dnaGroup.rotation.set(0,0,Math.PI/6);
        }

        // === 图表初始化 ===
        function initChart() {
            const ctx = document.getElementById('diffractionChart');
            if(!ctx) return;
            
            // 初始数据
            let data = [];
            for(let i=0; i<30; i++) data.push(Math.random()*50 + 20);

            // 简单的配置，防止Chart.js报错
            try {
                myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Array.from({length:30}, (_,i)=>i),
                        datasets: [{
                            label: 'Intensity',
                            data: data,
                            backgroundColor: '#00e5ff',
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        scales: { x: {display:false}, y: {display:false} },
                        plugins: { legend: {display:false} }
                    }
                });
            } catch(e) { console.warn("Chart init failed", e); }
        }

        function updateChart() {
            if(!myChart) return;
            const newData = myChart.data.datasets[0].data.map(v => {
                let n = v + (Math.random()-0.5)*10;
                return Math.max(10, Math.min(90, n));
            });
            myChart.data.datasets[0].data = newData;
            myChart.update();
        }

        // === 拖动逻辑 ===
        const dragger = document.getElementById("chart-draggable");
        const header = document.getElementById("chart-header");
        let isDrag = false, startX, startY, initLeft, initTop;

        header.onmousedown = function(e) {
            isDrag = true;
            startX = e.clientX; startY = e.clientY;
            initLeft = dragger.offsetLeft; initTop = dragger.offsetTop;
        };
        window.onmouseup = () => isDrag = false;
        window.onmousemove = function(e) {
            if(!isDrag) return;
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            dragger.style.left = (initLeft + dx) + 'px';
            dragger.style.top = (initTop + dy) + 'px';
        };

        // 启动
        window.onload = init;
    </script>
</body>
</html>
