<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在复合场圆环内的脱离问题 (修复版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #eee; }
        #container { display: flex; height: 100vh; width: 100vw; }
        
        /* 左侧 3D 视窗 */
        #canvas-container { flex: 1; position: relative; overflow: hidden; }
        
        /* 右侧 功能区 */
        #controls {
            width: 320px;
            background-color: #2c2c2c;
            padding: 20px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto; /* 允许纵向滚动 */
            max-height: 100vh;
        }

        /* 滚动条样式美化 */
        #controls::-webkit-scrollbar { width: 8px; }
        #controls::-webkit-scrollbar-track { background: #222; }
        #controls::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        #controls::-webkit-scrollbar-thumb:hover { background: #777; }

        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #555; padding-bottom: 10px; color: #4CAF50; }
        .section-title { font-size: 0.95rem; font-weight: bold; color: #ddd; margin-top: 10px; border-left: 3px solid #4CAF50; padding-left: 8px; }
        
        .control-group { margin-bottom: 5px; background: #333; padding: 10px; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="checkbox"] { cursor: pointer; transform: scale(1.2); margin-right: 8px; }
        .value-display { float: right; color: #fff; font-weight: bold; }
        
        /* 按钮组 */
        .btn-group { display: flex; gap: 5px; margin-top: 5px; }
        button {
            flex: 1;
            border: none; color: white; padding: 10px;
            text-align: center; text-decoration: none;
            font-size: 14px; cursor: pointer; border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        #btn-start { background-color: #4CAF50; } /* Green */
        #btn-pause { background-color: #FF9800; } /* Orange */
        #btn-reset { background-color: #f44336; } /* Red */
        button:disabled { background-color: #555; cursor: not-allowed; opacity: 0.5; }

        .status-panel {
            background: #222; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; color: #0f0;
        }

        .legend { font-size: 0.8rem; margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; color: #ccc; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; border: 1px solid #000; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="container">
    <div id="canvas-container"></div>

    <div id="controls">
        <h2>物理仿真控制台</h2>
        
        <div class="section-title">参数设置</div>
        <div class="control-group">
            <label>电场强度 (qE/m) <span id="val-E" class="value-display">5.0</span></label>
            <input type="range" id="input-E" min="0" max="25" step="0.1" value="5.0">
        </div>

        <div class="control-group">
            <label>初速度 v₀ (m/s) <span id="val-v0" class="value-display">5.0</span></label>
            <input type="range" id="input-v0" min="0" max="25" step="0.1" value="5.0">
            <div style="font-size: 0.75rem; color: #888; margin-top:4px;">(从最低点发射)</div>
        </div>

        <div class="section-title">运行控制</div>
        <div class="btn-group">
            <button id="btn-start" onclick="startSim()">开始</button>
            <button id="btn-pause" onclick="pauseSim()">暂停</button>
            <button id="btn-reset" onclick="resetSim()">还原</button>
        </div>

        <div class="section-title">实时状态</div>
        <div class="status-panel" id="status-text">
            状态: 准备就绪<br>
            位置: 轨道上<br>
            速度: 0.00
        </div>

        <div class="section-title">显示选项</div>
        <div class="control-group">
            <label><input type="checkbox" id="check-trail" checked> 显示轨迹</label>
            <label><input type="checkbox" id="check-force" checked> 显示等效重力点</label>
            <label><input type="checkbox" id="check-field" checked> 显示电场线</label>
        </div>

        <div class="legend">
            <div style="margin-bottom:5px; font-weight:bold;">图例说明：</div>
            <div class="legend-item"><div class="dot" style="background: yellow;"></div>带电小球</div>
            <div class="legend-item"><div class="dot" style="background: cyan;"></div>电场方向 (向右)</div>
            <div class="legend-item"><div class="dot" style="background: #00ff00;"></div>等效最低点 (稳定)</div>
            <div class="legend-item"><div class="dot" style="background: #ff0000;"></div>等效最高点 (易脱离点)</div>
            <div class="legend-item"><div class="dot" style="background: white; border-radius:0; width:10px; height:2px;"></div>运动轨迹</div>
        </div>
        
        <div style="height: 50px;"></div>
    </div>
</div>

<script>
    // --- 1. Three.js 场景初始化 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 10);
    scene.add(dirLight);

    // --- 2. 创建物体 ---
    const R = 6; 
    const g = 9.8; 

    // 圆环
    const ringGeo = new THREE.TorusGeometry(R, 0.15, 16, 100);
    const ringMat = new THREE.MeshPhongMaterial({ color: 0x666666, transparent: true, opacity: 0.4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);

    // 辅助圆轨道线
    const orbitLineGeo = new THREE.RingGeometry(R-0.05, R+0.05, 128);
    const orbitLineMat = new THREE.MeshBasicMaterial({ color: 0x888888, side: THREE.DoubleSide, transparent:true, opacity:0.2 });
    const orbitLine = new THREE.Mesh(orbitLineGeo, orbitLineMat);
    scene.add(orbitLine);

    // 粒子
    const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 32, 32),
        new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0xaa6600 })
    );
    scene.add(particle);

    // 等效点
    const stablePoint = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0x00ff00 })); // 绿
    const unstablePoint = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({ color: 0xff0000 })); // 红
    scene.add(stablePoint);
    scene.add(unstablePoint);

    // 电场线
    const fieldGroup = new THREE.Group();
    scene.add(fieldGroup);
    function createFieldLines() {
        fieldGroup.clear();
        const arrowColor = 0x00ffff;
        for(let y=-R; y<=R; y+=2) {
            for(let z=-1; z<=1; z+=2) { 
                const dir = new THREE.Vector3(1, 0, 0);
                const origin = new THREE.Vector3(-R - 2, y, z);
                const length = 2 * R + 4;
                const points = [origin, new THREE.Vector3(origin.x + length, origin.y, origin.z)];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: arrowColor, transparent: true, opacity: 0.15 }));
                const arrowHelper = new THREE.ArrowHelper(dir, new THREE.Vector3(0, y, z), 1, arrowColor, 0.5, 0.3);
                fieldGroup.add(line);
                fieldGroup.add(arrowHelper);
            }
        }
    }
    createFieldLines();

    // 轨迹线
    const MAX_TRAIL = 800;
    const trailGeo = new THREE.BufferGeometry();
    const trailPos = new Float32Array(MAX_TRAIL * 3);
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
    const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffffff }));
    trailLine.frustumCulled = false;
    scene.add(trailLine);
    let trailCount = 0;

    // --- 3. 物理状态 ---
    let simState = {
        running: false,
        detached: false,
        pos: new THREE.Vector3(0, -R, 0),
        vel: new THREE.Vector3(0, 0, 0),
        E: 5.0, 
        v0: 5.0
    };

    // --- 核心修复：更新等效点位置及可见性 ---
    function updateEquivalentPoints() {
        // 计算角度
        const angle = Math.atan2(-g, simState.E); 
        
        // 更新位置
        stablePoint.position.set(R * Math.cos(angle), R * Math.sin(angle), 0);
        unstablePoint.position.set(-R * Math.cos(angle), -R * Math.sin(angle), 0);

        // 更新可见性 (修复点)
        const show = document.getElementById('check-force').checked;
        stablePoint.visible = show;
        unstablePoint.visible = show;
    }

    // --- 4. 物理计算循环 ---
    const dt = 0.01; 

    function updatePhysics() {
        if (!simState.running) return;

        const a_env = new THREE.Vector3(simState.E, -g, 0);

        if (!simState.detached) {
            // 模式 A: 轨道运动
            const r_vec = simState.pos.clone().normalize(); 
            const t_vec = new THREE.Vector3(-r_vec.y, r_vec.x, 0); // 切向

            const a_t_mag = a_env.dot(t_vec);
            const a_t = t_vec.clone().multiplyScalar(a_t_mag);

            simState.vel.add(a_t.multiplyScalar(dt));

            // 修正速度方向
            const speed = simState.vel.length();
            const crossZ = simState.pos.x * simState.vel.y - simState.pos.y * simState.vel.x;
            const dirSign = crossZ >= 0 ? 1 : -1;
            simState.vel.copy(t_vec).multiplyScalar(speed * dirSign);

            simState.pos.add(simState.vel.clone().multiplyScalar(dt));
            simState.pos.setLength(R);

            // 脱离判断
            const a_radial_in = a_env.dot(r_vec.clone().negate());
            const a_centripetal = (speed * speed) / R;
            const acc_N = a_centripetal - a_radial_in;

            if (acc_N < 0) {
                simState.detached = true;
                document.getElementById('status-text').innerHTML = 
                    `状态: <span style="color:red">已脱离!</span><br>位置: 抛体运动<br>速度: ${speed.toFixed(2)}`;
                simState.pos.add(r_vec.clone().multiplyScalar(-0.01));
            } else {
                 document.getElementById('status-text').innerHTML = 
                    `状态: 轨道运行<br>支持力: ${(acc_N*10).toFixed(1)} N<br>速度: ${speed.toFixed(2)}`;
            }

        } else {
            // 模式 B: 抛体运动
            simState.vel.add(a_env.clone().multiplyScalar(dt));
            simState.pos.add(simState.vel.clone().multiplyScalar(dt));

            if (simState.pos.length() >= R) {
                simState.running = false;
                simState.pos.setLength(R);
                document.getElementById('status-text').innerHTML += `<br><span style="color:yellow">撞击圆环，停止。</span>`;
                document.getElementById('btn-start').disabled = true;
                document.getElementById('btn-pause').disabled = true;
            } else {
                document.getElementById('status-text').innerHTML = 
                    `状态: <span style="color:red">脱离飞行中</span><br>位置: (${simState.pos.x.toFixed(1)}, ${simState.pos.y.toFixed(1)})<br>速度: ${simState.vel.length().toFixed(2)}`;
            }
        }

        particle.position.copy(simState.pos);

        if (document.getElementById('check-trail').checked) {
            updateTrail();
        }
    }

    function updateTrail() {
        if (trailCount < MAX_TRAIL) {
            trailPos[trailCount * 3] = simState.pos.x;
            trailPos[trailCount * 3 + 1] = simState.pos.y;
            trailPos[trailCount * 3 + 2] = simState.pos.z;
            trailCount++;
        } else {
            for (let i = 0; i < MAX_TRAIL - 1; i++) {
                trailPos[i*3] = trailPos[(i+1)*3];
                trailPos[i*3+1] = trailPos[(i+1)*3+1];
                trailPos[i*3+2] = trailPos[(i+1)*3+2];
            }
            trailPos[(MAX_TRAIL-1)*3] = simState.pos.x;
            trailPos[(MAX_TRAIL-1)*3+1] = simState.pos.y;
            trailPos[(MAX_TRAIL-1)*3+2] = simState.pos.z;
        }
        trailLine.geometry.attributes.position.needsUpdate = true;
        trailLine.geometry.setDrawRange(0, trailCount);
    }

    function animate() {
        requestAnimationFrame(animate);
        for(let i=0; i<2; i++) updatePhysics();
        controls.update();
        renderer.render(scene, camera);
    }

    // --- 5. 交互控制 ---
    
    window.resetSim = function() {
        simState.running = false;
        simState.detached = false;
        simState.E = parseFloat(document.getElementById('input-E').value);
        simState.v0 = parseFloat(document.getElementById('input-v0').value);
        
        simState.pos.set(0, -R, 0);
        simState.vel.set(simState.v0, 0, 0);
        
        particle.position.copy(simState.pos);
        
        trailCount = 0;
        trailLine.geometry.setDrawRange(0, 0);
        
        updateEquivalentPoints();
        
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-pause').disabled = true;
        document.getElementById('status-text').innerHTML = "状态: 已还原<br>等待开始...";
    };

    window.startSim = function() {
        simState.running = true;
        document.getElementById('btn-start').disabled = true;
        document.getElementById('btn-pause').disabled = false;
    };

    window.pauseSim = function() {
        simState.running = false;
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-pause').disabled = true;
        document.getElementById('status-text').innerHTML += "<br>(已暂停)";
    };

    // 事件监听
    document.getElementById('input-E').addEventListener('input', (e) => {
        document.getElementById('val-E').innerText = parseFloat(e.target.value).toFixed(1);
        simState.E = parseFloat(e.target.value);
        updateEquivalentPoints();
    });
    
    document.getElementById('input-v0').addEventListener('input', (e) => {
        document.getElementById('val-v0').innerText = parseFloat(e.target.value).toFixed(1);
        simState.v0 = parseFloat(e.target.value);
    });

    document.getElementById('check-field').addEventListener('change', (e) => {
        fieldGroup.visible = e.target.checked;
    });
    
    document.getElementById('check-trail').addEventListener('change', (e) => {
        trailLine.visible = e.target.checked;
    });

    // --- 核心修复：添加复选框的监听器 ---
    document.getElementById('check-force').addEventListener('change', updateEquivalentPoints);

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // 启动
    resetSim();
    animate();

</script>
</body>
</html>
