<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁场聚焦与发散仿真 (修复版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; display: flex; }
        #canvas-container { flex: 1; position: relative; overflow: hidden; }
        #sidebar {
            width: 300px;
            background: rgba(30, 30, 30, 0.95);
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        h3 { margin-top: 0; border-bottom: 1px solid #00d2ff; padding-bottom: 10px; color: #00d2ff; text-align: center;}
        .control-panel { display: flex; flex-direction: column; gap: 15px; }
        .control-group { background: #333; padding: 10px; border-radius: 5px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 14px; color: #ccc; margin-bottom: 5px; }
        .control-group span { color: #00d2ff; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer;
            font-weight: bold; transition: 0.2s; color: white;
        }
        #btn-start { background: #28a745; }
        #btn-pause { background: #ffc107; color: black; }
        #btn-reset { background: #dc3545; }
        #btn-magic { background: linear-gradient(90deg, #6f42c1, #00d2ff); margin-top: 10px; }
        button:hover { filter: brightness(1.1); }
        button:disabled { background: #555; cursor: not-allowed; filter: none; }
        .status-box {
            margin-top: auto; padding: 10px; background: #222; border: 1px solid #444; border-radius: 4px; font-size: 12px; line-height: 1.6;
        }
        .warning { color: #ff4444; font-weight: bold; display: none; padding: 10px; background: #300; border: 1px solid red; }
    </style>

    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
</head>
<body>

    <div id="error-msg" class="warning" style="position:absolute; top:10px; left:10px; z-index:999; width: 300px;">
        ⚠️ <b>运行出错</b><br>未能加载 Three.js 或 OrbitControls。<br>请确保它们和本 HTML 在同一文件夹内。
    </div>

    <div id="canvas-container"></div>

    <div id="sidebar">
        <h3>磁场控制台</h3>
        <div class="control-panel">
            <div class="btn-row">
                <button id="btn-start">开始</button>
                <button id="btn-pause" disabled>暂停</button>
                <button id="btn-reset">还原</button>
            </div>
            <div class="control-group">
                <label>粒子速度 (v) <span id="val-v">10.0</span></label>
                <input type="range" id="input-v" min="5" max="30" step="0.5" value="10">
            </div>
            <div class="control-group">
                <label>磁感应强度 (B) <span id="val-b">1.0</span></label>
                <input type="range" id="input-b" min="0.1" max="5.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>圆形磁场半径 (R) <span id="val-r">10.0</span></label>
                <input type="range" id="input-r" min="5" max="20" step="1" value="10">
            </div>
            <button id="btn-magic">✨ 平行出射模式 (r = R)</button>
        </div>
        <div class="status-box">
            <div>粒子回旋半径 r: <span id="calc-r" style="color:#00d2ff">10.00</span></div>
            <div>磁场区域半径 R: <span id="calc-R" style="color:#00d2ff">10.00</span></div>
            <hr style="border-color:#444">
            <div style="color:#aaa">滚轮缩放 / 右键平移 / 左键旋转</div>
        </div>
    </div>

    <script>
        // 检测库加载
        if (typeof THREE === 'undefined') {
            document.getElementById('error-msg').style.display = 'block';
            throw new Error("Three.js not loaded");
        }
        const OrbitControls = window.OrbitControls || (THREE.OrbitControls) || (window.THREE && window.THREE.OrbitControls);

        // 全局变量
        let scene, camera, renderer, controls;
        let magneticField;
        let particles = []; // 存储所有粒子对象
        let isRunning = false;

        const params = { v: 10, B: 1.0, R: 10, q: 1, m: 1, count: 51 };

        // DOM 引用
        const els = {
            v: document.getElementById('input-v'),
            b: document.getElementById('input-b'),
            r: document.getElementById('input-r'),
            valV: document.getElementById('val-v'),
            valB: document.getElementById('val-b'),
            valR: document.getElementById('val-r'),
            calcR: document.getElementById('calc-r'),
            calcRField: document.getElementById('calc-R'),
            start: document.getElementById('btn-start'),
            pause: document.getElementById('btn-pause'),
            reset: document.getElementById('btn-reset'),
            magic: document.getElementById('btn-magic')
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            if (OrbitControls) {
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
            }

            const grid = new THREE.GridHelper(100, 50, 0x333333, 0x111111);
            grid.rotation.x = Math.PI / 2;
            scene.add(grid);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            createMagneticField();

            window.addEventListener('resize', onResize);
            els.v.addEventListener('input', updateParams);
            els.b.addEventListener('input', updateParams);
            els.r.addEventListener('input', () => { updateParams(); createMagneticField(); });

            els.start.addEventListener('click', () => {
                if (particles.length === 0) spawnParticles();
                isRunning = true;
                updateButtons();
            });
            els.pause.addEventListener('click', () => {
                isRunning = false;
                updateButtons();
            });
            els.reset.addEventListener('click', resetSim);
            els.magic.addEventListener('click', setMagicMode);

            updateCalculations();
        }

        function createMagneticField() {
            if (magneticField) scene.remove(magneticField);
            const geometry = new THREE.CircleGeometry(params.R, 64);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
            magneticField = new THREE.Mesh(geometry, material);
            const edges = new THREE.EdgesGeometry(geometry);
            magneticField.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff88 })));
            const dot = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            dot.position.set(0, -params.R, 0);
            magneticField.add(dot);
            scene.add(magneticField);
        }

        function spawnParticles() {
            // 生成前确保清理干净
            clearAllParticles();

            const startPos = new THREE.Vector3(0, -params.R, 0);
            const angleStep = Math.PI / (params.count - 1);
            
            for (let i = 0; i < params.count; i++) {
                const angle = -Math.PI/2 + i * angleStep;
                const vx = params.v * Math.sin(angle);
                const vy = params.v * Math.cos(angle);

                // 1. 创建粒子球体
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3333 }));
                mesh.position.copy(startPos);
                scene.add(mesh);

                // 2. 创建轨迹线
                const trailGeo = new THREE.BufferGeometry();
                const positions = new Float32Array(3000); // 预分配3000个点的空间
                trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const trailMat = new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(i/params.count, 1, 0.5) });
                const trail = new THREE.Line(trailGeo, trailMat);
                trail.frustumCulled = false; // 防止轨迹消失
                scene.add(trail);

                // 3. 将两者绑定在一个对象中推入数组
                particles.push({
                    mesh: mesh,
                    trail: trail,
                    pos: startPos.clone(),
                    vel: new THREE.Vector3(vx, vy, 0),
                    trailIdx: 0,
                    trailPos: positions,
                    finished: false
                });
            }
        }

        function updatePhysics() {
            const dt = 0.05;
            particles.forEach(p => {
                if (p.finished) return;

                const distSq = p.pos.x * p.pos.x + p.pos.y * p.pos.y;
                // 增加一点点容差 0.1，防止边缘计算抖动
                const inField = distSq <= (params.R * params.R + 0.1); 

                if (inField) {
                    const omega = (params.q * params.B) / params.m;
                    const angleChange = -omega * dt;
                    const oldVx = p.vel.x;
                    const oldVy = p.vel.y;
                    p.vel.x = oldVx * Math.cos(angleChange) - oldVy * Math.sin(angleChange);
                    p.vel.y = oldVx * Math.sin(angleChange) + oldVy * Math.cos(angleChange);
                }

                p.pos.addScaledVector(p.vel, dt);
                p.mesh.position.copy(p.pos);

                if (p.trailIdx < 1000) {
                    const idx = p.trailIdx * 3;
                    p.trailPos[idx] = p.pos.x;
                    p.trailPos[idx+1] = p.pos.y;
                    p.trailPos[idx+2] = p.pos.z;
                    p.trailIdx++;
                    p.trail.geometry.setDrawRange(0, p.trailIdx);
                    p.trail.geometry.attributes.position.needsUpdate = true;
                } else {
                    p.finished = true;
                }
                
                if (Math.abs(p.pos.x) > 60 || Math.abs(p.pos.y) > 60) p.finished = true;
            });
        }

        // ====== 核心修复：彻底清理所有对象 ======
        function clearAllParticles() {
            particles.forEach(p => {
                if (p.mesh) scene.remove(p.mesh);   // 移除球
                if (p.trail) scene.remove(p.trail); // 移除线
            });
            particles = []; // 清空数组
        }

        function resetSim() {
            isRunning = false;
            clearAllParticles(); // 调用清理函数
            updateButtons();
        }
        // ===================================

        function setMagicMode() {
            const targetB = (params.m * params.v) / (params.q * params.R);
            params.B = targetB;
            els.b.value = targetB;
            els.valB.textContent = targetB.toFixed(2);
            
            resetSim();
            updateCalculations();
            
            setTimeout(() => {
                spawnParticles();
                isRunning = true;
                updateButtons();
            }, 100);
        }

        function updateParams() {
            params.v = parseFloat(els.v.value);
            params.B = parseFloat(els.b.value);
            params.R = parseFloat(els.r.value);
            els.valV.textContent = params.v.toFixed(1);
            els.valB.textContent = params.B.toFixed(1);
            els.valR.textContent = params.R.toFixed(1);
            updateCalculations();
            if (isRunning) resetSim();
        }

        function updateCalculations() {
            const r = (params.m * params.v) / (params.q * params.B);
            els.calcR.textContent = r.toFixed(2);
            els.calcRField.textContent = params.R.toFixed(2);
            if (Math.abs(r - params.R) < 0.1) {
                els.calcR.style.color = "#00ff00";
                els.calcR.innerHTML = r.toFixed(2) + " (平行)";
            } else {
                els.calcR.style.color = "#00d2ff";
            }
        }

        function updateButtons() {
            els.start.disabled = isRunning;
            els.pause.disabled = !isRunning;
            els.start.innerText = isRunning ? "运行中..." : "发射 / 继续";
        }

        function onResize() {
            const c = document.getElementById('canvas-container');
            camera.aspect = c.clientWidth / c.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(c.clientWidth, c.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (isRunning) updatePhysics();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
