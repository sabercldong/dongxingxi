<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 交变电场演示 (全交互版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
        }

        /* 左侧 3D 视口 */
        #viewport {
            flex: 1;
            position: relative;
            background: #000;
            cursor: grab; /* 提示用户可以抓取拖动 */
        }
        #viewport:active {
            cursor: grabbing;
        }

        /* 悬浮图表容器 (初始在左上角，可拖动) */
        #hud-charts {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            height: 320px;
            background: rgba(0, 0, 0, 0.85); /* 稍微加深背景 */
            border: 1px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* 拖动把手 (标题栏) */
        #hud-header {
            height: 30px;
            background: #2a2a2a;
            border-bottom: 1px solid #444;
            border-radius: 8px 8px 0 0;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ccc;
            user-select: none;
            font-weight: bold;
        }
        #hud-header:hover { background: #333; color: #fff; }

        #hud-body {
            flex: 1;
            padding: 10px;
            position: relative;
        }

        canvas#dataCanvas { width: 100%; height: 100%; display: block; }

        /* 右侧 功能区 */
        #sidebar {
            width: 320px;
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .controls { padding: 20px; overflow-y: auto; flex: 1; }

        h2 { margin-top: 0; font-size: 18px; color: #4db8ff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; margin-bottom: 8px; color: #aaa; }
        .control-group input[type=range] { width: 100%; cursor: pointer; }
        .value-display { float: right; color: #fff; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        
        button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        
        #btn-start { background-color: #28a745; }
        #btn-pause { background-color: #ffc107; color: #000; }
        #btn-reset { background-color: #dc3545; }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="hud-charts">
            <div id="hud-header">::: 拖拽移动图表 :::</div>
            <div id="hud-body">
                <canvas id="dataCanvas"></canvas>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="controls">
            <h2>物理参数设置</h2>
            
            <div class="control-group">
                <label>方波周期 (T) <span id="val-T" class="value-display">2.0 s</span></label>
                <input type="range" id="range-T" min="0.5" max="6.0" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <label>电场强度 (E) <span id="val-E" class="value-display">4.0</span></label>
                <input type="range" id="range-E" min="1.0" max="10.0" step="0.5" value="4.0">
            </div>

            <div class="control-group">
                <label>粒子入射时刻 (t0) <span id="val-t0" class="value-display">0.0 s</span></label>
                <input type="range" id="range-t0" min="0.0" max="4.0" step="0.1" value="0.0">
                <div style="font-size: 12px; color: #666; margin-top:4px;">* 调节 t0 改变进入相位的正负</div>
            </div>

            <div class="btn-group">
                <button id="btn-start" onclick="startSim()">开始</button>
                <button id="btn-pause" onclick="pauseSim()">暂停</button>
                <button id="btn-reset" onclick="resetSim()">还原</button>
            </div>

            <br>
            <div style="font-size: 13px; color: #888; line-height: 1.5; border-top: 1px solid #333; padding-top: 15px;">
                <strong>交互操作指南：</strong><br>
                1. <span style="color:#4db8ff">鼠标左键</span>：拖动画面 (上下左右平移)<br>
                2. <span style="color:#4db8ff">鼠标右键</span>：旋转视角 (3D观察)<br>
                3. <span style="color:#4db8ff">滚轮</span>：缩放<br>
                4. 图表窗口也可单独拖动。
            </div>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>

    <script>
        // --- 1. 图表拖拽逻辑 ---
        const hud = document.getElementById('hud-charts');
        const header = document.getElementById('hud-header');
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragOffset.x = e.clientX - hud.offsetLeft;
            dragOffset.y = e.clientY - hud.offsetTop;
            header.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                e.preventDefault();
                hud.style.left = (e.clientX - dragOffset.x) + 'px';
                hud.style.top = (e.clientY - dragOffset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            header.style.cursor = 'move';
        });

        // --- 2. 全局变量 ---
        let scene, camera, renderer, controls;
        let particle, trailLine;
        let fieldArrows = []; 
        
        let simTime = 0;
        let isRunning = false;
        let params = {
            T: 2.0,
            E: 4.0,
            t0: 0.0,
            v0: 5.0 
        };

        let historyData = [];
        let trailPoints = [];
        const FIELD_SIZE = 30; // 空间范围

        initThree();
        initCharts();
        resetSim();
        animate();

        // --- 3. Three.js 初始化与控制配置 ---
        function initThree() {
            const container = document.getElementById('viewport');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(5, 5, 50); // 初始视角

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // *** 核心修改：交互控制配置 ***
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // 开启阻尼滑动，手感更好
            controls.dampingFactor = 0.05;
            
            // 改变鼠标按键映射
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.PAN,    // 左键改为平移
                MIDDLE: THREE.MOUSE.DOLLY, // 中键缩放
                RIGHT: THREE.MOUSE.ROTATE  // 右键旋转
            };
            // 确保平移是在屏幕平面上进行，而不是推拉
            controls.screenSpacePanning = true;

            // 灯光
            scene.add(new THREE.AmbientLight(0x505050));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 辅助网格
            const gridHelper = new THREE.GridHelper(80, 40, 0x333333, 0x1a1a1a);
            scene.add(gridHelper);

            createFieldLines();

            // 粒子
            const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
            const sphereMat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x444400 });
            particle = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(particle);

            // 轨迹线
            const lineGeo = new THREE.BufferGeometry();
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            trailLine = new THREE.Line(lineGeo, lineMat);
            scene.add(trailLine);
            
            window.addEventListener('resize', onWindowResize);
            bindInputs();
        }

        function createFieldLines() {
            // 扩大电场线覆盖范围，方便平移查看
            const step = 10; 
            for (let x = -35; x <= 35; x += step) {
                for (let y = -15; y <= 15; y += step) {
                    for (let z = -10; z <= 10; z += step) {
                        const dir = new THREE.Vector3(0, 1, 0);
                        const origin = new THREE.Vector3(x, y - 3, z);
                        const length = 7; 
                        const headLength = 1.8;
                        const headWidth = 0.6;
                        const arrowHelper = new THREE.ArrowHelper(dir, origin, length, 0x00ff00, headLength, headWidth);
                        scene.add(arrowHelper);
                        fieldArrows.push(arrowHelper);
                    }
                }
            }
        }

        // --- 4. 逻辑 ---

        function startSim() {
            if (particle.position.x > FIELD_SIZE + 15) resetSim();
            isRunning = true;
        }

        function pauseSim() {
            isRunning = false;
        }

        function resetSim() {
            isRunning = false;
            
            params.T = parseFloat(document.getElementById('range-T').value);
            params.E = parseFloat(document.getElementById('range-E').value);
            params.t0 = parseFloat(document.getElementById('range-t0').value);

            simTime = 0;
            historyData = [];
            trailPoints = [];

            // 重置位置
            particle.position.set(-FIELD_SIZE, 0, 0); 
            trailLine.geometry.setFromPoints([particle.position]);
            
            // 这里不重置相机位置，保留用户平移后的视角，体验更好
            
            updatePhysics(0);
            drawCharts();
        }

        function updatePhysics(dt) {
            let timeStep = isRunning ? dt : 0;
            simTime += timeStep;

            const effectiveTime = simTime + params.t0;
            const phase = effectiveTime % params.T;
            const isPositiveHalf = phase < (params.T / 2);
            
            const direction = isPositiveHalf ? 1 : -1;
            const currentU = params.E * direction;

            const arrowColor = isPositiveHalf ? 0x00ff00 : 0xff3333; 
            const arrowDir = new THREE.Vector3(0, direction, 0);
            
            fieldArrows.forEach(arrow => {
                arrow.setDirection(arrowDir);
                arrow.setColor(arrowColor);
            });

            if (!isRunning) return;

            const ay = currentU; 

            particle.position.x += params.v0 * dt;

            let vy_prev = (historyData.length > 0) ? historyData[historyData.length-1].v : 0;
            let vy_new = vy_prev + ay * dt;
            particle.position.y += vy_new * dt;

            historyData.push({ t: simTime, v: vy_new, u: currentU });

            trailPoints.push(particle.position.clone());
            if(trailPoints.length > 0) {
                trailLine.geometry.setFromPoints(trailPoints);
            }

            // 扩大自动停止范围
            if (particle.position.x > FIELD_SIZE + 20 || Math.abs(particle.position.y) > 40) {
                isRunning = false;
            }
        }

        // --- 5. 图表绘制 ---

        function initCharts() {
            const canvas = document.getElementById('dataCanvas');
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }

        function drawCharts() {
            const canvas = document.getElementById('dataCanvas');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;

            ctx.clearRect(0, 0, W, H);

            const p = 15;
            const leftP = 35; 
            const graphH = (H - p * 3) / 2; 
            const topY = p;
            const botY = p * 2 + graphH;
            
            const maxTime = 6.0;
            const xScale = (W - leftP - p) / maxTime;

            const uMax = 12;
            const uScale = (graphH / 2) / uMax; 
            const vMax = 8.0; 
            const vScale = (graphH / 2) / vMax; 

            function drawGrid(yBase, label, color) {
                ctx.strokeStyle = "#555";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(leftP, yBase); ctx.lineTo(leftP, yBase + graphH);
                ctx.moveTo(leftP, yBase + graphH/2); ctx.lineTo(W - p, yBase + graphH/2);
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.font = "bold 14px Arial";
                ctx.fillText(label, 5, yBase + graphH/2 + 5);
            }

            drawGrid(topY, "U", "#0f0");
            drawGrid(botY, "v", "#ff0");

            if (historyData.length === 0) return;

            ctx.lineWidth = 2;

            // U-t
            ctx.strokeStyle = "#00ff00";
            ctx.beginPath();
            const startIndex = Math.max(0, historyData.length - 1000);
            for (let i = 0; i < historyData.length; i++) {
                let d = historyData[i];
                let px = leftP + d.t * xScale;
                let py = (topY + graphH/2) - (d.u * uScale);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // v-t
            ctx.strokeStyle = "#ffff00";
            ctx.beginPath();
            for (let i = 0; i < historyData.length; i++) {
                let d = historyData[i];
                let px = leftP + d.t * xScale;
                let rawY = d.v * vScale;
                if (rawY > graphH/2) rawY = graphH/2;
                if (rawY < -graphH/2) rawY = -graphH/2;
                let py = (botY + graphH/2) - rawY;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // 虚线
            let currX = leftP + simTime * xScale;
            if (currX < W - p) {
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(currX, p);
                ctx.lineTo(currX, H - p);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // --- 6. 事件绑定 ---

        function bindInputs() {
            ['range-T', 'range-E', 'range-t0'].forEach(id => {
                document.getElementById(id).addEventListener('input', (e) => {
                    const valId = id.replace('range', 'val');
                    document.getElementById(valId).innerText = parseFloat(e.target.value).toFixed(1) + ' s';
                    
                    if (!isRunning) {
                        params.T = parseFloat(document.getElementById('range-T').value);
                        params.E = parseFloat(document.getElementById('range-E').value);
                        params.t0 = parseFloat(document.getElementById('range-t0').value);
                        updatePhysics(0);
                        renderer.render(scene, camera);
                    }
                });
            });
        }

        function onWindowResize() {
            const container = document.getElementById('viewport');
            const canvas = document.getElementById('dataCanvas');
            
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);

            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(0.016);
            controls.update(); // 必须调用 update 以应用阻尼
            renderer.render(scene, camera);
            drawCharts();
        }

    </script>
</body>
</html>
