<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>β衰变过程演示 - 中子转质子版</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: #1a1a20;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --proton-color: #ff4444;
            --neutron-color: #888888;
            --alpha-color: #ffd700;
            --beta-color: #00ffff;
            --gamma-color: #ff00ff;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-color); font-family: sans-serif; }
        .container { display: flex; width: 100vw; height: 100vh; }
        #simulation-area { flex: 1; background: radial-gradient(circle, #1b1b25 0%, #000 100%); }
        #control-panel { width: 340px; background: var(--panel-bg); border-left: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .status-box { background: #252530; padding: 12px; border-radius: 8px; font-size: 14px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .controls button { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; margin-bottom: 8px; width: 100%; text-align: left; }
        .btn-alpha { background: #d4a000; color: #000; }
        .btn-beta { background: #008b8b; }
        .btn-gamma { background: #8b008b; }
        .btn-reset { background: #444; margin-top: auto; position: sticky; bottom: 0; border-radius: 5px 5px 0 0; text-align: center; }
        .info-text { font-size: 13px; color: #aaa; background: #222; padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent-color); margin-bottom: 10px; }
        .equation { font-family: serif; font-size: 16px; text-align: center; margin: 10px 0; color: #fff; }
        sup, sub { font-size: 0.7em; }
    </style>
</head>
<body>
<div class="container">
    <div id="simulation-area"><canvas id="simCanvas"></canvas></div>
    <div id="control-panel">
        <h2>原子核状态</h2>
        <div class="status-box">
            <div class="stat-row"><span>质量数 (A):</span> <span id="val-mass">0</span></div>
            <div class="stat-row"><span>原子序数 (Z):</span> <span id="val-proton">0</span></div>
            <div class="stat-row"><span>中子数 (N):</span> <span id="val-neutron">0</span></div>
            <div class="stat-row"><span>状态:</span> <span id="val-state">基态</span></div>
        </div>
        <div class="controls">
            <h2>衰变控制</h2>
            <button class="btn-alpha" onclick="triggerAlpha()">α 衰变 (发射氦核)</button>
            <div id="info-alpha" class="info-text" style="display:none">
                <div class="equation"><sup>A</sup><sub>Z</sub>X &rarr; <sup>A-4</sup><sub>Z-2</sub>Y + <sup>4</sup><sub>2</sub>He</div>
            </div>
            
            <button class="btn-beta" onclick="triggerBeta()">β 衰变 (中子&rarr;质子)</button>
            <div id="info-beta" class="info-text" style="display:none">
                <strong>观察：</strong>一个中子变红成为质子，并射出青色电子。
                <div class="equation"><sup>1</sup><sub>0</sub>n &rarr; <sup>1</sup><sub>1</sub>p + <sup>0</sup><sub>-1</sub>e</div>
            </div>

            <button class="btn-gamma" id="btn-gamma" class="btn-gamma" onclick="triggerGamma()" disabled>γ 衰变 (能量释放)</button>
            <div id="info-gamma" class="info-text" style="display:none">
                <div class="equation"><sup>A</sup><sub>Z</sub>X<sup>*</sup> &rarr; <sup>A</sup><sub>Z</sub>X + &gamma;</div>
            </div>
        </div>
        <button class="btn-reset" onclick="initNucleus()">重置原子核</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [], emittedParticles = [], gammaWaves = [], isExcited = false;

    class Particle {
        constructor(type, x, y) {
            this.type = type; this.x = x; this.y = y;
            this.vx = 0; this.vy = 0;
            this.radius = type === 'e' ? 3 : 8;
            this.targetX = x; this.targetY = y;
            this.pulse = 0; // 新增：转变时的波纹效果
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            const style = getComputedStyle(document.body);
            const colors = {p:'--proton-color', n:'--neutron-color', e:'--beta-color', a:'--alpha-color'};
            ctx.fillStyle = style.getPropertyValue(colors[this.type]);
            
            if (isExcited && (this.type==='p'||this.type==='n') && !this.isEmitted) {
                ctx.shadowBlur = 10; ctx.shadowColor = style.getPropertyValue('--gamma-color');
            }
            ctx.fill();
            ctx.shadowBlur = 0;

            // 绘制中子变质子的脉冲光圈
            if (this.pulse > 0) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + (1 - this.pulse) * 30, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 68, 68, ${this.pulse})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                this.pulse -= 0.02;
            }
        }
        update() {
            if (this.isEmitted) { this.x += this.vx; this.y += this.vy; } 
            else {
                const dx = this.x - this.targetX, dy = this.y - this.targetY;
                const jitter = isExcited ? 0.8 : 0.2;
                this.x += (Math.random()-0.5)*jitter - dx*0.05;
                this.y += (Math.random()-0.5)*jitter - dy*0.05;
            }
        }
    }

    function initNucleus() {
        particles = []; emittedParticles = []; isExcited = false;
        const cx = canvas.width/2, cy = canvas.height/2;
        for(let i=0; i<36; i++) {
            const type = i < 16 ? 'p' : 'n';
            const angle = i * 2.4; const r = 12 * Math.sqrt(i);
            const p = new Particle(type, cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
            particles.push(p);
        }
        updateUI();
        document.querySelectorAll('.info-text').forEach(e => e.style.display='none');
    }

    function triggerBeta() {
        const neutrons = particles.filter(p => p.type === 'n' && !p.isEmitted);
        if (neutrons.length === 0) return;
        
        const neutron = neutrons[Math.floor(Math.random() * neutrons.length)];
        neutron.type = 'p'; // 关键：原位改变类型
        neutron.pulse = 1.0; // 触发红色光圈

        const electron = new Particle('e', neutron.x, neutron.y);
        electron.isEmitted = true;
        const ang = Math.random()*Math.PI*2;
        electron.vx = Math.cos(ang)*12; electron.vy = Math.sin(ang)*12;
        emittedParticles.push(electron);

        isExcited = true;
        updateUI();
        showInfo('info-beta');
    }

    function triggerAlpha() {
        const pList = particles.filter(p => p.type==='p' && !p.isEmitted);
        const nList = particles.filter(p => p.type==='n' && !p.isEmitted);
        if (pList.length < 2 || nList.length < 2) return;

        const group = [pList[0], pList[1], nList[0], nList[1]];
        const ang = Math.random()*Math.PI*2;
        group.forEach(p => {
            p.isEmitted = true; 
            p.vx = Math.cos(ang)*5; p.vy = Math.sin(ang)*5;
        });
        emittedParticles.push(...group);
        updateUI();
        showInfo('info-alpha');
    }

    function triggerGamma() {
        if (!isExcited) return;
        isExcited = false;
        updateUI();
        showInfo('info-gamma');
    }

    function updateUI() {
        const pCount = particles.filter(p => p.type==='p' && !p.isEmitted).length;
        const nCount = particles.filter(p => p.type==='n' && !p.isEmitted).length;
        document.getElementById('val-proton').innerText = pCount;
        document.getElementById('val-neutron').innerText = nCount;
        document.getElementById('val-mass').innerText = pCount + nCount;
        document.getElementById('val-state').innerText = isExcited ? "激发态" : "基态";
        document.getElementById('val-state').style.color = isExcited ? "var(--gamma-color)" : "var(--accent-color)";
        document.getElementById('btn-gamma').disabled = !isExcited;
    }

    function showInfo(id) {
        document.querySelectorAll('.info-text').forEach(e => e.style.display='none');
        document.getElementById(id).style.display = 'block';
    }

    function loop() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        [...particles, ...emittedParticles].forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(loop);
    }

    window.onresize = () => { canvas.width = window.innerWidth - 340; canvas.height = window.innerHeight; };
    window.onresize();
    initNucleus();
    loop();
</script>
</body>
</html>
