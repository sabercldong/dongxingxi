<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三维浸润/不浸润现象演示 (无图表版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #eee;
            display: flex;
            height: 100vh;
        }

        /* 画布容器 */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #2b2b2b, #1a1a1a);
        }

        /* 右侧功能区 */
        #controls-panel {
            width: 280px;
            background-color: #252526;
            border-left: 1px solid #3e3e42;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto; /* 允许滚轮 */
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* UI 元素样式 */
        h2 { margin-top: 0; font-size: 18px; color: #4facfe; }
        h3 { font-size: 14px; margin-bottom: 5px; color: #aaa; }
        
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background-color: #1785ce; }
        button:active { transform: translateY(1px); }
        button.stop { background-color: #ce3617; }
        
        .control-group {
            background: #333;
            padding: 10px;
            border-radius: 6px;
        }

        label { display: block; margin-bottom: 5px; font-size: 12px; }
        select, input[type="range"] {
            width: 100%;
            padding: 5px;
            background: #444;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
        }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container">
        </div>

    <div id="controls-panel">
        <h2>实验控制台</h2>

        <div class="control-group">
            <h3>播放控制</h3>
            <div style="display: flex; gap: 5px;">
                <button onclick="togglePlay()" id="playBtn">暂停</button>
                <button onclick="resetSim()" class="stop">还原</button>
            </div>
        </div>

        <div class="control-group">
            <h3>实验模式</h3>
            <label for="modeSelect">选择现象：</label>
            <select id="modeSelect" onchange="changeMode()">
                <option value="wetting">浸润现象 (亲水)</option>
                <option value="non-wetting">不浸润现象 (疏水)</option>
            </select>
        </div>

        <div class="control-group">
            <h3>状态参数</h3>
            <label>当前接触角: <span id="angleDisplay">0</span>°</label>
            <div style="height: 10px; background: #444; border-radius: 5px; margin-top: 5px; overflow: hidden;">
                <div id="progressBar" style="width: 0%; height: 100%; background: #4facfe;"></div>
            </div>
        </div>
        
        <div style="font-size: 12px; color: #888; margin-top: auto;">
            <p>操作提示：</p>
            <ul>
                <li>左键：旋转视角</li>
                <li>右键：平移视角</li>
                <li>滚轮：缩放</li>
            </ul>
        </div>
    </div>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let dropMesh, dropGroup;
        let animationId;
        
        // 模拟状态
        let isPlaying = true;
        let targetAngle = 30; // 目标接触角
        let currentAngle = 140; // 初始接触角
        
        const MODES = {
            'wetting': { target: 20, start: 150, color: 0x4facfe },
            'non-wetting': { target: 140, start: 150, color: 0x88ddff }
        };

        // ================= 1. 初始化 Three.js 场景 =================
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            scene.fog = new THREE.Fog(0x222222, 20, 100);

            // 相机
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 控制器
            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            } else {
                console.error("未找到 OrbitControls");
                alert("错误：OrbitControls 加载失败。");
            }

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // --- 创建物体 ---

            // 1. 地面
            const planeGeometry = new THREE.PlaneGeometry(50, 50);
            const planeMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x555555, 
                roughness: 0.8,
                metalness: 0.2
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // 网格
            const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0x444444);
            scene.add(gridHelper);

            // 2. 液滴
            dropGroup = new THREE.Group();
            
            const sphereGeo = new THREE.SphereGeometry(3, 64, 64);
            sphereGeo.translate(0, 3, 0); 
            
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color: 0x4facfe,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.6,
                thickness: 1.0,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            
            dropMesh = new THREE.Mesh(sphereGeo, sphereMat);
            dropMesh.castShadow = true;
            
            dropGroup.add(dropMesh);
            scene.add(dropGroup);

            // 监听窗口大小
            window.addEventListener('resize', onWindowResize);
            
            // 初始化模式
            changeMode();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // ================= 2. 动画与逻辑循环 =================
        function animate() {
            animationId = requestAnimationFrame(animate);

            if (controls) controls.update();

            if (isPlaying) {
                // 简单的线性插值模拟过程
                if (Math.abs(currentAngle - targetAngle) > 0.1) {
                    currentAngle += (targetAngle - currentAngle) * 0.05;
                } else {
                    currentAngle = targetAngle;
                }
            }

            // --- 核心物理视觉模拟 ---
            // 归一化角度因子 (0 = 铺平, 1 = 球体)
            const factor = Math.max(0, Math.min(1, currentAngle / 180));
            
            // 计算缩放
            // 高度：角度越小越低
            const scaleY = 0.1 + 0.9 * Math.sin((currentAngle / 180) * Math.PI / 1.2); 
            
            // 宽度：体积守恒近似
            const scaleXZ = 1 + (1 - factor) * 3.0;

            dropGroup.scale.set(scaleXZ, scaleY, scaleXZ);

            // 更新UI文字
            document.getElementById('angleDisplay').innerText = currentAngle.toFixed(1);
            
            // 更新进度条
            const progress = 100 - (Math.abs(currentAngle - targetAngle) / 180 * 100);
            document.getElementById('progressBar').style.width = progress + "%";

            renderer.render(scene, camera);
        }

        // ================= 3. 交互逻辑 =================

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "暂停" : "开始";
        }

        function resetSim() {
            const mode = document.getElementById('modeSelect').value;
            currentAngle = MODES[mode].start;
            if (!isPlaying) togglePlay(); 
        }

        function changeMode() {
            const mode = document.getElementById('modeSelect').value;
            targetAngle = MODES[mode].target;
        }

        // ================= 启动 =================
        window.onload = function() {
            try {
                initThree();
                animate();
            } catch (e) {
                console.error(e);
                alert("程序初始化失败。请确保 three.min.js 和 OrbitControls.js 存在且路径正确。");
            }
        };

    </script>
</body>
</html>
