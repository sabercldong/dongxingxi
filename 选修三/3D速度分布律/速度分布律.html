<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>麦克斯韦速率分布律 3D演示 (固定坐标轴)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* 布局容器 */
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 右侧功能区 */
        #controls-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: rgba(30, 30, 30, 0.9);
            color: #eee;
            padding: 20px;
            box-sizing: border-box;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        /* 控件样式 */
        .control-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-pause { background-color: #ffc107; color: black; }
        .btn-reset { background-color: #dc3545; color: white; }
        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.98); }

        .value-display { float: right; color: #fff; font-weight: bold; }

        /* 左上角图表容器 (可拖动) */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 450px; /* 稍微加宽以适应固定坐标轴 */
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 20;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #chart-header {
            padding: 10px;
            background: #eee;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
        }

        #chart-title { font-weight: bold; font-size: 14px; color: #333; }
        
        #chart-controls button {
            background: none;
            border: 1px solid #999;
            color: #333;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }

        #chart-body {
            padding: 10px;
            height: 250px;
            transition: height 0.3s;
        }

        .hidden-body { height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; }

        /* 图表隐藏时的占位按钮 */
        #show-chart-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 15;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: none; /* 默认隐藏 */
        }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="container"></div>

    <div id="chart-wrapper">
        <div id="chart-header">
            <span id="chart-title">📊 速率分布统计 (固定坐标轴 0-80)</span>
            <div id="chart-controls">
                <button onclick="toggleChart(false)">_</button> <button onclick="hideChart()">X</button> </div>
        </div>
        <div id="chart-body">
            <canvas id="distributionChart"></canvas>
        </div>
    </div>
    <button id="show-chart-btn" onclick="showChart()">显示图表</button>

    <div id="controls-panel">
        <h3>控制台</h3>
        <hr style="border: 0; border-top: 1px solid #555; width: 100%;">

        <div class="control-group">
            <label>温度 (T) <span id="val-temp" class="value-display">300 K</span></label>
            <input type="range" id="slider-temp" min="50" max="1000" value="300" step="10">
        </div>

        <div class="control-group">
            <label>粒子质量 (m) <span id="val-mass" class="value-display">20 u</span></label>
            <input type="range" id="slider-mass" min="1" max="100" value="20" step="1">
        </div>

        <div class="control-group">
            <label>粒子数量 <span id="val-count" class="value-display">500</span></label>
            <input type="range" id="slider-count" min="100" max="2000" value="500" step="100">
        </div>
        
        <div class="control-group">
            <label>模拟速度 <span id="val-speed" class="value-display">1.0x</span></label>
            <input type="range" id="slider-timescale" min="0.1" max="3.0" value="1.0" step="0.1">
        </div>

        <div class="btn-group">
            <button class="btn-start" onclick="setPlayState(true)">开始</button>
            <button class="btn-pause" onclick="setPlayState(false)">暂停</button>
        </div>
        <div class="btn-group">
            <button class="btn-reset" onclick="resetSimulation()">还原 / 重置</button>
        </div>

        <div style="margin-top: auto; font-size: 12px; color: #666;">
            <p>操作说明：<br>• 左键旋转<br>• 右键平移<br>• 滚轮缩放<br>• 左上角图表可拖动</p>
        </div>
    </div>

<script>
    // ==========================================
    // 1. 全局变量与配置
    // ==========================================
    let scene, camera, renderer, controls;
    let particlesMesh;
    let dummy = new THREE.Object3D();
    
    // 物理参数
    const BOX_SIZE = 40;
    const KB = 1; // 玻尔兹曼常数 (简化单位)
    let params = {
        temp: 300,
        mass: 20,
        count: 500,
        timeScale: 1.0
    };

    // 粒子数据
    let positions = [];
    let velocities = [];
    let isPaused = false;
    
    // 图表相关
    let chartInstance = null;
    let chartUpdateCounter = 0;
    // 【关键修改】固定图表X轴最大值，防止伸缩
    const CHART_X_MAX = 80; 
    const CHART_BINS = 80; // 分辨率

    // ==========================================
    // 2. 初始化 Three.js 场景
    // ==========================================
    function initThree() {
        const container = document.getElementById('container');

        // 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // 相机
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerWidth, 0.1, 1000); 
        camera.position.set(0, 40, 80);

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); 
        container.appendChild(renderer.domElement);

        // 控制器
        if (THREE.OrbitControls) {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
        } else if (typeof OrbitControls !== 'undefined') {
            controls = new OrbitControls(camera, renderer.domElement);
        }
        
        if(controls) {
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }

        // 辅助元素：盒子边界
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const boxEdges = new THREE.EdgesGeometry(boxGeo);
        const boxLine = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0x444444 }));
        scene.add(boxLine);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 初始化粒子
        initParticles();

        // 窗口大小调整监听
        window.addEventListener('resize', onWindowResize);
        onWindowResize(); 
    }

    function onWindowResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    // ==========================================
    // 3. 粒子系统逻辑
    // ==========================================
    function initParticles() {
        if (particlesMesh) {
            scene.remove(particlesMesh);
            particlesMesh.geometry.dispose();
            particlesMesh.material.dispose();
        }

        const geometry = new THREE.SphereGeometry(0.5, 12, 12);
        const material = new THREE.MeshPhongMaterial({ color: 0x00aaff });
        particlesMesh = new THREE.InstancedMesh(geometry, material, params.count);
        
        positions = [];
        velocities = [];

        for (let i = 0; i < params.count; i++) {
            const x = (Math.random() - 0.5) * BOX_SIZE;
            const y = (Math.random() - 0.5) * BOX_SIZE;
            const z = (Math.random() - 0.5) * BOX_SIZE;
            positions.push(new THREE.Vector3(x, y, z));
            
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            particlesMesh.setMatrixAt(i, dummy.matrix);
        }
        
        generateMaxwellVelocities();
        scene.add(particlesMesh);
    }

    function generateMaxwellVelocities() {
        velocities = [];
        const sigma = Math.sqrt((KB * params.temp) / params.mass);

        for (let i = 0; i < params.count; i++) {
            const vx = gaussianRandom(0, sigma);
            const vy = gaussianRandom(0, sigma);
            const vz = gaussianRandom(0, sigma);
            velocities.push(new THREE.Vector3(vx, vy, vz));
        }
    }

    function gaussianRandom(mean, std) {
        const u = 1 - Math.random(); 
        const v = Math.random();
        const z = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
        return z * std + mean;
    }

    // ==========================================
    // 4. 动画循环与物理更新
    // ==========================================
    function animate() {
        requestAnimationFrame(animate);

        if (controls) controls.update();

        if (!isPaused) {
            updatePhysics();
        }

        renderer.render(scene, camera);
        
        chartUpdateCounter++;
        if (chartUpdateCounter > 5) { // 稍微加快刷新率
            updateChartData();
            chartUpdateCounter = 0;
        }
    }

    function updatePhysics() {
        const halfBox = BOX_SIZE / 2 - 0.5; 
        const dt = 0.1 * params.timeScale; 

        for (let i = 0; i < params.count; i++) {
            const pos = positions[i];
            const vel = velocities[i];

            pos.addScaledVector(vel, dt);

            if (pos.x > halfBox) { pos.x = halfBox; vel.x *= -1; }
            if (pos.x < -halfBox) { pos.x = -halfBox; vel.x *= -1; }
            if (pos.y > halfBox) { pos.y = halfBox; vel.y *= -1; }
            if (pos.y < -halfBox) { pos.y = -halfBox; vel.y *= -1; }
            if (pos.z > halfBox) { pos.z = halfBox; vel.z *= -1; }
            if (pos.z < -halfBox) { pos.z = -halfBox; vel.z *= -1; }

            dummy.position.copy(pos);
            dummy.updateMatrix();
            particlesMesh.setMatrixAt(i, dummy.matrix);
        }
        particlesMesh.instanceMatrix.needsUpdate = true;
    }

    // ==========================================
    // 5. 图表逻辑 (固定X轴版)
    // ==========================================
    function initChart() {
        const ctx = document.getElementById('distributionChart').getContext('2d');
        
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: '理论分布 (Maxwell)',
                        data: [],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0,
                        tension: 0.4
                    },
                    {
                        label: '实际模拟统计',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        type: 'bar',
                        barPercentage: 1.0,
                        categoryPercentage: 1.0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 }, 
                scales: {
                    x: { 
                        title: { display: true, text: '速率 (v)' },
                        min: 0,
                        max: CHART_X_MAX, // 【修改】强制固定最大值
                        ticks: { maxTicksLimit: 10 }
                    },
                    y: { 
                        title: { display: true, text: '概率/频数' },
                        display: false 
                    }
                },
                plugins: {
                    legend: { display: true, labels: { boxWidth: 10 } }
                }
            }
        });
    }

    function updateChartData() {
        if (!chartInstance || document.getElementById('chart-wrapper').style.display === 'none') return;

        // 1. 准备数据容器，基于固定范围 CHART_X_MAX
        const binCount = CHART_BINS; 
        const binSize = CHART_X_MAX / binCount;
        const histogram = new Array(binCount).fill(0);
        
        // 2. 统计实际粒子速率 (填入固定分箱)
        // 性能优化：直接遍历
        for(let v of velocities) {
            const s = v.length();
            let binIndex = Math.floor(s / binSize);
            if (binIndex < binCount) {
                histogram[binIndex]++;
            }
        }

        // 3. 计算理论曲线 Maxwell-Boltzmann
        const labels = [];
        const theoryData = [];
        const m = params.mass;
        const T = params.temp;
        const k = KB;
        
        const prefactor = 4 * Math.PI * Math.pow(m / (2 * Math.PI * k * T), 1.5);
        
        // 缩放系数：让理论曲线高度匹配直方图峰值
        const maxHistVal = Math.max(...histogram) || 1; 
        const v_p = Math.sqrt(2 * k * T / m);
        const theoryPeak = prefactor * Math.pow(v_p, 2) * Math.exp(-m * v_p*v_p / (2*k*T));
        const scaleFactor = theoryPeak > 0 ? maxHistVal / theoryPeak : 0;

        for (let i = 0; i < binCount; i++) {
            const v = (i + 0.5) * binSize; // 取bin中心
            labels.push(v.toFixed(1)); // X轴标签
            
            // 理论值计算
            const prob = prefactor * (v * v) * Math.exp((-m * v * v) / (2 * k * T));
            theoryData.push(prob * scaleFactor); 
        }

        // 更新图表
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = theoryData;
        chartInstance.data.datasets[1].data = histogram;
        chartInstance.update();
    }

    // ==========================================
    // 6. UI 交互
    // ==========================================
    function initUI() {
        bindSlider('slider-temp', 'val-temp', (val) => { params.temp = parseFloat(val); resetSimulation(); });
        bindSlider('slider-mass', 'val-mass', (val) => { params.mass = parseFloat(val); resetSimulation(); });
        bindSlider('slider-timescale', 'val-speed', (val) => { params.timeScale = parseFloat(val); }, 'x');
        
        const countSlider = document.getElementById('slider-count');
        countSlider.addEventListener('input', (e) => {
            document.getElementById('val-count').textContent = e.target.value;
        });
        countSlider.addEventListener('change', (e) => {
            params.count = parseInt(e.target.value);
            resetSimulation();
        });

        makeDraggable(document.getElementById('chart-wrapper'), document.getElementById('chart-header'));
    }

    function bindSlider(id, displayId, callback, suffix = '') {
        const slider = document.getElementById(id);
        const display = document.getElementById(displayId);
        slider.addEventListener('input', (e) => {
            display.textContent = e.target.value + suffix;
            callback(e.target.value);
        });
    }

    function setPlayState(play) {
        isPaused = !play;
    }

    function resetSimulation() {
        initParticles(); 
        updateChartData(); 
    }

    function toggleChart(minimized) {
        const body = document.getElementById('chart-body');
        if (body.classList.contains('hidden-body')) {
            body.classList.remove('hidden-body');
        } else {
            body.classList.add('hidden-body');
        }
    }

    function hideChart() {
        document.getElementById('chart-wrapper').style.display = 'none';
        document.getElementById('show-chart-btn').style.display = 'block';
    }

    function showChart() {
        document.getElementById('chart-wrapper').style.display = 'flex';
        document.getElementById('show-chart-btn').style.display = 'none';
        updateChartData();
    }

    function makeDraggable(elmnt, handle) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        handle.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    window.onload = function() {
        initThree();
        initChart();
        initUI();
        animate();
    };

</script>
</body>
</html>
