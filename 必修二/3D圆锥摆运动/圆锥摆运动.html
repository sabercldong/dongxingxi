<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 圆锥摆仿真 (无图表版)</title>
    <style>
        /* 基础样式：全屏黑色背景 */
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        
        /* 1. 3D 画布容器 */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* 2. 右侧功能区 UI */
        #ui-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: rgba(30, 30, 30, 0.9); /* 半透明深色背景 */
            color: white;
            padding: 20px;
            box-sizing: border-box;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 20px; /* 控件间距 */
            overflow-y: auto;
        }

        /* 标题样式 */
        h2 { 
            margin-top: 0; 
            font-size: 20px; 
            color: #4db8ff; 
            border-bottom: 1px solid #555; 
            padding-bottom: 10px; 
            text-align: center;
        }
        
        /* 控件组样式 */
        .control-group {
            margin-bottom: 5px;
        }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #ccc;
        }
        
        /* 滑块样式 */
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4db8ff; /* 现代浏览器支持的滑块颜色 */
        }

        /* 数值显示 */
        .value-display { 
            float: right; 
            color: #fff; 
            font-weight: bold;
        }

        /* 按钮组容器 */
        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
        }
        
        /* 按钮通用样式 */
        button {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        button:hover { background: #555; }
        
        /* 激活状态按钮（高亮） */
        button.active { 
            background: #4db8ff; 
            color: #000; 
            border-color: #4db8ff; 
            font-weight: bold;
        }

        /* 重置按钮特别样式 */
        #btn-reset {
            background-color: #d9534f;
            border-color: #d43f3a;
        }
        #btn-reset:hover {
            background-color: #c9302c;
        }

        /* 底部说明文字 */
        .info-text {
            margin-top: auto; /* 推到底部 */
            font-size: 12px; 
            color: #888; 
            line-height: 1.6;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>圆锥摆控制台</h2>
        
        <div class="control-group">
            <label>绳长 (L) <span id="val-length" class="value-display">5.0</span> m</label>
            <input type="range" id="slider-length" min="1" max="10" step="0.1" value="5">
        </div>

        <div class="control-group">
            <label>摆角 (θ) <span id="val-theta" class="value-display">30</span> °</label>
            <input type="range" id="slider-theta" min="5" max="85" step="1" value="30">
        </div>

        <div class="control-group">
            <label>仿真速度 <span id="val-speed" class="value-display">1.0</span> x</label>
            <input type="range" id="slider-speed" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>

        <div class="btn-group">
            <button id="btn-start" onclick="setPlayState('play')">开始</button>
            <button id="btn-pause" onclick="setPlayState('pause')" class="active">暂停</button>
        </div>
        
        <div class="btn-group">
            <button id="btn-reset" onclick="resetSim()">还原 / 重置</button>
        </div>

        <div class="info-text">
            <p><strong>原理说明：</strong></p>
            小球在水平面上做匀速圆周运动，绳子扫过的轨迹形成圆锥面。<br><br>
            角速度公式：<br>
            ω = √(g / (L · cosθ))
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>

    <script>
        // ================= 1. 全局变量定义 =================
        let scene, camera, renderer, controls;
        let pendulumGroup, stringLine, ballMesh, pivotMesh;
        
        // 动画状态
        let isPaused = true;
        let simTime = 0;      // 仿真累计时间
        let timeSpeed = 1.0;  // 时间流逝倍率

        // 物理参数 (默认值)
        let params = {
            length: 5,     // 绳长 (米)
            thetaDeg: 30,  // 摆角 (度)
            g: 9.81        // 重力加速度
        };

        // ================= 2. 初始化 Three.js 场景 =================
        function init3D() {
            const container = document.getElementById('canvas-container');

            // --- 场景 ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a); // 深灰色背景
            
            // --- 网格与坐标系 (辅助线) ---
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            const axesHelper = new THREE.AxesHelper(2); // 红绿蓝坐标轴
            scene.add(axesHelper);

            // --- 相机 ---
            // 参数：视野角, 宽高比, 近平面, 远平面
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(12, 6, 12); // 设置相机初始位置
            camera.lookAt(0, 3, 0);

            // --- 渲染器 ---
            renderer = new THREE.WebGLRenderer({ antialias: true }); // 开启抗锯齿
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // 适配高清屏
            container.appendChild(renderer.domElement);

            // --- 控制器 (鼠标交互) ---
            // 兼容性处理：检查 OrbitControls 是在 THREE 命名空间下还是全局变量
            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, renderer.domElement);
            } else {
                alert("无法加载 OrbitControls，请检查文件名是否正确 (OrbitControls.js)。");
            }

            if(controls) {
                controls.enableDamping = true; // 开启阻尼滑动效果
                controls.dampingFactor = 0.05;
                controls.target.set(0, 3, 0); // 旋转中心设在半空
            }

            // --- 灯光 ---
            const ambientLight = new THREE.AmbientLight(0x606060); // 环境光
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); // 平行光
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // --- 创建物理模型 ---
            createModel();

            // --- 监听窗口缩放 ---
            window.addEventListener('resize', onWindowResize);
        }

        // ================= 3. 创建模型 (球、绳、支点) =================
        function createModel() {
            // 1. 支点 (悬挂点)
            const pivotGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const pivotMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
            pivotMesh = new THREE.Mesh(pivotGeo, pivotMat);
            pivotMesh.position.set(0, 8, 0); // 假设悬挂点高度为 8
            scene.add(pivotMesh);

            // 2. 摆球
            const ballGeo = new THREE.SphereGeometry(0.4, 32, 32);
            const ballMat = new THREE.MeshPhongMaterial({ 
                color: 0x00ffcc, 
                shininess: 100,
                specular: 0x444444
            });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            scene.add(ballMesh);

            // 3. 绳子 (使用 Line)
            // BufferGeometry 更适合每一帧更新顶点
            const lineGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(2 * 3); // 2个点 (起点, 终点)，每个点 x,y,z
            lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            stringLine = new THREE.Line(lineGeo, lineMat);
            scene.add(stringLine);

            // 初始化一次位置
            updatePhysicsPosition(); 
        }

        // ================= 4. 物理计算核心 =================
        function updatePhysicsPosition() {
            // 将角度转换为弧度
            const thetaRad = params.thetaDeg * (Math.PI / 180);
            
            // 物理公式计算
            // r = 旋转半径, h = 垂直高度差
            const r = params.length * Math.sin(thetaRad);
            const h = params.length * Math.cos(thetaRad);
            
            // 圆锥摆角速度公式: ω = √(g / h)
            // 注意：当 theta 接近 90度时，h 趋近 0，需要防止除以零（限制 max theta）
            const omega = Math.sqrt(params.g / Math.max(0.1, h)); 

            // 悬挂点坐标
            const pivotY = pivotMesh.position.y;

            // 计算小球的当前坐标
            // x = r * cos(ωt)
            // z = r * sin(ωt)
            // y = pivotY - h
            const x = r * Math.cos(omega * simTime);
            const z = r * Math.sin(omega * simTime);
            const y = pivotY - h;

            // 更新小球 3D 位置
            ballMesh.position.set(x, y, z);

            // 更新绳子顶点
            const positions = stringLine.geometry.attributes.position.array;
            
            // 顶点0 (悬挂点)
            positions[0] = 0;
            positions[1] = pivotY;
            positions[2] = 0;
            
            // 顶点1 (小球位置)
            positions[3] = x;
            positions[4] = y;
            positions[5] = z;

            // 标记几何体需要更新
            stringLine.geometry.attributes.position.needsUpdate = true;
        }

        // ================= 5. 动画循环 =================
        function animate() {
            requestAnimationFrame(animate);

            // 如果未暂停，增加仿真时间
            if (!isPaused) {
                // 0.016 约为 60FPS 的一帧时间，乘以倍速
                simTime += 0.016 * timeSpeed;
                updatePhysicsPosition();
            }

            // 更新控制器和渲染
            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        // ================= 6. UI 交互逻辑 =================
        
        // 获取 DOM 元素
        const sLen = document.getElementById('slider-length');
        const sTheta = document.getElementById('slider-theta');
        const sSpeed = document.getElementById('slider-speed');
        
        const valLen = document.getElementById('val-length');
        const valTheta = document.getElementById('val-theta');
        const valSpeed = document.getElementById('val-speed');
        
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');

        // 监听滑块事件
        sLen.addEventListener('input', (e) => {
            params.length = parseFloat(e.target.value);
            valLen.textContent = params.length.toFixed(1);
            // 即使暂停也实时更新画面位置，方便预览
            updatePhysicsPosition();
        });

        sTheta.addEventListener('input', (e) => {
            params.thetaDeg = parseFloat(e.target.value);
            valTheta.textContent = params.thetaDeg;
            updatePhysicsPosition();
        });

        sSpeed.addEventListener('input', (e) => {
            timeSpeed = parseFloat(e.target.value);
            valSpeed.textContent = timeSpeed.toFixed(1);
        });

        // 播放/暂停控制
        function setPlayState(state) {
            if (state === 'play') {
                isPaused = false;
                btnStart.classList.add('active');
                btnPause.classList.remove('active');
            } else {
                isPaused = true;
                btnStart.classList.remove('active');
                btnPause.classList.add('active');
            }
        }

        // 重置功能
        function resetSim() {
            // 1. 暂停
            setPlayState('pause');
            
            // 2. 时间归零
            simTime = 0;
            
            // 3. 参数恢复默认
            params.length = 5;
            params.thetaDeg = 30;
            timeSpeed = 1.0;

            // 4. UI 恢复默认
            sLen.value = 5;
            sTheta.value = 30;
            sSpeed.value = 1.0;
            valLen.textContent = "5.0";
            valTheta.textContent = "30";
            valSpeed.textContent = "1.0";

            // 5. 强制刷新一次画面
            updatePhysicsPosition();
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ================= 7. 程序启动 =================
        window.onload = function() {
            init3D();
            resetSim(); // 初始化 UI 状态
            animate();  // 开始动画循环
        };

    </script>
</body>
</html>
