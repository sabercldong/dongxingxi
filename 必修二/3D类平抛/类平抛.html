<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 斜面类平抛 (修正版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; }
        
        #container { display: flex; width: 100vw; height: 100vh; }
        #canvas-box { flex: 1; position: relative; overflow: hidden; background: #1e1e1e; }

        /* 右侧侧边栏 */
        #sidebar {
            width: 300px;
            background: #2d2d2d;
            color: #eee;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 20;
            overflow-y: auto;
        }

        /* 错误提示 */
        #error-console {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(200, 0, 0, 0.9); color: white;
            padding: 15px; border-radius: 4px; z-index: 9999;
            display: none; white-space: pre-wrap;
        }

        /* 图表容器 */
        #chart-wrapper {
            position: absolute; top: 20px; left: 20px;
            width: 380px; height: 260px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px; padding: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 50; display: flex; flex-direction: column;
            transition: opacity 0.3s; /* 淡入淡出效果 */
        }
        #chart-header {
            height: 28px; background: #e0e0e0; color: #444;
            text-align: center; line-height: 28px;
            font-size: 12px; cursor: move; border-radius: 4px;
            margin-bottom: 5px; user-select: none; font-weight: bold;
        }
        #chart-canvas-container { flex: 1; position: relative; }

        /* 控件 */
        h3 { margin: 0 0 10px 0; border-bottom: 1px solid #555; padding-bottom: 10px; font-size: 16px; }
        .control-group { background: #3a3a3a; padding: 12px; border-radius: 6px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #bbb; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn-row { display: flex; gap: 8px; }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; color: white; transition: 0.2s;
            font-size: 13px;
        }
        button:hover { filter: brightness(1.2); }
        button:active { transform: translateY(1px); }

        #btn-start { background: #2e7d32; }
        #btn-pause { background: #f9a825; color: black; }
        #btn-reset { background: #c62828; }
        #btn-toggle-chart { background: #1565c0; width: 100%; margin-top: 5px; }

        .data-val { float: right; color: #4fc3f7; font-family: monospace; }
        .monitor-text { font-family: monospace; color: #81c784; line-height: 1.6; font-size: 13px; }
    </style>

    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./chart.min.js"></script>
</head>
<body>

    <div id="error-console"></div>

    <div id="container">
        <div id="canvas-box">
            <div id="chart-wrapper">
                <div id="chart-header">::: 按住拖动图表 :::</div>
                <div id="chart-canvas-container">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <h3>控制面板</h3>
            
            <div class="btn-row">
                <button id="btn-start">开始</button>
                <button id="btn-pause">暂停</button>
                <button id="btn-reset">还原</button>
            </div>

            <button id="btn-toggle-chart">隐藏图表</button>

            <div class="control-group">
                <label>斜面角度 (°)<span id="val-angle" class="data-val">30</span></label>
                <input type="range" id="inp-angle" min="0" max="60" value="30">
            </div>

            <div class="control-group">
                <label>初速度 Vo (m/s)<span id="val-speed" class="data-val">5</span></label>
                <input type="range" id="inp-speed" min="1" max="15" value="5" step="0.5">
            </div>

            <div class="control-group">
                <label>实时数据</label>
                <div class="monitor-text">
                    时间 t: <span id="info-time" style="color:#fff">0.00</span> s<br>
                    水平 x: <span id="info-x" style="color:#fff">0.00</span> m<br>
                    下落 y: <span id="info-y" style="color:#fff">0.00</span> m
                </div>
            </div>

            <div style="margin-top:auto; font-size:12px; color:#888;">
                <p>💡 左键旋转 | 右键平移 | 滚轮缩放</p>
            </div>
        </div>
    </div>

<script>
    // 错误捕获
    window.onerror = function(msg, url, line) {
        const el = document.getElementById('error-console');
        el.style.display = 'block';
        el.innerText = "⚠️ 运行错误: " + msg;
        return false;
    };

    // --- 核心变量 ---
    let scene, camera, renderer, controls;
    let ball, rampPivot, rampMesh; // rampPivot 是关键，用于控制旋转中心
    let chartInstance;
    let isRunning = false;
    let time = 0;

    // --- 物理参数 ---
    const g = 9.8;
    let angleDeg = 30;
    let v0 = 5;
    
    // 斜面尺寸
    const RAMP_LEN = 24; 
    const RAMP_WID = 12;

    window.onload = function() {
        initThree();
        initControls(); // 兼容各个版本的OrbitControls
        initChart();
        setupUI();
        setupDrag();
        animate();
    };

    function initThree() {
        const container = document.getElementById('canvas-box');
        
        // 1. 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        // 地面网格 (无限延伸感)
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x111111);
        grid.position.y = -0.05; // 稍微下沉一点，防止和斜面底部重叠闪烁
        scene.add(grid);

        const axes = new THREE.AxesHelper(5);
        scene.add(axes);

        // 2. 相机
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 15, 25);
        camera.lookAt(0, 5, 0);

        // 3. 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 4. 灯光
        const ambiLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 5. 创建斜面系统 (重点修复：旋转中心)
        createRampSystem();

        // 6. 创建小球
        const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({ color: 0xff3333, shininess: 100 });
        ball = new THREE.Mesh(sphereGeo, sphereMat);
        ball.castShadow = true;
        // 小球不直接加入 scene，而是作为 rampPivot 的子对象？
        // 不，为了坐标清晰，我们在 updatePhysics 里计算世界坐标。
        scene.add(ball);

        updateBallPosition(0);

        window.addEventListener('resize', onWindowResize);
    }

    function createRampSystem() {
        // 创建一个 pivot (枢轴) 组，位置在原点 (0,0,0)
        // 我们将让斜面以这个点为轴心旋转
        rampPivot = new THREE.Group();
        scene.add(rampPivot);

        // 创建斜面 Mesh
        // 斜面长 RAMP_LEN (24)，宽 RAMP_WID (12)
        // BoxGeometry 默认中心在 (0,0,0)
        const geometry = new THREE.BoxGeometry(RAMP_LEN, 0.5, RAMP_WID);
        const material = new THREE.MeshPhongMaterial({ color: 0x4a6fa5, side: THREE.DoubleSide });
        rampMesh = new THREE.Mesh(geometry, material);
        rampMesh.receiveShadow = true;

        // 【关键修复】：位置偏移
        // 我们希望旋转轴在斜面的“右端”或“底端”。
        // 假设斜面是把左边抬起来，那么右端是轴心。
        // Box中心是0。如果右移 12 (RAMP_LEN/2)，那么左端在0，右端在24。
        // 如果左移 12，那么左端在 -24，右端在 0。
        // 我们选择左移：让斜面处于 x < 0 的区域，右端接触原点。
        rampMesh.position.x = -RAMP_LEN / 2; 
        
        // 放入组中
        rampPivot.add(rampMesh);

        // 初始旋转
        setRampAngle(angleDeg);
    }

    function setRampAngle(deg) {
        // 绕 Z 轴旋转。
        // Box在左边 (-X区域)。要抬起左边，需要绕 Z 轴 顺时针旋转 (负角度)？
        // 验证：Z轴向屏幕外。
        // X轴正向右，Y轴正向上。
        // 点 (-10, 0)。
        // 绕Z轴逆时针(+) -> 跑到第三象限 (-x, -y)。不对，那是压入地下。
        // 绕Z轴顺时针(-) -> 跑到第二象限 (-x, +y)。对，抬起来了！
        const rad = deg * Math.PI / 180;
        rampPivot.rotation.z = -rad;
    }

    function updateBallPosition(t) {
        const rad = angleDeg * Math.PI / 180;
        
        // 在斜面平面内的运动 (Local Coordinates)
        // 原点：斜面底部 (pivot点)
        // 坐标系：
        //   Local X axis: 沿斜面向上为负，向下为正？
        //   我们刚才把板子放到了 x < 0 的位置。
        //   所以板子是从 -RAMP_LEN 到 0。
        //   球从板子顶部开始。顶部位置 x_local_start = -RAMP_LEN + 2 (留点余量)。
        
        // 运动分解：
        // 1. 沿斜面下滑 (加速): 沿着 Local X 轴正方向 (从 -24 向 0 运动)
        //    dist_slide = 0.5 * g * sin(θ) * t^2
        //    local_x = start_x + dist_slide
        
        // 2. 水平飞出 (匀速): 沿着 Local Z 轴 (板子的宽度方向)
        //    local_z = start_z + v0 * t
        
        const start_local_x = -RAMP_LEN + 2; // 离顶端一点距离
        const start_local_z = -RAMP_WID / 2 + 2; // 离侧边一点距离
        
        const a = g * Math.sin(rad);
        const dist_slide = 0.5 * a * t * t;
        const dist_horiz = v0 * t;

        const current_local_x = start_local_x + dist_slide;
        const current_local_z = start_local_z + dist_horiz;

        // --- 坐标转换：Local -> World ---
        // 我们有一个向量 V_local = (current_local_x, 0, current_local_z)
        // (y为0是因为球贴着板面，稍后加半径修正)
        // 这个向量属于 rampPivot 坐标系。
        // rampPivot 绕 Z 轴旋转了 -rad。
        
        // 手动旋转矩阵 (绕 Z 轴 -rad):
        // x' = x * cos(-rad) - y * sin(-rad)
        // y' = x * sin(-rad) + y * cos(-rad)
        // z' = z
        
        // 这里 y_local 其实是板面法向高度 (球半径)
        const ball_radius = 0.5;
        const board_thickness = 0.5;
        const y_offset = ball_radius + (board_thickness / 2);

        const cos = Math.cos(-rad);
        const sin = Math.sin(-rad);

        const world_x = current_local_x * cos - y_offset * sin;
        const world_y = current_local_x * sin + y_offset * cos;
        const world_z = current_local_z;

        ball.position.set(world_x, world_y, world_z);

        // 旋转球体增加动感
        ball.rotation.x -= 0.1;
        ball.rotation.z -= 0.1;

        // 更新 UI 数据
        document.getElementById('info-time').innerText = t.toFixed(2);
        document.getElementById('info-x').innerText = dist_horiz.toFixed(2);
        document.getElementById('info-y').innerText = dist_slide.toFixed(2);

        // 更新图表
        if (isRunning && chartInstance && t % 0.05 < 0.02) {
            chartInstance.data.datasets[0].data.push({ x: dist_horiz, y: dist_slide });
            chartInstance.update('none'); // 'none' 模式更新更流畅
        }

        // 边界检测：如果在板子范围内
        // local_x 必须 < 0 (到了0就滑出底端了)
        // local_z 必须 < RAMP_WID/2 (到了侧边)
        if (current_local_x > 0 || current_local_z > RAMP_WID/2 - 0.5) {
            isRunning = false;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if (isRunning) {
            time += 0.016;
            updateBallPosition(time);
        }

        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    // --- Chart.js ---
    function initChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        // 兼容 v2 / v3
        const scaleOpts = {
            x: { type: 'linear', position: 'bottom', title: {display:true, text:'水平位移 x (m)'}, min: 0, max: 20 },
            y: { reverse: true, title: {display:true, text:'沿斜面下落 y (m)'}, min: 0, max: 20 }
        };
        
        // 如果是 Chart.js 2.x，配置不同，这里做一个简易适配
        // 你的通用版通常是 2.x 或 3.x，这里默认用 3.x 语法，大部分情况兼容
        
        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: '板面轨迹',
                    data: [],
                    borderColor: '#2196F3',
                    backgroundColor: 'rgba(33, 150, 243, 0.5)',
                    showLine: true,
                    borderWidth: 2,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: scaleOpts,
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // --- UI 控制 ---
    function setupUI() {
        // 按钮逻辑
        document.getElementById('btn-start').onclick = () => isRunning = true;
        document.getElementById('btn-pause').onclick = () => isRunning = false;
        document.getElementById('btn-reset').onclick = resetSim;

        // 图表开关
        const btnToggle = document.getElementById('btn-toggle-chart');
        const chartBox = document.getElementById('chart-wrapper');
        let isChartVisible = true;
        btnToggle.onclick = () => {
            isChartVisible = !isChartVisible;
            chartBox.style.opacity = isChartVisible ? '1' : '0';
            // 延时为了动画效果，完全透明后禁用鼠标交互
            chartBox.style.pointerEvents = isChartVisible ? 'auto' : 'none';
            btnToggle.innerText = isChartVisible ? '隐藏图表' : '显示图表';
        };

        // 滑块
        const elAngle = document.getElementById('inp-angle');
        const elSpeed = document.getElementById('inp-speed');

        elAngle.oninput = function() {
            angleDeg = parseFloat(this.value);
            document.getElementById('val-angle').innerText = angleDeg;
            setRampAngle(angleDeg);
            if (!isRunning) updateBallPosition(0);
        };

        elSpeed.oninput = function() {
            v0 = parseFloat(this.value);
            document.getElementById('val-speed').innerText = v0;
            if (!isRunning) updateBallPosition(0);
        };
    }

    function resetSim() {
        isRunning = false;
        time = 0;
        updateBallPosition(0);
        if (chartInstance) {
            chartInstance.data.datasets[0].data = [];
            chartInstance.update();
        }
    }

    function initControls() {
        // 鲁棒的控制器加载
        if (typeof THREE !== 'undefined' && THREE.OrbitControls) {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
        } else if (typeof OrbitControls !== 'undefined') {
            controls = new OrbitControls(camera, renderer.domElement);
        }
        if(controls) {
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }
    }

    function onWindowResize() {
        camera.aspect = document.getElementById('canvas-box').clientWidth / document.getElementById('canvas-box').clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(document.getElementById('canvas-box').clientWidth, document.getElementById('canvas-box').clientHeight);
    }

    // --- 拖拽功能 ---
    function setupDrag() {
        const elmnt = document.getElementById("chart-wrapper");
        const header = document.getElementById("chart-header");
        let pos1=0, pos2=0, pos3=0, pos4=0;
        
        header.onmousedown = function(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        };

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }
</script>
</body>
</html>
