<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卫星变轨物理模拟 (High Precision Physics)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        
        /* 1. 左上角图表容器 */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #chart-header {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #4facfe;
            cursor: move;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            user-select: none;
        }
        #chart-close { cursor: pointer; color: #ff6b6b; }

        /* 2. 右侧功能区 */
        #controls-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 30, 0.9);
            border-left: 1px solid #444;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            color: #eee;
            z-index: 90;
        }

        h2 { margin-top: 0; font-size: 18px; color: #4facfe; border-bottom: 2px solid #4facfe; padding-bottom: 10px; }
        .control-group { margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px;}
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        
        button {
            width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .btn-primary { background: #4facfe; color: white; }
        .btn-primary:hover { background: #00f2fe; box-shadow: 0 0 10px #00f2fe; }
        .btn-warning { background: #ff9a9e; color: white; }
        .btn-action { background: linear-gradient(45deg, #43e97b, #38f9d7); color: #000; font-weight: 800; }
        .btn-action:hover { box-shadow: 0 0 15px #38f9d7; transform: scale(1.02); }
        .btn-toggle-chart { background: #666; color: white; }

        input[type=range] { width: 100%; cursor: pointer; }
        
        .status-text {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #0f0;
        }
        .highlight { color: #fff; font-weight: bold; }
        
        /* 闪烁动画，用于点火状态 */
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .burning { color: #ff3333; animation: flash 0.5s infinite; font-weight: bold; }
    </style>
    
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="chart-wrapper">
        <div id="chart-header">
            <span>🚀 速度监测 (Velocity)</span>
            <span id="chart-close">✕</span>
        </div>
        <div style="padding: 10px; background: rgba(0,0,0,0.5);">
            <canvas id="velocityChart" height="180"></canvas>
        </div>
    </div>

    <div id="controls-panel">
        <h2>🛰️ 卫星控制台</h2>
        
        <div class="control-group">
            <button id="btn-start" class="btn-primary">▶ 开始运行</button>
            <button id="btn-pause" class="btn-warning">⏸ 暂停模拟</button>
            <button id="btn-reset" class="btn-warning">↺ 重置系统</button>
        </div>

        <div class="control-group">
            <label>变轨操作 (霍曼转移)：</label>
            <button id="btn-transfer" class="btn-action">🔥 点火变轨 (Ignition)</button>
            <button id="btn-show-chart" class="btn-toggle-chart" style="display:none;">📊 打开图表</button>
            <div style="margin-top:5px; font-size:12px; color:#aaa;">
                * 观察左上角图表的速度突变
            </div>
        </div>

        <div class="control-group">
            <label>仿真倍速: <span id="speed-val">1.0</span>x</label>
            <input type="range" id="sim-speed" min="0.5" max="5.0" step="0.5" value="1.0">
        </div>

        <div class="control-group">
            <label>实时遥测数据:</label>
            <div class="status-text" id="telemetry">
                等待指令...
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // ================= 全局配置 =================
        // 物理常数 (为了可视化进行了缩放，非真实天文单位)
        const GM = 800; // 地球引力参数
        const R_EARTH = 10;
        const R_ORBIT_1 = 18; // 低轨半径 (LEO)
        const R_ORBIT_2 = 32; // 高轨半径 (GEO)
        
        let scene, camera, renderer, controls;
        let earth, satellite, trajectoryLine;
        let isPaused = false;
        let simSpeed = 1.0;
        
        // 卫星状态
        const STATE = {
            LEO: 'LEO',             // 低圆轨道
            TRANSFER: 'TRANSFER',   // 椭圆转移
            GEO: 'GEO'              // 高圆轨道
        };
        
        let currentState = STATE.LEO;
        let angle = 0;              // 轨道相位角 (弧度)
        let currentRadius = R_ORBIT_1;
        let orbitalPeriod = 0;      // 当前轨道周期
        let transferStartAngle = 0; // 记录变轨起始点的角度

        // 图表相关
        let vChart;
        let frameCount = 0;

        // ================= 初始化 =================
        window.onload = function() {
            initThree();
            initChart();
            resetSystem();
            animate();
            setupUI();
        };

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            
            // 1. 星空背景
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<2000; i++) {
                starPos.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:0.2})));

            // 2. 地球
            const earthGeo = new THREE.SphereGeometry(R_EARTH, 48, 48);
            const earthMat = new THREE.MeshPhongMaterial({ 
                color: 0x1144cc, emissive: 0x001133, specular: 0x333333, shininess: 15, wireframe: false 
            });
            earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);
            
            // 经纬网格
            const gridHelper = new THREE.Mesh(earthGeo, new THREE.MeshBasicMaterial({color: 0x4488ff, wireframe: true, transparent: true, opacity: 0.15}));
            scene.add(gridHelper);

            // 3. 卫星
            const satGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.6), new THREE.MeshLambertMaterial({color: 0xeeeeee}));
            const solarPanel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 4), new THREE.MeshLambertMaterial({color: 0x3366cc}));
            solarPanel.rotation.x = Math.PI / 2;
            satGroup.add(body);
            satGroup.add(solarPanel);
            satellite = satGroup;
            scene.add(satellite);

            // 4. 轨道辅助线
            drawOrbitRing(R_ORBIT_1, 0x00ff00, "LEO"); // 绿圈
            drawOrbitRing(R_ORBIT_2, 0xff0000, "GEO"); // 红圈

            // 5. 光照
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(50, 20, 30);
            scene.add(sunLight);
            scene.add(new THREE.AmbientLight(0x404040));

            // 6. 相机与控制
            camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 70);
            
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
        }

        function drawOrbitRing(radius, color) {
            const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, 2*Math.PI, false, 0);
            const pts = curve.getPoints(128);
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
            const ring = new THREE.Line(geo, mat);
            ring.rotation.x = Math.PI/2;
            scene.add(ring);
        }

        // ================= 物理核心逻辑 =================
        function updatePhysics() {
            if (isPaused) return;

            let velocity = 0;
            let dt = 0.01 * simSpeed; // 时间步长

            // --- 状态机 ---
            if (currentState === STATE.LEO) {
                // 圆轨道速度公式: v = sqrt(GM / r)
                currentRadius = R_ORBIT_1;
                velocity = Math.sqrt(GM / currentRadius);
                
                // 角速度 omega = v / r
                angle += (velocity / currentRadius) * dt;

            } else if (currentState === STATE.GEO) {
                // 高轨圆周运动
                currentRadius = R_ORBIT_2;
                velocity = Math.sqrt(GM / currentRadius);
                
                angle += (velocity / currentRadius) * dt;

            } else if (currentState === STATE.TRANSFER) {
                // 霍曼转移轨道 (椭圆)
                // 半长轴 a
                const a = (R_ORBIT_1 + R_ORBIT_2) / 2;
                
                // 根据当前角度计算当前半径 (极坐标方程)
                // r = p / (1 + e*cos(theta))
                // 注意：theta 是真近点角。为了简化，我们假设转移开始时 angle=0 (近地点)
                // 因此 theta = angle - transferStartAngle
                
                const r1 = R_ORBIT_1;
                const r2 = R_ORBIT_2;
                const e = (r2 - r1) / (r2 + r1); // 离心率
                const p = a * (1 - e*e);         // 半通径

                // 计算当前在转移轨道上的相位 (0 到 PI)
                let theta = angle - transferStartAngle;

                // 极坐标求半径
                currentRadius = p / (1 + e * Math.cos(theta));

                // 活力公式 (Vis-viva equation) 计算精确速度
                // v^2 = GM * (2/r - 1/a)
                velocity = Math.sqrt(GM * (2/currentRadius - 1/a));

                // 依据角动量守恒更新角度: r*v_tangential = constant
                // 简化处理：omega = v / r (近似，在极坐标中准确应该是 h/r^2)
                // 为了视觉平滑，我们用 v/r 近似角变化率
                angle += (velocity / currentRadius) * dt;

                // --- 判断是否到达远地点 ---
                // 当转过 180度 (PI) 时
                if (theta >= Math.PI) {
                    console.log("到达远地点 -> 自动切入 GEO");
                    currentState = STATE.GEO;
                    // 修正位置
                    currentRadius = R_ORBIT_2;
                    // 此时速度会再次突增 (从转移轨道的远地点速度 -> GEO圆轨道速度)
                }
            }

            // 更新物体位置
            satellite.position.x = currentRadius * Math.cos(angle);
            satellite.position.z = currentRadius * Math.sin(angle);
            satellite.rotation.y += 0.02; // 卫星自转

            // UI更新
            updateTelemetry(velocity);
            updateChart(velocity);
        }

        // ================= 图表逻辑 (重点修改) =================
        function initChart() {
            const ctx = document.getElementById('velocityChart').getContext('2d');
            
            // 渐变色背景
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(79, 172, 254, 0.5)');
            gradient.addColorStop(1, 'rgba(79, 172, 254, 0.0)');

            vChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(60).fill(''),
                    datasets: [{
                        label: '卫星速度 (Velocity)',
                        data: Array(60).fill(null),
                        borderColor: '#4facfe',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        tension: 0.4 // 平滑曲线
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: '#333' },
                            ticks: { color: '#888', font: {size: 10} },
                            suggestedMin: 3,
                            suggestedMax: 8
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
            
            // 拖动功能
            const wrapper = document.getElementById('chart-wrapper');
            const header = document.getElementById('chart-header');
            let isDrag = false, offX, offY;
            header.addEventListener('mousedown', e => { isDrag = true; offX = e.clientX - wrapper.offsetLeft; offY = e.clientY - wrapper.offsetTop; });
            window.addEventListener('mousemove', e => { if(isDrag) { wrapper.style.left = (e.clientX - offX)+'px'; wrapper.style.top = (e.clientY - offY)+'px'; }});
            window.addEventListener('mouseup', () => isDrag = false);
            
            // 关闭功能
            document.getElementById('chart-close').addEventListener('click', () => {
                wrapper.style.display = 'none';
                document.getElementById('btn-show-chart').style.display = 'block';
            });
            document.getElementById('btn-show-chart').addEventListener('click', () => {
                wrapper.style.display = 'block';
                document.getElementById('btn-show-chart').style.display = 'none';
            });
        }

        function updateChart(vel) {
            frameCount++;
            if (frameCount % 5 !== 0) return; // 降低刷新率节省性能

            const data = vChart.data.datasets[0].data;
            data.push(vel);
            data.shift();
            
            // 动态调整Y轴范围以突显变化
            vChart.update();
        }

        // ================= 界面交互 =================
        function updateTelemetry(vel) {
            let statusHtml = "";
            let orbName = "";
            
            if (currentState === STATE.LEO) {
                statusHtml = "<span style='color:#4facfe'>● 轨道巡航中</span>";
                orbName = "低地轨道 (LEO)";
            } else if (currentState === STATE.TRANSFER) {
                // 计算进度
                let progress = ((angle - transferStartAngle) / Math.PI) * 100;
                statusHtml = `<span class='burning'>▲ 变轨机动中... ${progress.toFixed(0)}%</span>`;
                orbName = "霍曼转移轨道 (Elliptical)";
            } else if (currentState === STATE.GEO) {
                statusHtml = "<span style='color:#43e97b'>✔ 入轨成功</span>";
                orbName = "地球静止轨道 (GEO)";
            }

            document.getElementById('telemetry').innerHTML = 
                `指令状态: ${statusHtml}<br>` +
                `当前轨道: <span class="highlight">${orbName}</span><br>` +
                `距地高度: <span class="highlight">${((currentRadius - R_EARTH)*100).toFixed(0)} km</span><br>` +
                `当前速度: <span class="highlight">${vel.toFixed(2)} km/s</span>`;
        }

        function setupUI() {
            document.getElementById('btn-start').onclick = () => isPaused = false;
            document.getElementById('btn-pause').onclick = () => isPaused = true;
            document.getElementById('btn-reset').onclick = resetSystem;
            
            document.getElementById('btn-transfer').onclick = () => {
                if (currentState !== STATE.LEO) {
                    alert("⚠️ 只能从低轨道(LEO)开始变轨。请先点击[重置系统]。");
                    return;
                }
                // 在当前角度开始变轨
                transferStartAngle = angle;
                // 重置一下角度到 0-2PI 之间方便计算，避免大数
                // 为了视觉连贯性，这里我们不重置 satellite.position，只重置逻辑计数
                // 简单处理：将 angle 对 2PI 取模是不行的，因为会跳变。
                // 我们记录 transferStartAngle 即可。
                
                currentState = STATE.TRANSFER;
                isPaused = false;
            };

            document.getElementById('sim-speed').oninput = (e) => {
                simSpeed = parseFloat(e.target.value);
                document.getElementById('speed-val').innerText = simSpeed.toFixed(1);
            };
        }

        function resetSystem() {
            currentState = STATE.LEO;
            angle = 0;
            currentRadius = R_ORBIT_1;
            satellite.position.set(R_ORBIT_1, 0, 0);
            isPaused = false;
            
            // 重置图表数据
            if(vChart) {
                vChart.data.datasets[0].data = Array(60).fill(Math.sqrt(GM/R_ORBIT_1)); 
                vChart.update();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
