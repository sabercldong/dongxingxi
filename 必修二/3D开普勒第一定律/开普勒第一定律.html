<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>开普勒第一定律三维演示 (修复版)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        
        /* 全屏画布 */
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* 错误提示条 (调试用) */
        #error-console {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(220, 53, 69, 0.9); color: white;
            padding: 10px; font-size: 14px; z-index: 9999;
            display: none; box-sizing: border-box;
        }

        /* 右侧控制区 */
        #ui-right {
            position: absolute; top: 20px; right: 20px; width: 260px;
            background: rgba(30, 30, 30, 0.85); color: white;
            padding: 15px; border-radius: 8px; border: 1px solid #444;
            backdrop-filter: blur(5px); user-select: none;
        }
        #ui-right h3 { margin-top: 0; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        .control-group input[type=range] { width: 100%; cursor: pointer; }
        
        .btn-row { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-start { background-color: #28a745; }
        .btn-pause { background-color: #ffc107; color: black; }
        .btn-reset { background-color: #dc3545; }
        .btn:hover { opacity: 0.9; }
        .toggle-chart { margin-top: 10px; width: 100%; background: #17a2b8; }

        /* 左上角图表 */
        #chart-widget {
            position: absolute; top: 20px; left: 20px; width: 350px;
            background: rgba(255, 255, 255, 0.95); border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100;
            display: block; overflow: hidden;
        }
        #chart-header {
            padding: 10px; background: #eee; cursor: move; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc;
        }
        #chart-body { padding: 10px; background: white; }
        .close-btn { cursor: pointer; font-size: 1.2em; line-height: 1; }
        .info-text { font-size: 0.85em; color: #aaa; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="error-console"></div>
    <div id="canvas-container"></div>

    <div id="chart-widget">
        <div id="chart-header">
            <span>实时数据：距离与速度</span>
            <span class="close-btn" onclick="toggleChart(false)">×</span>
        </div>
        <div id="chart-body">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div id="ui-right">
        <h3>开普勒第一定律控制台</h3>
        <div class="btn-row">
            <button class="btn btn-pause" onclick="pauseSim()">暂停</button>
            <button class="btn btn-start" onclick="startSim()">开始</button>
            <button class="btn btn-reset" onclick="resetSim()">还原</button>
        </div>
        <div class="control-group">
            <label>离心率 (Eccentricity): <span id="ecc-val">0.5</span></label>
            <input type="range" id="eccentricity" min="0" max="0.8" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>演示速度:</label>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
        </div>
        <button class="btn toggle-chart" onclick="toggleChart(true)">显示图表</button>
        <div class="info-text">
            说明：<br>
            - 鼠标左键：旋转<br>
            - 滚轮：缩放<br>
            - 椭圆轨道：太阳位于焦点
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>

    <script>
        // ================= 错误捕捉工具 =================
        function logError(msg) {
            const el = document.getElementById('error-console');
            el.style.display = 'block';
            el.innerHTML += "⚠️ " + msg + "<br>";
            console.error(msg);
        }
        window.onerror = function(message, source, lineno, colno, error) {
            logError(`全局错误: ${message}`);
        };

        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let sun, planet, orbitLine, focus2;
        let params = { a: 10, e: 0.5, speed: 1, angle: 0 };
        let isPaused = false;
        let chartInstance, frameCount = 0;

        // ================= 主程序入口 =================
        try {
            if (typeof THREE === 'undefined') throw new Error("three.min.js 未加载成功，请检查文件是否存在。");
            init();
            try { initChart(); } catch(e) { logError("Chart.js 初始化失败: " + e.message); }
            animate();
        } catch (e) {
            logError("初始化严重错误: " + e.message);
        }

        function init() {
            // 1. 场景与相机
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 30);
            camera.lookAt(0, 0, 0);

            // 2. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 3. 控制器 (OrbitControls 容错处理)
            setupControls();

            // 4. 灯光与辅助线
            scene.add(new THREE.AmbientLight(0x404040));
            const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
            scene.add(pointLight);
            scene.add(new THREE.GridHelper(50, 50, 0x333333, 0x111111));

            // 5. 物体创建
            const sunGeo = new THREE.SphereGeometry(1.5, 32, 32);
            sun = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ color: 0xffff00 }));
            scene.add(sun);

            planet = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshPhongMaterial({ color: 0x00aaff }));
            scene.add(planet);

            focus2 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x555555 }));
            scene.add(focus2);

            orbitLine = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xaaaaaa }));
            scene.add(orbitLine);

            updateOrbitShape();
            window.addEventListener('resize', onWindowResize, false);
        }

        // 尝试加载控制器，如果失败则使用简易回退方案
        function setupControls() {
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
            } else if (typeof window.OrbitControls !== 'undefined') {
                controls = new window.OrbitControls(camera, renderer.domElement);
            } else {
                logError("OrbitControls.js 加载异常(可能是版本问题)。已启用简易鼠标控制。");
                // 简易鼠标拖拽回退方案
                let isDragging = false, previousMousePosition = { x: 0, y: 0 };
                document.addEventListener('mousedown', () => isDragging = true);
                document.addEventListener('mouseup', () => isDragging = false);
                document.addEventListener('mousemove', function(e) {
                    if (isDragging) {
                        const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                        const angle = deltaMove.x * 0.01;
                        // 简单的绕Y轴旋转
                        const x = camera.position.x;
                        const z = camera.position.z;
                        camera.position.x = x * Math.cos(angle) - z * Math.sin(angle);
                        camera.position.z = x * Math.sin(angle) + z * Math.cos(angle);
                        camera.lookAt(0, 0, 0);
                    }
                    previousMousePosition = { x: e.offsetX, y: e.offsetY };
                });
            }
        }

        // ================= 物理核心逻辑 =================
        function updateOrbitShape() {
            const a = params.a;
            const e = params.e;
            const b = a * Math.sqrt(1 - e * e);
            const c = a * e;

            sun.position.set(0, 0, 0); 
            focus2.position.set(2 * c, 0, 0);

            const points = [];
            for (let i = 0; i <= 128; i++) {
                const theta = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(a * Math.cos(theta) + c, 0, b * Math.sin(theta)));
            }
            orbitLine.geometry.setFromPoints(points);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (!isPaused && planet && sun) {
                // 近似模拟速度变化：r越小，速度越快
                let r = planet.position.distanceTo(sun.position) || params.a;
                let speedFactor = (1 / (r/params.a)) * 0.01 * params.speed;
                params.angle -= speedFactor;

                const a = params.a, e = params.e;
                const b = a * Math.sqrt(1 - e * e);
                const c = a * e;

                planet.position.x = a * Math.cos(params.angle) + c;
                planet.position.z = b * Math.sin(params.angle);

                // 更新图表
                if (chartInstance) updateChart(r);
            }

            if (controls && controls.update) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        // ================= UI 与 图表逻辑 =================
        function updateChart(val) {
            frameCount++;
            if (frameCount % 5 !== 0) return; // 降频更新
            const data = chartInstance.data.datasets[0].data;
            const labels = chartInstance.data.labels;
            labels.push('');
            data.push(val);
            if (labels.length > 50) { labels.shift(); data.shift(); }
            chartInstance.update();
        }

        function initChart() {
            if (typeof Chart === 'undefined') return;
            const ctx = document.getElementById('myChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '日地距离 (r)',
                        data: [],
                        borderColor: '#00aaff',
                        backgroundColor: 'rgba(0, 170, 255, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: false },
                        y: { beginAtZero: true, suggestedMax: 15 }
                    }
                }
            });
        }

        // UI 事件绑定
        document.getElementById('eccentricity').addEventListener('input', (e) => {
            params.e = parseFloat(e.target.value);
            document.getElementById('ecc-val').innerText = params.e;
            updateOrbitShape();
            params.angle = 0; // 重置防止跳变
        });
        document.getElementById('speed').addEventListener('input', (e) => params.speed = parseFloat(e.target.value));

        function pauseSim() { isPaused = true; }
        function startSim() { isPaused = false; }
        function resetSim() {
            isPaused = true;
            params.angle = 0;
            updateOrbitShape();
            // 重置行星位置
            const a = params.a, e = params.e, c = a*e;
            planet.position.set(a + c, 0, 0); 
            if(chartInstance) {
                chartInstance.data.labels = [];
                chartInstance.data.datasets[0].data = [];
                chartInstance.update();
            }
        }
        function toggleChart(show) { document.getElementById('chart-widget').style.display = show ? 'block' : 'none'; }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 图表拖拽
        const chartW = document.getElementById('chart-widget');
        const chartH = document.getElementById('chart-header');
        let dragInfo = { active: false, x: 0, y: 0 };
        chartH.addEventListener('mousedown', (e) => {
            dragInfo = { active: true, x: e.clientX - chartW.offsetLeft, y: e.clientY - chartW.offsetTop };
            chartH.style.cursor = 'grabbing';
        });
        document.addEventListener('mousemove', (e) => {
            if (dragInfo.active) {
                chartW.style.left = (e.clientX - dragInfo.x) + 'px';
                chartW.style.top = (e.clientY - dragInfo.y) + 'px';
            }
        });
        document.addEventListener('mouseup', () => {
            dragInfo.active = false;
            chartH.style.cursor = 'move';
        });
    </script>
</body>
</html>
