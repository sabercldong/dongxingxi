<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 太阳系演示</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 右侧功能区 */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* 滚动条样式 */
        #ui-panel::-webkit-scrollbar { width: 6px; }
        #ui-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        #ui-panel::-webkit-scrollbar-thumb { background: #4a90e2; border-radius: 3px; }

        h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; text-align: center; }
        
        .control-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #357abd; }
        button.stop { background: #e74c3c; }
        button.stop:hover { background: #c0392b; }
        button.reset { background: #f39c12; }
        
        label { font-size: 12px; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; }

        /* 左上角图表区 (可拖动) */
        #chart-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 350px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            cursor: move; /* 提示可拖动 */
            transition: opacity 0.3s;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 5px;
            user-select: none;
        }
        
        .chart-title { font-weight: bold; color: #333; font-size: 14px; }
        .toggle-btn { cursor: pointer; color: #666; font-size: 12px; }

        /* 隐藏时的样式 */
        .hidden-content { display: none; }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-container">
        <div class="chart-header">
            <span class="chart-title">行星相对直径对比</span>
            <span class="toggle-btn" onclick="toggleChart()">[折叠/展开]</span>
        </div>
        <div id="chart-content">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div id="ui-panel">
        <h3>控制中心</h3>
        
        <div class="control-group">
            <label>运行状态</label>
            <button id="btn-pause-start" onclick="toggleAnimation()">暂停 / 开始</button>
            <button class="reset" onclick="resetSystem()">还原初始位置</button>
        </div>

        <div class="control-group">
            <label>公转速度 (Speed)</label>
            <input type="range" min="0" max="5" step="0.1" value="1" oninput="updateSpeed(this.value)">
        </div>

        <div class="control-group">
            <label>显示选项</label>
            <button onclick="toggleChartVisibility()">显示/隐藏 图表</button>
        </div>
        
        <div style="font-size: 11px; color: #888; margin-top: 20px;">
            操作说明：<br>
            左键：旋转视角<br>
            右键：平移视角<br>
            滚轮：缩放
        </div>
    </div>

<script>
    // ================= 全局变量 =================
    let scene, camera, renderer, controls;
    let planets = []; // 存储行星对象以便更新位置
    let orbits = [];  // 存储轨道线
    let isPaused = false;
    let speedMultiplier = 1;
    let globalTime = 0;
    
    // 行星数据 (为了视觉效果，大小和距离非真实比例，但保持了相对顺序)
    const solarData = [
        { name: "水星", color: 0xA9A9A9, size: 0.8, distance: 10, speed: 4.7 },
        { name: "金星", color: 0xFFC649, size: 1.2, distance: 15, speed: 3.5 },
        { name: "地球", color: 0x2E86C1, size: 1.3, distance: 20, speed: 3.0 },
        { name: "火星", color: 0xC0392B, size: 1.0, distance: 25, speed: 2.4 },
        { name: "木星", color: 0xD4AC0D, size: 3.5, distance: 35, speed: 1.3 },
        { name: "土星", color: 0xF5CBA7, size: 3.0, distance: 45, speed: 0.9, hasRing: true },
        { name: "天王星", color: 0x5DADE2, size: 2.0, distance: 55, speed: 0.6 },
        { name: "海王星", color: 0x2874A6, size: 1.9, distance: 65, speed: 0.5 }
    ];

    // ================= 初始化 Three.js =================
    function init() {
        // 1. 场景
        scene = new THREE.Scene();
        
        // 2. 相机
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 90);
        camera.lookAt(0, 0, 0);

        // 3. 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 控制器 (OrbitControls)
        // 注意：根据OrbitControls的版本，有时需要 THREE.OrbitControls，有时直接是 OrbitControls
        if (typeof THREE.OrbitControls === 'function') {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
        } else if (typeof OrbitControls === 'function') {
            controls = new OrbitControls(camera, renderer.domElement);
        } else {
            // 尝试兼容旧版写法，如果OrbitControls被挂载到全局
            try {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } catch(e) {
                console.error("OrbitControls 加载失败，请检查文件是否正确", e);
            }
        }
        if(controls) {
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }

        // 5. 灯光
        const ambientLight = new THREE.AmbientLight(0x404040); // 环境光
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 1.5, 300); // 太阳光点光源
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // 6. 创建物体
        createStars();
        createSun();
        createPlanets();

        // 7. 初始化图表
        initChart();

        // 8. 开始动画循环
        animate();
    }

    // 创建背景星空
    function createStars() {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        for (let i = 0; i < 3000; i++) {
            vertices.push(
                THREE.MathUtils.randFloatSpread(500),
                THREE.MathUtils.randFloatSpread(500),
                THREE.MathUtils.randFloatSpread(500)
            );
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
        const stars = new THREE.Points(geometry, material);
        scene.add(stars);
    }

    // 创建太阳
    function createSun() {
        const geometry = new THREE.SphereGeometry(5, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0xFFD700 }); // 发光效果用 BasicMaterial
        const sun = new THREE.Mesh(geometry, material);
        
        // 太阳光晕效果 (简单的透明球体)
        const glowGeo = new THREE.SphereGeometry(5.5, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ 
            color: 0xFFD700, 
            transparent: true, 
            opacity: 0.3 
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        sun.add(glow);

        scene.add(sun);
    }

    // 创建行星
    function createPlanets() {
        solarData.forEach(data => {
            // 1. 创建轨道线
            const orbitGeo = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 64);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide });
            const orbit = new THREE.Mesh(orbitGeo, orbitMat);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);

            // 2. 创建行星组 (用于旋转)
            const planetGroup = new THREE.Group();
            scene.add(planetGroup);

            // 3. 创建行星实体
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const material = new THREE.MeshLambertMaterial({ color: data.color });
            const mesh = new THREE.Mesh(geometry, material);
            
            // 初始位置
            mesh.position.x = data.distance; 
            planetGroup.add(mesh);

            // 特殊：土星环
            if (data.hasRing) {
                const ringGeo = new THREE.RingGeometry(data.size + 0.5, data.size + 2, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xAA8866, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5; // 稍微倾斜
                mesh.add(ring);
            }

            // 保存引用以便动画更新
            planets.push({
                mesh: mesh,
                group: planetGroup, // 实际旋转的是 mesh 在 group 中的位置，或者旋转 group
                distance: data.distance,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2 // 随机初始角度
            });
        });
    }

    // ================= 动画循环 =================
    function animate() {
        requestAnimationFrame(animate);

        if (!isPaused) {
            // 更新行星位置
            planets.forEach(p => {
                p.angle += (p.speed * 0.005 * speedMultiplier);
                // 使用三角函数计算圆周运动
                p.mesh.position.x = Math.cos(p.angle) * p.distance;
                p.mesh.position.z = Math.sin(p.angle) * p.distance;
                
                // 自转
                p.mesh.rotation.y += 0.02;
            });
            globalTime += 0.01;
        }

        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    // ================= UI 交互逻辑 =================
    function toggleAnimation() {
        isPaused = !isPaused;
        const btn = document.getElementById('btn-pause-start');
        btn.innerText = isPaused ? "继续" : "暂停";
        btn.style.backgroundColor = isPaused ? "#27ae60" : "#4a90e2";
    }

    function resetSystem() {
        planets.forEach(p => {
            p.angle = 0; // 重置角度
            p.mesh.position.x = p.distance;
            p.mesh.position.z = 0;
            p.mesh.rotation.y = 0;
        });
        // 重置相机
        camera.position.set(0, 60, 90);
        camera.lookAt(0,0,0);
        if(controls) controls.reset();
        
        isPaused = true; // 重置后暂停
        document.getElementById('btn-pause-start').innerText = "开始";
        document.getElementById('btn-pause-start').style.backgroundColor = "#27ae60";
    }

    function updateSpeed(val) {
        speedMultiplier = parseFloat(val);
    }

    function toggleChartVisibility() {
        const chartDiv = document.getElementById('chart-container');
        if (chartDiv.style.display === 'none') {
            chartDiv.style.display = 'block';
        } else {
            chartDiv.style.display = 'none';
        }
    }

    // 窗口大小调整适配
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ================= Chart.js 图表逻辑 =================
    function initChart() {
        // 利用 chart.min.js 生成图表
        const ctx = document.getElementById('myChart').getContext('2d');
        
        const names = solarData.map(d => d.name);
        const sizes = solarData.map(d => d.size);
        const colors = solarData.map(d => '#' + d.color.toString(16).padStart(6, '0'));

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: names,
                datasets: [{
                    label: '行星相对大小',
                    data: sizes,
                    backgroundColor: colors,
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    function toggleChart() {
        const content = document.getElementById('chart-content');
        content.classList.toggle('hidden-content');
    }

    // ================= 拖拽逻辑 (原生JS) =================
    const chartContainer = document.getElementById("chart-container");
    let isDragging = false;
    let currentX;
    let currentY;
    let initialX;
    let initialY;
    let xOffset = 0;
    let yOffset = 0;

    chartContainer.addEventListener("mousedown", dragStart);
    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("mousemove", drag);

    function dragStart(e) {
        initialX = e.clientX - xOffset;
        initialY = e.clientY - yOffset;
        if (e.target.closest('.chart-header')) { // 只允许按住标题栏拖动
            isDragging = true;
        }
    }

    function dragEnd(e) {
        initialX = currentX;
        initialY = currentY;
        isDragging = false;
    }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            xOffset = currentX;
            yOffset = currentY;
            setTranslate(currentX, currentY, chartContainer);
        }
    }

    function setTranslate(xPos, yPos, el) {
        el.style.transform = "translate3d(" + xPos + "px, " + yPos + "px, 0)";
    }

    // 启动程序
    init();

</script>
</body>
</html>
