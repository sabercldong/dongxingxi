<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岸上拉船速度分解演示</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 单屏显示，禁止滚动 */
            display: flex;
        }

        /* 左侧画布区域 */
        #canvas-container {
            flex: 3; /* 占据 75% */
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 60%, #4facfe 60%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #ccc;
        }

        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: transparent;
        }

        /* 右侧功能区域 */
        #control-panel {
            flex: 1; /* 占据 25% */
            background-color: var(--panel-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
        }

        h2 {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .data-display {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e9ecef;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .data-value {
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
        }

        #btn-start { background-color: var(--primary-color); color: white; }
        #btn-start:hover { background-color: #2980b9; }
        
        #btn-reset { background-color: var(--secondary-color); color: white; }
        #btn-reset:hover { background-color: #34495e; }

        .explanation {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #555;
        }

        .formula {
            text-align: center;
            font-size: 1.2rem;
            margin: 15px 0;
            padding: 10px;
            background: #fff3cd;
            border-radius: 5px;
            border-left: 4px solid #ffc107;
            font-weight: bold;
            color: #333;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem;}
        .dot { width: 12px; height: 12px; border-radius: 50%; }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div id="control-panel">
        <h2>物理过程分析</h2>
        
        <div class="controls">
            <button id="btn-start">开始 / 暂停</button>
            <button id="btn-reset">重置</button>
        </div>

        <div class="data-display">
            <div class="data-row">
                <span>绳与水面夹角 (θ):</span>
                <span id="val-theta" class="data-value">30.0°</span>
            </div>
            <div class="data-row">
                <span>cos(θ):</span>
                <span id="val-cos" class="data-value">0.866</span>
            </div>
            <div class="data-row">
                <span>船速 (v):</span>
                <span class="data-value">1.00 v</span>
            </div>
            <div class="data-row">
                <span>人行速度 (v_人):</span>
                <span id="val-vperson" class="data-value">0.87 v</span>
            </div>
        </div>

        <div class="explanation">
            <h3>速度分解原理：</h3>
            <p>船的实际运动是水平向左的，速度为 <strong>v</strong>。</p>
            <p>这个速度产生的效果有两个：</p>
            <ol>
                <li>沿绳子方向收缩（人拉绳的速度）。</li>
                <li>垂直于绳子方向摆动（改变角度）。</li>
            </ol>
            <div class="formula">
                v<sub>人</sub> = v<sub>绳</sub> = v · cosθ
            </div>
            <p><strong>结论：</strong> 人的行走速度是船速在绳子方向的分量。对应选项 <strong>A</strong>。</p>
            
            <div class="legend">
                <div class="legend-item"><div class="dot" style="background:red"></div> 船的合速度 v</div>
                <div class="legend-item"><div class="dot" style="background:green"></div> 沿绳分速度 (人速)</div>
                <div class="legend-item"><div class="dot" style="background:#333"></div> 垂直分速度</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // 状态变量
    let isRunning = false;
    let animationId;
    
    // 物理场景参数
    const scene = {
        cliffX: 200,      // 悬崖边缘X坐标
        cliffHeight: 200, // 悬崖高度 (相对水面)
        waterY: 0,        // 水面Y坐标 (在resize中计算)
        pulleyPos: {x: 0, y: 0},
        boatX: 600,       // 船的初始位置
        initialBoatX: 600,
        boatSpeed: 1.5,     // 船的模拟速度 (像素/帧)
        minBoatX: 250     // 船最靠近岸边的距离
    };

    // DOM 元素
    const ui = {
        theta: document.getElementById('val-theta'),
        cos: document.getElementById('val-cos'),
        vPerson: document.getElementById('val-vperson'),
        btnStart: document.getElementById('btn-start'),
        btnReset: document.getElementById('btn-reset')
    };

    // 初始化画布大小
    function resizeCanvas() {
        canvas.width = document.getElementById('canvas-container').clientWidth;
        canvas.height = document.getElementById('canvas-container').clientHeight;
        scene.waterY = canvas.height * 0.65;
        scene.pulleyPos = { x: scene.cliffX, y: scene.waterY - scene.cliffHeight };
        draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // 核心绘图函数
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制环境
        drawEnvironment();

        // 2. 计算几何关系
        const dx = scene.boatX - scene.pulleyPos.x;
        const dy = scene.waterY - scene.pulleyPos.y; // 实际上是 cliffHeight
        const dist = Math.sqrt(dx*dx + dy*dy);
        const theta = Math.atan2(dy, dx); // 弧度
        
        // 更新UI数据
        updateData(theta);

        // 3. 绘制人 (在悬崖上)
        // 绳长 dist, 假设初始绳长为 L0. 
        // 人的位置模拟：随着船靠近，绳子收短，人向左走。
        // 为了演示简单，我们在悬崖顶画个人，根据船的位置稍微移动
        const ropeShortened = Math.sqrt(scene.initialBoatX**2 + dy**2) - dist; // 简化的位移显示
        drawPerson(scene.cliffX - 50 - ropeShortened); 

        // 4. 绘制船
        drawBoat(scene.boatX, scene.waterY);

        // 5. 绘制绳子
        ctx.beginPath();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        // 船到滑轮
        ctx.moveTo(scene.boatX, scene.waterY - 10); // 船头系绳点
        ctx.lineTo(scene.pulleyPos.x, scene.pulleyPos.y);
        // 滑轮到人
        ctx.lineTo(scene.cliffX - 50 - ropeShortened, scene.pulleyPos.y);
        ctx.stroke();

        // 6. 绘制滑轮
        ctx.beginPath();
        ctx.arc(scene.pulleyPos.x, scene.pulleyPos.y, 10, 0, Math.PI*2);
        ctx.fillStyle = '#7f8c8d';
        ctx.fill();
        ctx.stroke();

        // 7. 绘制速度分解 (关键部分)
        drawVectors(scene.boatX, scene.waterY - 10, theta);
    }

    function drawEnvironment() {
        // 悬崖
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(0, scene.waterY - scene.cliffHeight, scene.cliffX, canvas.height);
        
        // 水
        ctx.fillStyle = 'rgba(79, 172, 254, 0.4)'; // 半透明水
        ctx.fillRect(scene.cliffX, scene.waterY, canvas.width, canvas.height - scene.waterY);

        // 虚线水平面 (用于标示角度)
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#666';
        ctx.moveTo(scene.boatX, scene.waterY - 10);
        ctx.lineTo(scene.boatX - 100, scene.waterY - 10);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawPerson(x) {
        const y = scene.pulleyPos.y;
        // 简单的火柴人
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y - 30, 8, 0, Math.PI*2); // 头
        ctx.moveTo(x, y - 22); // 颈
        ctx.lineTo(x, y - 5); // 躯干
        ctx.moveTo(x, y - 5); ctx.lineTo(x - 10, y + 15); // 左腿
        ctx.moveTo(x, y - 5); ctx.lineTo(x + 10, y + 15); // 右腿
        ctx.moveTo(x, y - 18); ctx.lineTo(x + 15, y - 10); // 手臂拉绳
        ctx.stroke();
    }

    function drawBoat(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // 船体
        ctx.beginPath();
        ctx.fillStyle = '#e67e22';
        ctx.moveTo(20, 0);
        ctx.quadraticCurveTo(25, 20, -10, 20);
        ctx.lineTo(-40, 20);
        ctx.quadraticCurveTo(-60, 20, -50, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // 帆
        ctx.beginPath();
        ctx.fillStyle = '#ecf0f1';
        ctx.moveTo(-20, 0);
        ctx.lineTo(-20, -40);
        ctx.quadraticCurveTo(0, -25, -20, -10);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawVectors(x, y, theta) {
        const scale = 80; // 矢量显示放大倍数
        
        // 1. 实际速度 v (水平向左，红色)
        const vx = -scale; 
        const vy = 0;
        drawArrow(x, y, x + vx, y + vy, '#e74c3c', 3, "v");

        // 2. 沿绳方向分速度 (绿色)
        // 投影长度 = |v| * cos(theta)
        const vRopeMag = scale * Math.cos(theta);
        // 绳子方向单位向量 (指向滑轮)
        const dx = scene.pulleyPos.x - x;
        const dy = scene.pulleyPos.y - y;
        const mag = Math.sqrt(dx*dx + dy*dy);
        const ux = dx/mag;
        const uy = dy/mag;

        const vRopeX = ux * vRopeMag;
        const vRopeY = uy * vRopeMag;

        drawArrow(x, y, x + vRopeX, y + vRopeY, '#2ecc71', 3, "v_rope");

        // 3. 垂直绳方向分速度 (灰色，为了构成三角形)
        ctx.beginPath();
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = '#333';
        ctx.moveTo(x + vx, y + vy); // 从 v 的箭尾
        ctx.lineTo(x + vRopeX, y + vRopeY); // 到 v_rope 的箭尾
        ctx.stroke();
        ctx.setLineDash([]);

        // 4. 标注角度 theta
        ctx.beginPath();
        ctx.arc(x, y, 30, Math.PI, Math.PI + theta); // 这里的theta是正数
        ctx.strokeStyle = '#333';
        ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.fillText("θ", x - 40, y - 10);
    }

    function drawArrow(fromX, fromY, toX, toY, color, width, label) {
        const headlen = 10;
        const angle = Math.atan2(toY - fromY, toX - fromX);
        
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = width;
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();
        
        // 箭头
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();

        // 标签
        if(label) {
            ctx.font = "bold 16px Arial";
            ctx.fillStyle = color;
            ctx.fillText(label, toX, toY - 15);
        }
    }

    function updateData(thetaRad) {
        const thetaDeg = (thetaRad * 180 / Math.PI).toFixed(1);
        const cosVal = Math.cos(thetaRad).toFixed(3);
        
        ui.theta.innerText = thetaDeg + "°";
        ui.cos.innerText = cosVal;
        ui.vPerson.innerText = cosVal + " v";
    }

    function update() {
        if (!isRunning) return;

        if (scene.boatX > scene.minBoatX) {
            scene.boatX -= scene.boatSpeed;
            draw();
            animationId = requestAnimationFrame(update);
        } else {
            isRunning = false;
        }
    }

    // 事件监听
    ui.btnStart.addEventListener('click', () => {
        if (isRunning) {
            isRunning = false;
            cancelAnimationFrame(animationId);
        } else {
            isRunning = true;
            update();
        }
    });

    ui.btnReset.addEventListener('click', () => {
        isRunning = false;
        cancelAnimationFrame(animationId);
        scene.boatX = scene.initialBoatX;
        draw();
    });

    // 初始绘制
    setTimeout(resizeCanvas, 100);

</script>
</body>
</html>
