<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>三体引力模拟系统</title>
    <style>
        /* --- 基础样式 --- */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; color: #eee; }
        
        /* 布局容器：左侧画布，右侧控制栏 */
        #container { display: flex; width: 100vw; height: 100vh; }
        
        /* 3D 画布区域 */
        #canvas-wrapper { flex-grow: 1; position: relative; overflow: hidden; background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%); }
        
        /* 右侧功能区 (带滚轮) */
        #sidebar {
            width: 300px;
            background: rgba(30, 30, 35, 0.95);
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: -5px 0 20px rgba(0,0,0,0.7);
        }

        /* 侧边栏头部 */
        .sidebar-header { padding: 20px; border-bottom: 1px solid #555; background: #222; }
        .sidebar-header h2 { margin: 0; font-size: 20px; color: #00d2ff; text-align: center; }

        /* 侧边栏滚动内容区 */
        .sidebar-content {
            flex-grow: 1;
            overflow-y: auto; /* 关键：开启垂直滚动 */
            padding: 20px;
        }
        
        /* 滚动条样式优化 */
        .sidebar-content::-webkit-scrollbar { width: 8px; }
        .sidebar-content::-webkit-scrollbar-track { background: #222; }
        .sidebar-content::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        /* 控件组样式 */
        .control-group { margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; }
        .group-title { font-size: 14px; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 4px; }
        
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        input[type=range] { width: 100%; margin: 5px 0 10px 0; cursor: pointer; accent-color: #00d2ff; }
        
        /* 按钮样式 */
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
            color: white;
        }
        .btn-start { background: #28a745; }
        .btn-pause { background: #ffc107; color: #000; }
        .btn-reset { background: #dc3545; width: 100%; }
        .btn-chart { background: #6f42c1; width: 100%; margin-top: 10px; }
        
        button:hover { opacity: 0.8; filter: brightness(1.1); }
        button:active { transform: scale(0.98); }

        /* --- 左上角浮动图表 (可拖拽) --- */
        #chart-widget {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        
        #chart-header {
            font-size: 12px; color: #aaa; margin-bottom: 8px;
            cursor: move; /* 鼠标变成移动图标 */
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 5px; border-bottom: 1px solid #333;
            user-select: none;
        }
        
        canvas#velocityChart { width: 100% !important; height: 180px !important; }
        
        .hidden { display: none !important; }
        .val-disp { color: #00d2ff; font-family: monospace; }
        
        /* 三体颜色指示 */
        .star-label { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="container">
        <div id="canvas-wrapper">
            <div id="chart-widget">
                <div id="chart-header">
                    <span>✨ 三星速度监测 (拖拽标题栏移动)</span>
                    <button style="width:20px; height:20px; padding:0; background:transparent; color:#aaa;" onclick="toggleChart()">×</button>
                </div>
                <canvas id="velocityChart"></canvas>
            </div>
        </div>

        <div id="sidebar">
            <div class="sidebar-header">
                <h2>三体模拟控制台</h2>
            </div>
            
            <div class="sidebar-content">
                <div class="control-group">
                    <div class="group-title">运行控制</div>
                    <div class="btn-row">
                        <button class="btn-start" onclick="setPlayState(true)">▶ 开始</button>
                        <button class="btn-pause" onclick="setPlayState(false)">⏸ 暂停</button>
                    </div>
                    <button class="btn-reset" onclick="resetSimulation()">↺ 重置 / 还原初始状态</button>
                    <button class="btn-chart" onclick="toggleChart()">📊 显示/隐藏 图表</button>
                </div>

                <div class="control-group">
                    <div class="group-title">物理环境</div>
                    <label>模拟速度 <span id="val-speed" class="val-disp">1.0</span></label>
                    <input type="range" id="input-speed" min="0.1" max="5.0" value="1.0" step="0.1">
                    
                    <label>引力常数 (G) <span id="val-g" class="val-disp">1.0</span></label>
                    <input type="range" id="input-g" min="0.1" max="3.0" value="1.0" step="0.1">
                </div>

                <div class="control-group">
                    <div class="group-title"><span class="star-label" style="background:#ff3333"></span>红星 (Star 1)</div>
                    <label>质量 (Mass) <span id="val-m1" class="val-disp">10</span></label>
                    <input type="range" id="input-m1" min="1" max="50" value="10" step="1" onchange="needReset()">
                </div>

                <div class="control-group">
                    <div class="group-title"><span class="star-label" style="background:#3388ff"></span>蓝星 (Star 2)</div>
                    <label>质量 (Mass) <span id="val-m2" class="val-disp">10</span></label>
                    <input type="range" id="input-m2" min="1" max="50" value="10" step="1" onchange="needReset()">
                </div>

                <div class="control-group">
                    <div class="group-title"><span class="star-label" style="background:#ffff33"></span>黄星 (Star 3)</div>
                    <label>质量 (Mass) <span id="val-m3" class="val-disp">10</span></label>
                    <input type="range" id="input-m3" min="1" max="50" value="10" step="1" onchange="needReset()">
                </div>
                
                <div style="font-size:12px; color:#666; margin-top:20px;">
                    <p>💡 提示：<br>1. 左键旋转，右键平移，滚轮缩放。<br>2. 修改质量后建议点击“重置”以应用新轨道。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let stars = []; // 存储三个恒星对象
        let isPaused = true;
        let simSpeed = 1.0;
        let G_CONST = 1.0;
        let frameCount = 0;
        let trails = []; // 轨迹线

        // 图表相关
        let velocityChart;
        let chartData1 = [], chartData2 = [], chartData3 = [];
        const maxChartPoints = 60;

        // UI 元素引用
        const container = document.getElementById('canvas-wrapper');

        // ================= 初始化 Three.js 场景 =================
        function initScene() {
            scene = new THREE.Scene();
            // 添加星空粒子背景效果（简单版）
            scene.background = new THREE.Color(0x050508);
            
            // 相机
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(0, 60, 100);
            camera.lookAt(0, 0, 0);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 轨道控制器 (兼容处理：因为不同版本的 OrbitControls 挂载位置不同)
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, renderer.domElement);
            } else {
                alert("未检测到 OrbitControls，请检查文件名是否正确。");
            }
            if(controls) {
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 2); 
            scene.add(ambientLight);
        }

        // ================= 恒星类 =================
        class Star {
            constructor(color, mass, pos, vel, name) {
                this.mass = mass;
                this.position = pos.clone();
                this.velocity = vel.clone();
                this.color = color;
                
                // 3D 实体
                const geometry = new THREE.SphereGeometry(Math.pow(mass, 0.4), 32, 32); // 质量越大半径越大
                const material = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: color, 
                    emissiveIntensity: 0.8,
                    roughness: 0.2
                });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                
                // 点光源 (让恒星发光)
                const light = new THREE.PointLight(color, 2, 100);
                light.decay = 2;
                this.mesh.add(light);
                
                scene.add(this.mesh);

                // 轨迹
                this.trailPoints = [];
                const trailGeo = new THREE.BufferGeometry();
                const trailMat = new THREE.LineBasicMaterial({ color: color });
                this.trailLine = new THREE.Line(trailGeo, trailMat);
                scene.add(this.trailLine);
            }

            updatePos(dt) {
                this.mesh.position.copy(this.position);
                
                // 只有非暂停时记录轨迹
                if (!isPaused && frameCount % 2 === 0) {
                    this.trailPoints.push(this.position.clone());
                    if (this.trailPoints.length > 300) this.trailPoints.shift(); // 限制轨迹长度
                    this.trailLine.geometry.setFromPoints(this.trailPoints);
                }
            }

            clearTrail() {
                this.trailPoints = [];
                this.trailLine.geometry.setFromPoints([]);
            }
        }

        // ================= 物理模拟核心 =================
        function initStars() {
            // 清理旧物体
            stars.forEach(s => {
                scene.remove(s.mesh);
                scene.remove(s.trailLine);
            });
            stars = [];

            // 获取 UI 参数
            const m1 = parseFloat(document.getElementById('input-m1').value);
            const m2 = parseFloat(document.getElementById('input-m2').value);
            const m3 = parseFloat(document.getElementById('input-m3').value);
            G_CONST = parseFloat(document.getElementById('input-g').value);

            // 初始布局：拉格朗日等边三角形布局 (较稳定) 或者 随机位置 (更混沌)
            // 这里使用一个稍微不稳定的等边三角形配置，加上初速度，容易产生混沌
            const r = 30;
            
            // 星体 1
            const p1 = new THREE.Vector3(r, 0, 0);
            const v1 = new THREE.Vector3(0, 0, 0.6); // Z轴初速度

            // 星体 2 (旋转 120度)
            const p2 = new THREE.Vector3(r * Math.cos(2*Math.PI/3), 0, r * Math.sin(2*Math.PI/3));
            const v2 = new THREE.Vector3(-0.6 * Math.sin(2*Math.PI/3), 0, 0.6 * Math.cos(2*Math.PI/3));

            // 星体 3 (旋转 240度)
            const p3 = new THREE.Vector3(r * Math.cos(4*Math.PI/3), 0, r * Math.sin(4*Math.PI/3));
            const v3 = new THREE.Vector3(-0.6 * Math.sin(4*Math.PI/3), 0, 0.6 * Math.cos(4*Math.PI/3));

            stars.push(new Star(0xff3333, m1, p1, v1, "Red"));
            stars.push(new Star(0x3388ff, m2, p2, v2, "Blue"));
            stars.push(new Star(0xffff33, m3, p3, v3, "Yellow"));

            // 重置图表数据
            chartData1 = new Array(maxChartPoints).fill(null);
            chartData2 = new Array(maxChartPoints).fill(null);
            chartData3 = new Array(maxChartPoints).fill(null);
            if(velocityChart) {
                velocityChart.data.datasets[0].data = chartData1;
                velocityChart.data.datasets[1].data = chartData2;
                velocityChart.data.datasets[2].data = chartData3;
                velocityChart.update();
            }
        }

        function calculatePhysics() {
            const dt = 0.1 * simSpeed;

            // 计算力
            let forces = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];

            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const s1 = stars[i];
                    const s2 = stars[j];

                    const distVec = new THREE.Vector3().subVectors(s2.position, s1.position);
                    const dist = distVec.length();
                    
                    if (dist < 1) continue; // 防止碰撞奇点

                    // F = G * m1 * m2 / r^2
                    const fVal = (G_CONST * s1.mass * s2.mass) / (dist * dist);
                    const fDir = distVec.normalize();

                    const force = fDir.multiplyScalar(fVal);

                    forces[i].add(force);
                    forces[j].sub(force); // 反作用力
                }
            }

            // 更新速度和位置 (半隐式欧拉法)
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                // a = F / m
                const acc = forces[i].divideScalar(s.mass);
                
                s.velocity.add(acc.multiplyScalar(dt));
                s.position.add(s.velocity.clone().multiplyScalar(dt));
                
                s.updatePos();
            }

            // 更新图表 (每5帧一次)
            if (frameCount % 5 === 0 && velocityChart) {
                updateChart();
            }
            frameCount++;
        }

        // ================= 图表逻辑 =================
        function initChart() {
            const ctx = document.getElementById('velocityChart').getContext('2d');
            
            // 初始化空数据
            const labels = new Array(maxChartPoints).fill('');

            velocityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '红星速度', borderColor: '#ff3333', data: [], borderWidth: 1, pointRadius: 0 },
                        { label: '蓝星速度', borderColor: '#3388ff', data: [], borderWidth: 1, pointRadius: 0 },
                        { label: '黄星速度', borderColor: '#ffff33', data: [], borderWidth: 1, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: { display: true, grid: { color: '#333' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', boxWidth: 10 } } }
                }
            });
        }

        function updateChart() {
            if (!velocityChart) return;

            // 记录标量速度
            chartData1.push(stars[0].velocity.length());
            chartData2.push(stars[1].velocity.length());
            chartData3.push(stars[2].velocity.length());

            if (chartData1.length > maxChartPoints) {
                chartData1.shift();
                chartData2.shift();
                chartData3.shift();
            }

            velocityChart.data.datasets[0].data = chartData1;
            velocityChart.data.datasets[1].data = chartData2;
            velocityChart.data.datasets[2].data = chartData3;
            velocityChart.update();
        }

        // ================= 拖拽逻辑 (图表) =================
        const dragItem = document.getElementById("chart-widget");
        const dragHeader = document.getElementById("chart-header");
        let active = false;
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        dragHeader.addEventListener("mousedown", dragStart, false);
        window.addEventListener("mouseup", dragEnd, false);
        window.addEventListener("mousemove", drag, false);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === dragHeader || e.target.parentNode === dragHeader) {
                active = true;
            }
        }
        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            active = false;
        }
        function drag(e) {
            if (active) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                dragItem.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        // ================= UI 交互 =================
        function setPlayState(state) { isPaused = !state; }
        
        function resetSimulation() {
            isPaused = true;
            frameCount = 0;
            initStars(); // 重新生成星体
            
            // 重置相机视角
            controls.reset();
            camera.position.set(0, 60, 100);
            camera.lookAt(0,0,0);
        }
        
        function toggleChart() {
            const el = document.getElementById('chart-widget');
            if (el.style.display === 'none') el.style.display = 'flex';
            else el.style.display = 'none';
        }

        function needReset() {
            // 当用户拖动质量条时，可以提示或者直接生效，这里不做处理，只更新数值显示
        }

        // 监听滑块数值显示
        ['input-speed', 'input-g', 'input-m1', 'input-m2', 'input-m3'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const valId = 'val-' + id.split('-')[1];
                document.getElementById(valId).innerText = e.target.value;
                
                if (id === 'input-speed') simSpeed = parseFloat(e.target.value);
                if (id === 'input-g') G_CONST = parseFloat(e.target.value);
            });
        });

        // 窗口 Resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ================= 主循环 =================
        function animate() {
            requestAnimationFrame(animate);
            
            if (!isPaused) {
                calculatePhysics();
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // 启动程序
        initScene();
        initChart();
        initStars();
        animate();

    </script>
</body>
</html>
