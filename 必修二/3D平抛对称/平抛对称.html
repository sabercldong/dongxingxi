<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>钢管小球运动演示 - 物理习题模拟</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background-color: #1a1a1a; }
        
        /* 布局容器 */
        #container { width: 100vw; height: 100vh; display: block; }
        
        /* 右侧功能区 */
        #gui-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px; /* 稍微加宽以容纳文字 */
            height: 100%;
            background: rgba(30, 30, 30, 0.95);
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid #555;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        /* 题干区域样式 */
        .problem-text {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-left: 4px solid #4CAF50;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 10px;
            text-align: justify;
        }
        .problem-text h4 { margin: 0 0 8px 0; color: #fff; font-size: 15px; }

        /* 控件样式 */
        .control-group { margin-bottom: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4CAF50; }
        
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.pause { background-color: #ff9800; }
        button.reset { background-color: #f44336; }
        button.chart-btn { background-color: #2196F3; margin-top: 5px;}
        
        .value-display { float: right; color: #4CAF50; font-family: monospace; }
        
        .data-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }
        .data-item { background: #222; padding: 8px; border-radius: 4px; text-align: center; }
        .data-item span { display: block; font-size: 16px; color: #4CAF50; font-weight: bold; margin-top: 4px; }

        /* 左上角图表容器 */
        #chart-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            height: 260px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: move;
            z-index: 100;
            transition: opacity 0.3s;
        }
        
        .hidden { display: none !important; }
        
        #chart-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
            margin-bottom: 5px;
            font-size: 12px;
            color: #333;
            font-weight: bold;
            user-select: none;
        }
        #close-chart { cursor: pointer; color: #999; }
        #close-chart:hover { color: red; }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #222; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>

    <div id="container"></div>

    <div id="chart-container">
        <div id="chart-header">
            <span>📊 竖直高度 vs 时间 (Height-Time)</span>
            <span id="close-chart">× 关闭</span>
        </div>
        <canvas id="physicsChart"></canvas>
    </div>

    <div id="gui-panel">
        
        <div class="problem-text">
            <h4>📝 习题描述</h4>
            从一根内壁光滑的空心竖直钢管 A 的上端边缘，沿直径方向向管内水平抛入一钢球。球与管壁多次相碰后落地（球与管壁相碰时间不计）。若换一根等高但较细的内壁光滑的钢管 B，用同样的方法抛入此钢球，则运动时间（ ）。
            <div style="margin-top:8px; color:#aaa; font-style:italic; font-size:12px;">
                * 提示：点击“开始”观察不同半径下的运动时间图表。
            </div>
        </div>

        <h3 style="margin: 10px 0 5px 0; border-bottom:1px solid #555; padding-bottom:5px;">操作台</h3>
        
        <div class="control-group">
            <button id="btn-start">▶ 开始 (Start)</button>
            <div style="display: flex; gap: 5px;">
                <button id="btn-pause" class="pause">⏸ 暂停</button>
                <button id="btn-reset" class="reset">↺ 还原</button>
            </div>
        </div>

        <div class="control-group">
            <label>🏗️ 钢管半径 (Radius) <span id="val-radius" class="value-display">4.0</span></label>
            <input type="range" id="input-radius" min="1.5" max="6.0" step="0.1" value="4.0">
        </div>

        <div class="control-group">
            <label>🚀 水平初速度 (Vx) <span id="val-speed" class="value-display">5.0</span></label>
            <input type="range" id="input-speed" min="1.0" max="10.0" step="0.5" value="5.0">
        </div>

        <div class="control-group">
            <div class="data-panel">
                <div class="data-item">时间 (Time)<span id="info-time">0.00 s</span></div>
                <div class="data-item">高度 (Height)<span id="info-height">20.00 m</span></div>
                <div class="data-item" style="grid-column: span 2;">碰撞次数: <span id="info-collisions" style="display:inline;">0</span></div>
            </div>
        </div>

        <button id="btn-toggle-chart" class="chart-btn">📉 显示/隐藏图表</button>

    </div>

    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./chart.min.js"></script>

    <script>
        // --- 1. 初始化 Three.js 场景 ---
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // 更深色的背景
        
        // 相机
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 45); // 稍微拉远一点

        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // 增强环境光
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 控制器
        let controls;
        try {
            if (THREE.OrbitControls) controls = new THREE.OrbitControls(camera, renderer.domElement);
            else if (window.OrbitControls) controls = new window.OrbitControls(camera, renderer.domElement);
        } catch(e) { console.warn("Controls loading...", e); }
        if(controls) controls.enableDamping = true;

        // --- 2. 创建物体对象 ---
        
        // 地面
        const planeGeo = new THREE.PlaneGeometry(60, 60);
        const planeMat = new THREE.MeshPhongMaterial({ color: 0x222222, depthWrite: false });
        const ground = new THREE.Mesh(planeGeo, planeMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        const gridHelper = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
        scene.add(gridHelper);

        // 钢管变量
        let pipeMesh, pipeWireframe, pipeTopRing, pipeBottomRing;
        const PIPE_HEIGHT = 20;
        
        function createPipe(radius) {
            // 清理旧模型
            if(pipeMesh) scene.remove(pipeMesh);
            if(pipeWireframe) scene.remove(pipeWireframe);
            if(pipeTopRing) scene.remove(pipeTopRing);
            if(pipeBottomRing) scene.remove(pipeBottomRing);

            // 1. 透明管壁 (极高透明度)
            const geometry = new THREE.CylinderGeometry(radius, radius, PIPE_HEIGHT, 64, 1, true);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xffffff,        // 白色基底
                transparent: true, 
                opacity: 0.1,           // **非常透明**
                side: THREE.DoubleSide,
                depthWrite: false,      // 不写入深度，防止遮挡内部物体
                shininess: 80
            });
            pipeMesh = new THREE.Mesh(geometry, material);
            pipeMesh.position.y = PIPE_HEIGHT / 2;
            scene.add(pipeMesh);

            // 2. 边缘线框 (保留轮廓，否则太透明看不见)
            const wireGeo = new THREE.EdgesGeometry(geometry); // 提取边缘
            // 只保留上下圆环和几条垂线比较难，这里直接用EdgesGeometry会显示很多竖线
            // 我们改用手动创建两个圆环来表示管口，视觉更清爽
            
            // 顶部圆环
            const ringGeo = new THREE.TorusGeometry(radius, 0.05, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
            
            pipeTopRing = new THREE.Mesh(ringGeo, ringMat);
            pipeTopRing.rotation.x = Math.PI / 2;
            pipeTopRing.position.y = PIPE_HEIGHT;
            scene.add(pipeTopRing);

            // 底部圆环
            pipeBottomRing = new THREE.Mesh(ringGeo, ringMat);
            pipeBottomRing.rotation.x = Math.PI / 2;
            pipeBottomRing.position.y = 0;
            scene.add(pipeBottomRing);

            // 添加几条竖直辅助线 (4条)
            // 这是一个视觉技巧，让管子看起来有体积但又不遮挡
            // 这里为了简化代码，直接使用原来的 EdgesGeometry 但降低透明度
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            pipeWireframe = new THREE.LineSegments(wireGeo, wireMat);
            pipeWireframe.position.y = PIPE_HEIGHT / 2;
            scene.add(pipeWireframe);
        }

        // 小球
        const BALL_RADIUS = 0.4;
        const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
        const ballMat = new THREE.MeshPhongMaterial({ color: 0xff3333, emissive: 0x440000 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        // 轨迹线
        const MAX_TRAIL_POINTS = 800;
        const trailGeometry = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(MAX_TRAIL_POINTS * 3);
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 });
        const trailLine = new THREE.Line(trailGeometry, trailMaterial);
        trailLine.frustumCulled = false;
        scene.add(trailLine);
        let trailCount = 0;

        // --- 3. 物理逻辑 ---
        
        let physics = {
            running: false,
            paused: false,
            time: 0,
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            collisions: 0,
            pipeRadius: 4.0,
            gravity: -9.8,
            step: 1/120 // 提高物理精度
        };

        function resetSim() {
            physics.running = false;
            physics.paused = false;
            physics.time = 0;
            physics.collisions = 0;
            
            // 初始状态：球在左边缘，向右抛
            const startX = -(physics.pipeRadius - BALL_RADIUS - 0.05);
            physics.pos.set(startX, PIPE_HEIGHT, 0);
            
            const speedX = parseFloat(document.getElementById('input-speed').value);
            physics.vel.set(speedX, 0, 0);

            ball.position.copy(physics.pos);
            
            // 重置轨迹
            trailCount = 0;
            trailLine.geometry.setDrawRange(0, 0);
            
            // 重置图表
            resetChart();
            updateGUI();
        }

        function stepPhysics() {
            if (!physics.running || physics.paused) return;

            const dt = physics.step;
            
            // 1. 速度更新
            physics.vel.y += physics.gravity * dt;

            // 2. 位置更新
            physics.pos.addScaledVector(physics.vel, dt);
            physics.time += dt;

            // 3. 碰撞检测 (简化为XZ平面距离)
            const distXZ = Math.sqrt(physics.pos.x**2 + physics.pos.z**2);
            const boundary = physics.pipeRadius - BALL_RADIUS;

            if (distXZ >= boundary) {
                // 碰撞发生
                // 计算法线 (指向圆心)
                const normal = new THREE.Vector3(physics.pos.x, 0, physics.pos.z).normalize().negate();
                
                // 简单的反弹逻辑 (假设完全弹性)
                // 分解速度：V = V_normal + V_tangent
                // V_new = -V_normal + V_tangent
                const vHoriz = new THREE.Vector3(physics.vel.x, 0, physics.vel.z);
                const vDotN = vHoriz.dot(normal);
                
                // 只有当速度方向背离圆心时才反弹(防止穿模时的抖动)
                if (vDotN < 0) {
                    physics.collisions++;
                    
                    // 反射公式 R = V - 2(V.N)N
                    const reflect = vHoriz.sub(normal.multiplyScalar(2 * vDotN));
                    physics.vel.x = reflect.x;
                    physics.vel.z = reflect.z;
                    
                    // 简单的位置修正 (推回管内)
                    const correction = normal.clone().multiplyScalar(0.01);
                    // 重新计算位置使其刚好在边界内
                    const angle = Math.atan2(physics.pos.z, physics.pos.x);
                    physics.pos.x = Math.cos(angle) * (boundary - 0.001);
                    physics.pos.z = Math.sin(angle) * (boundary - 0.001);
                }
            }

            // 4. 落地检测
            if (physics.pos.y <= BALL_RADIUS) {
                physics.pos.y = BALL_RADIUS;
                physics.running = false;
            }

            // 更新视图
            ball.position.copy(physics.pos);
            
            // 轨迹记录
            if (trailCount < MAX_TRAIL_POINTS) {
                const arr = trailLine.geometry.attributes.position.array;
                arr[trailCount*3] = physics.pos.x;
                arr[trailCount*3+1] = physics.pos.y;
                arr[trailCount*3+2] = physics.pos.z;
                trailCount++;
                trailLine.geometry.setDrawRange(0, trailCount);
                trailLine.geometry.attributes.position.needsUpdate = true;
            }

            updateChart(physics.time, physics.pos.y);
            updateGUI();
        }

        function updateGUI() {
            // 使用 textContent 减少重绘开销
            document.getElementById('info-time').textContent = physics.time.toFixed(2) + " s";
            document.getElementById('info-height').textContent = Math.max(0, physics.pos.y - BALL_RADIUS).toFixed(2) + " m";
            document.getElementById('info-collisions').textContent = physics.collisions;
        }

        // --- 4. 图表逻辑 ---
        let chartInstance;
        function initChart() {
            const ctx = document.getElementById('physicsChart').getContext('2d');
            if(!window.Chart) return;

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '高度 (m)',
                        data: [],
                        borderColor: '#4CAF50',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1 // 稍微平滑
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { type: 'linear', position: 'bottom', title: {display:true, text:'时间 (s)'}, min: 0, max: 2.2 },
                        y: { min: 0, max: 21, title: {display:true, text:'高度 (m)'} }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        let lastChartUpdate = 0;
        function updateChart(t, h) {
            if(!chartInstance) return;
            // 节流：每0.1秒更新一次图表即可，人眼看不出区别，但节省性能
            if (t - lastChartUpdate > 0.05) {
                chartInstance.data.datasets[0].data.push({x: t, y: h});
                chartInstance.update('none'); // 'none' mode ignores animation
                lastChartUpdate = t;
            }
        }

        function resetChart() {
            if(!chartInstance) return;
            chartInstance.data.datasets[0].data = [];
            chartInstance.update();
            lastChartUpdate = 0;
        }

        // --- 5. 交互绑定 ---
        document.getElementById('btn-start').onclick = () => {
            if(!physics.running && physics.pos.y > PIPE_HEIGHT - 1) resetSim();
            physics.running = true;
            physics.paused = false;
        };
        document.getElementById('btn-pause').onclick = () => physics.paused = true;
        document.getElementById('btn-reset').onclick = resetSim;

        document.getElementById('input-radius').oninput = function() {
            const r = parseFloat(this.value);
            document.getElementById('val-radius').textContent = r.toFixed(1);
            physics.pipeRadius = r;
            createPipe(r);
            if(!physics.running) resetSim();
        };

        document.getElementById('input-speed').oninput = function() {
            const v = parseFloat(this.value);
            document.getElementById('val-speed').textContent = v.toFixed(1);
            if(!physics.running) resetSim();
        };

        // 图表拖拽
        const dragEl = document.getElementById("chart-container");
        let isDragging = false, startX, startY, initialLeft, initialTop;
        const header = document.getElementById('chart-header');

        header.onmousedown = (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = dragEl.offsetLeft;
            initialTop = dragEl.offsetTop;
            dragEl.style.cursor = 'grabbing';
        };

        window.onmousemove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            dragEl.style.left = (initialLeft + dx) + "px";
            dragEl.style.top = (initialTop + dy) + "px";
        };

        window.onmouseup = () => {
            isDragging = false;
            if(dragEl) dragEl.style.cursor = 'move';
        };

        document.getElementById('btn-toggle-chart').onclick = () => dragEl.classList.toggle('hidden');
        document.getElementById('close-chart').onclick = () => dragEl.classList.add('hidden');

        // --- 6. 循环 ---
        function animate() {
            requestAnimationFrame(animate);
            // 物理步进 (多次迭代以保证高速碰撞稳定性)
            for(let i=0; i<2; i++) stepPhysics();
            if(controls) controls.update();
            renderer.render(scene, camera);
        }

        // 启动
        createPipe(4.0);
        initChart();
        resetSim();
        animate();

        // 窗口自适应
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

    </script>
</body>
</html>
