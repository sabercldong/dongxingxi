<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>单雨滴离心平抛运动演示（修正方向版）</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* 1. 主画布 */
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* 2. 右侧控制面板 */
        #ui-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 240px;
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            color: #eee;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h3 { margin: 0 0 10px 0; color: #4facfe; font-size: 16px; border-bottom: 1px solid #555; padding-bottom: 8px; }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        
        /* 按钮组 */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.2s;
            font-size: 12px;
        }
        .btn-launch { grid-column: span 2; background: #2196F3; font-size: 14px; padding: 10px; }
        .btn-launch:hover { background: #1976D2; }
        .btn-launch:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }

        .btn-pause { background: #FF9800; }
        .btn-reset { background: #f44336; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 滑块 */
        input[type=range] { width: 100%; cursor: pointer; }

        /* 3. 左上角图表 */
        #chart-wrapper {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 320px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #555;
            border-radius: 8px;
            z-index: 100;
        }
        #chart-header {
            padding: 8px 12px;
            background: #252525;
            cursor: move;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            justify-content: space-between;
            color: #ddd;
            font-size: 12px;
            user-select: none;
        }
        #chart-content { padding: 10px; background: #fff; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
        .toggle-text { cursor: pointer; color: #888; }
        .toggle-text:hover { color: #fff; }

        /* 状态指示 */
        #status-display {
            font-size: 12px;
            color: #00ff88;
            text-align: center;
            margin-top: 5px;
            min-height: 1.5em;
        }
    </style>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-wrapper">
        <div id="chart-header">
            <span>📊 速度与高度分析</span>
            <span class="toggle-text" onclick="toggleChart()">[收起]</span>
        </div>
        <div id="chart-content">
            <canvas id="motionChart"></canvas>
        </div>
    </div>

    <div id="ui-panel">
        <h3>实验控制台</h3>
        
        <div class="control-group">
            <button class="btn-launch" id="launchBtn" onclick="launchDrop()">🚀 发射雨滴 (Launch)</button>
            <div class="btn-grid">
                <button class="btn-pause" onclick="togglePause()" id="pauseBtn">暂停</button>
                <button class="btn-reset" onclick="resetExperiment()">↺ 还原</button>
            </div>
        </div>

        <div id="status-display">状态: 准备就绪</div>

        <hr style="border: 0; border-top: 1px solid #555; width: 100%;">

        <div class="control-group">
            <label>伞旋转速度 (ω) <span id="speedVal">2.0</span> rad/s</label>
            <input type="range" id="speedRange" min="0" max="10" step="0.1" value="2.0" oninput="updateSpeedUI()">
        </div>

        <div class="control-group">
            <label style="color:#aaa; font-style:italic;">
                说明：<br>点击"发射"后，雨滴将沿切线方向做平抛运动。
            </label>
        </div>
    </div>

<script>
    // --- 变量定义 ---
    let scene, camera, renderer, controls;
    let umbrellaGroup, dropMesh, trailLine;
    let chartInstance;
    
    // 状态机变量
    let isPaused = false;
    let hasLaunched = false; 
    let simulationTime = 0;
    
    // 物理参数
    const R = 4.5; // 伞半径
    const GRAVITY = 9.8; // 重力加速度
    let angularSpeed = 2.0; // 初始角速度
    let dropVelocity = new THREE.Vector3(); // 雨滴速度矢量
    let initialAngle = 0; // 雨滴在伞上的初始角度

    // 轨迹数据
    let trailPoints = [];

    // --- 初始化 ---
    function init() {
        // 1. 场景
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        
        // 网格地面
        const grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        grid.position.y = -5; // 地面位置
        scene.add(grid);

        // 2. 相机
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 5, 15);

        // 3. 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 控制器
        if (typeof THREE.OrbitControls === 'function') {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
        } else if (typeof OrbitControls === 'function') {
            controls = new OrbitControls(camera, renderer.domElement);
        }
        controls.enableDamping = true;

        // 5. 灯光
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(5, 10, 5);
        scene.add(light);

        // 6. 创建物体
        createUmbrella();
        createDrop();
        initChart();
        initDrag(document.getElementById('chart-wrapper'), document.getElementById('chart-header'));

        // 7. 循环
        animate();
        
        window.addEventListener('resize', onResize);
    }

    function createUmbrella() {
        umbrellaGroup = new THREE.Group();
        
        // 伞面 (Cone)
        const geometry = new THREE.ConeGeometry(R, 1.5, 32, 1, true);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x2196F3, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.8
        });
        const cone = new THREE.Mesh(geometry, material);
        cone.position.y = 0.75; 
        umbrellaGroup.add(cone);
        
        // 伞骨
        const wireframe = new THREE.LineSegments(
            new THREE.WireframeGeometry(geometry),
            new THREE.LineBasicMaterial({ color: 0x88ccff, transparent:true, opacity:0.3 })
        );
        wireframe.position.y = 0.75;
        umbrellaGroup.add(wireframe);

        // 伞柄
        const stick = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 6),
            new THREE.MeshPhongMaterial({ color: 0x888 })
        );
        stick.position.y = -1.5;
        umbrellaGroup.add(stick);

        scene.add(umbrellaGroup);
    }

    function createDrop() {
        // 雨滴
        dropMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        scene.add(dropMesh);

        // 轨迹线
        const geom = new THREE.BufferGeometry();
        const mat = new THREE.LineBasicMaterial({ color: 0x00ffff });
        trailLine = new THREE.Line(geom, mat);
        trailLine.frustumCulled = false; 
        scene.add(trailLine);

        resetExperiment(); 
    }

    // --- 核心物理修正 ---

    function launchDrop() {
        if (hasLaunched) return;
        
        hasLaunched = true;
        document.getElementById('launchBtn').disabled = true;
        document.getElementById('speedRange').disabled = true;
        document.getElementById('status-display').innerText = "状态: 飞行中 (平抛运动)";
        document.getElementById('status-display').style.color = "#FF9800";

        // 1. 获取位置
        // 当前雨滴位置 dropMesh.position.x, dropMesh.position.z
        const x = dropMesh.position.x;
        const z = dropMesh.position.z;

        // 2. 计算切线方向 (修正方向)
        // 伞是顺时针旋转 (rotation.y -= speed)
        // 顺时针切线方向向量为: (z, 0, -x)
        // 之前的错误方向是 (-z, 0, x) 属于逆时针
        const tangentDir = new THREE.Vector3(z, 0, -x).normalize();

        // 3. 计算切向线速度 v = ω * r
        const v_tangent_mag = angularSpeed * R;
        
        dropVelocity.copy(tangentDir).multiplyScalar(v_tangent_mag);
        
        // 4. 添加"斜抛"分量
        // 伞面有坡度，水滴飞出时其实会带一点点向上的分速度(因为圆锥边缘切线是斜向下的，但水珠飞离点通常视为沿切面滑出)
        // 为了演示效果，我们给一个微小的垂直初速度，构成斜抛
        dropVelocity.y = 1.0; 
        
        // 如果想要水平抛出(平抛)，注释掉上面那行即可
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (isPaused) {
            renderer.render(scene, camera);
            return;
        }

        const dt = 0.016; 

        // 1. 伞的旋转 (顺时针)
        if (!hasLaunched) {
            angularSpeed = parseFloat(document.getElementById('speedRange').value);
        }
        umbrellaGroup.rotation.y -= angularSpeed * dt;

        // 2. 雨滴逻辑
        if (!hasLaunched) {
            // 跟随伞顺时针旋转
            initialAngle -= angularSpeed * dt; 
            
            dropMesh.position.set(
                Math.cos(initialAngle) * R,
                0, 
                Math.sin(initialAngle) * R
            );
        } else {
            // 飞行阶段 (斜抛)
            // v_y 减小 (受重力)
            dropVelocity.y -= GRAVITY * dt; 
            
            // 位置更新
            dropMesh.position.add(dropVelocity.clone().multiplyScalar(dt));

            // 轨迹
            if (simulationTime % 2 === 0) {
                 updateTrail();
                 updateChartData();
            }
            simulationTime++;

            // 落地检测
            if (dropMesh.position.y <= -5) {
                dropMesh.position.y = -5;
                dropVelocity.set(0,0,0);
                document.getElementById('status-display').innerText = "状态: 已落地";
                document.getElementById('status-display').style.color = "#aaa";
            }
        }

        renderer.render(scene, camera);
    }

    function updateTrail() {
        trailPoints.push(dropMesh.position.x, dropMesh.position.y, dropMesh.position.z);
        const vertices = new Float32Array(trailPoints);
        trailLine.geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        trailLine.geometry.attributes.position.needsUpdate = true;
    }

    // --- UI 交互 ---
    function resetExperiment() {
        hasLaunched = false;
        isPaused = false;
        simulationTime = 0;
        
        document.getElementById('launchBtn').disabled = false;
        document.getElementById('speedRange').disabled = false;
        document.getElementById('pauseBtn').innerText = "暂停";
        document.getElementById('status-display').innerText = "状态: 准备就绪";
        document.getElementById('status-display').style.color = "#00ff88";

        initialAngle = 0;
        dropVelocity.set(0, 0, 0);
        
        trailPoints = [];
        trailLine.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([]), 3));

        if(chartInstance) {
            chartInstance.data.labels = [];
            chartInstance.data.datasets[0].data = [];
            chartInstance.data.datasets[1].data = [];
            chartInstance.update();
        }
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "继续" : "暂停";
    }

    function updateSpeedUI() {
        document.getElementById('speedVal').innerText = document.getElementById('speedRange').value;
    }

    // --- 图表 ---
    function initChart() {
        const ctx = document.getElementById('motionChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '高度 (Y)',
                        borderColor: '#00ffff',
                        data: [],
                        yAxisID: 'y',
                        borderWidth: 1,
                        pointRadius: 0
                    },
                    {
                        label: '合速度 (m/s)',
                        borderColor: '#ff9800',
                        data: [],
                        yAxisID: 'y1',
                        borderWidth: 1,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                animation: false,
                scales: {
                    x: { display: false },
                    y: { 
                        type: 'linear', display: true, position: 'left',
                        title: {display: true, text: '高度', color:'#aaa'},
                        grid: { color: '#333' }
                    },
                    y1: { 
                        type: 'linear', display: true, position: 'right',
                        title: {display: true, text: '速度', color:'#aaa'},
                        grid: { drawOnChartArea: false } 
                    }
                },
                plugins: { legend: { labels: { color: '#ddd' } } }
            }
        });
    }

    function updateChartData() {
        if (!hasLaunched || isPaused || dropMesh.position.y <= -5) return;

        const currentSpeed = dropVelocity.length();
        const currentHeight = dropMesh.position.y + 5; 

        chartInstance.data.labels.push('');
        chartInstance.data.datasets[0].data.push(currentHeight);
        chartInstance.data.datasets[1].data.push(currentSpeed);

        if(chartInstance.data.labels.length > 100) {
            chartInstance.data.labels.shift();
            chartInstance.data.datasets[0].data.shift();
            chartInstance.data.datasets[1].data.shift();
        }
        chartInstance.update();
    }

    function toggleChart() {
        const c = document.getElementById('chart-content');
        const btn = document.querySelector('.toggle-text');
        if (c.style.display === 'none') {
            c.style.display = 'block';
            btn.innerText = '[收起]';
        } else {
            c.style.display = 'none';
            btn.innerText = '[展开]';
        }
    }

    // --- 拖拽 ---
    function initDrag(wrapper, handler) {
        let isDragging = false;
        let startX, startY, startLeft, startTop;

        handler.addEventListener('mousedown', e => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = wrapper.offsetLeft;
            startTop = wrapper.offsetTop;
            handler.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            wrapper.style.left = startLeft + (e.clientX - startX) + 'px';
            wrapper.style.top = startTop + (e.clientY - startY) + 'px';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            handler.style.cursor = 'move';
        });
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();

</script>
</body>
</html>
