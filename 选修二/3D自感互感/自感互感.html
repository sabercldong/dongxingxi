<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电磁感应 3D 物理实验室</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; background-color: #050505; }
        canvas { display: block; }

        /* 右侧控制面板 */
        #ui-panel {
            position: absolute;
            top: 0; right: 0;
            width: 280px; height: 100%;
            background: rgba(20, 20, 25, 0.9);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            border-left: 2px solid #444;
            overflow-y: auto;
            z-index: 100;
        }

        .section { margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        h3 { color: #00d4ff; margin-top: 0; }
        button {
            width: 100%; padding: 10px; margin: 5px 0;
            cursor: pointer; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px; transition: 0.3s;
        }
        button:hover { background: #444; border-color: #00d4ff; }
        button.active { background: #00d4ff; color: #000; font-weight: bold; }

        /* 左上角图表 */
        #chart-container {
            position: absolute;
            top: 20px; left: 20px;
            width: 320px; height: 220px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            cursor: move;
            z-index: 50;
        }
        #chart-header { 
            display: flex; justify-content: space-between; 
            margin-bottom: 5px; font-size: 12px; color: #aaa;
            user-select: none;
        }
        .hide-btn { cursor: pointer; color: #ff4444; }

        .label-text { font-size: 14px; margin: 10px 0 5px; color: #ccc; }
        input[type=range] { width: 100%; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="section">
        <h3>实验模式</h3>
        <button id="btn-self" class="active" onclick="setMode('self')">自感现象 (Self)</button>
        <button id="btn-mutual" onclick="setMode('mutual')">互感现象 (Mutual)</button>
    </div>

    <div class="section">
        <h3>动画控制</h3>
        <button onclick="togglePlay()" id="btn-play">暂停</button>
        <button onclick="resetExp()">还原重置</button>
    </div>

    <div class="section">
        <h3>参数调整</h3>
        <div class="label-text">电流频率 (AC)</div>
        <input type="range" id="freq-range" min="0.1" max="2" step="0.1" value="0.5">
        <div class="label-text">线圈匝数</div>
        <input type="range" id="turn-range" min="5" max="20" step="1" value="10">
    </div>

    <div class="section" style="font-size: 12px; color: #888;">
        提示：<br>
        - 鼠标左键旋转视图<br>
        - 右键/中键平移视图<br>
        - 滚轮缩放<br>
        - 左上角图表可拖拽
    </div>
</div>

<div id="chart-container">
    <div id="chart-header">
        <span>实时电流/感应电动势曲线</span>
        <span class="hide-btn" onclick="toggleChart()">[ 隐藏/显示 ]</span>
    </div>
    <canvas id="myChart"></canvas>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="chart.min.js"></script>

<script>
/** * 基础物理逻辑 
 * 自感: V = -L * (dI/dt)
 * 互感: V2 = -M * (dI1/dt)
 */

let scene, camera, renderer, controls;
let coil1, coil2, fieldLines = [];
let isPlaying = true;
let mode = 'self'; // 'self' or 'mutual'
let time = 0;
let chart;
const dataPoints = 50;
let currentData = new Array(dataPoints).fill(0);
let emfData = new Array(dataPoints).fill(0);

// 初始化
function init() {
    // 1. Scene & Renderer
    scene = new THREE.Scene();
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. Camera
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 15);

    // 3. Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 4. Lights
    const ambientLight = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);

    // 5. Objects
    createExperiment();

    // 6. Chart
    initChart();

    // 7. Events
    window.addEventListener('resize', onWindowResize);
    makeDraggable(document.getElementById("chart-container"));

    animate();
}

function createExperiment() {
    // 清除旧对象
    if(coil1) scene.remove(coil1);
    if(coil2) scene.remove(coil2);
    
    // 线圈材质
    const material1 = new THREE.MeshPhongMaterial({ color: 0xffaa00, wireframe: true });
    const material2 = new THREE.MeshPhongMaterial({ color: 0x00aaff, wireframe: true });

    // 创建主线圈 (Primary)
    const geom1 = new THREE.TorusGeometry(3, 0.4, 16, 100, Math.PI * 4);
    coil1 = new THREE.Mesh(geom1, material1);
    coil1.rotation.x = Math.PI / 2;
    scene.add(coil1);

    // 创建副线圈 (Secondary) - 初始隐藏
    const geom2 = new THREE.TorusGeometry(2, 0.3, 16, 100, Math.PI * 4);
    coil2 = new THREE.Mesh(geom2, material2);
    coil2.rotation.x = Math.PI / 2;
    coil2.position.y = 4; 
    scene.add(coil2);
    coil2.visible = false;

    // 创建磁感线点阵 (示意磁场)
    createFieldLines();
}

function createFieldLines() {
    fieldLines.forEach(l => scene.remove(l));
    fieldLines = [];
    const lineMat = new THREE.LineBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.5 });
    
    for(let i=0; i<8; i++) {
        const points = [];
        const radius = 3;
        const angle = (i / 8) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        
        // 椭圆路径模拟磁场
        for(let j=0; j<=20; j++) {
            const t = (j/20) * Math.PI * 2;
            points.push(new THREE.Vector3(x + Math.cos(t)*1, Math.sin(t)*4, z));
        }
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geom, lineMat);
        scene.add(line);
        fieldLines.push(line);
    }
}

function initChart() {
    const ctx = document.getElementById('myChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: new Array(dataPoints).fill(''),
            datasets: [{
                label: '输入电流 (I)',
                data: currentData,
                borderColor: '#ffaa00',
                borderWidth: 2,
                fill: false,
                pointRadius: 0
            }, {
                label: '感应电动势 (ε)',
                data: emfData,
                borderColor: '#00d4ff',
                borderWidth: 2,
                fill: false,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { min: -1.5, max: 1.5, grid: { color: '#333' } },
                x: { display: false }
            },
            plugins: { legend: { labels: { color: '#ccc', boxWidth: 10 } } }
        }
    });
}

function setMode(m) {
    mode = m;
    document.getElementById('btn-self').className = (m === 'self' ? 'active' : '');
    document.getElementById('btn-mutual').className = (m === 'mutual' ? 'active' : '');
    coil2.visible = (m === 'mutual');
    resetExp();
}

function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('btn-play').innerText = isPlaying ? "暂停" : "开始";
}

function resetExp() {
    time = 0;
    currentData.fill(0);
    emfData.fill(0);
    chart.update();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// 拖拽功能实现
function makeDraggable(el) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    el.onmousedown = dragMouseDown;
    function dragMouseDown(e) {
        if(e.target.className === 'hide-btn') return;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
    }
    function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
    }
    function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
    }
}

function toggleChart() {
    const canvas = document.getElementById('myChart');
    canvas.style.display = (canvas.style.display === 'none' ? 'block' : 'none');
}

function animate() {
    requestAnimationFrame(animate);

    if (isPlaying) {
        const freq = parseFloat(document.getElementById('freq-range').value);
        time += 0.05 * freq;

        // 物理模拟计算
        // I = sin(ωt)
        const current = Math.sin(time);
        // ε = -dI/dt = -cos(ωt)
        const emf = -Math.cos(time);

        // 更新 3D 视觉反馈
        const intensity = Math.abs(current);
        coil1.material.emissive.setHex(0xffaa00);
        coil1.material.emissiveIntensity = intensity;
        
        // 磁感线随电流强弱变化缩放/透明度
        fieldLines.forEach(l => {
            l.scale.set(1 + intensity*0.2, 1, 1 + intensity*0.2);
            l.material.opacity = intensity * 0.8;
        });

        if (mode === 'mutual') {
            const mutualIntensity = Math.abs(emf); // 互感取决于电流变化率
            coil2.material.emissive.setHex(0x00aaff);
            coil2.material.emissiveIntensity = mutualIntensity;
        }

        // 更新图表
        currentData.push(current);
        currentData.shift();
        emfData.push(emf);
        emfData.shift();
        chart.update('none'); 
    }

    controls.update();
    renderer.render(scene, camera);
}

init();

</script>
</body>
</html>
