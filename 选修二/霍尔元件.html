<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍尔效应 (Hall Effect) 全屏演示</title>
    <style>
        /* --- 全局布局设置 --- */
        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: #121212; /* 更深邃的背景 */
            color: #eee;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* 禁止整体滚动 */
            display: flex;    /* 左右布局 */
        }

        /* --- 左侧：仿真演示区 --- */
        .simulation-area {
            flex: 1; /* 占满剩余空间 */
            height: 100%;
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.2);
        }

        .header-overlay {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 10;
        }

        h2 { margin: 0; color: #4facfe; font-size: 24px; letter-spacing: 1px; }
        .subtitle { margin-top: 5px; color: #888; font-size: 14px; }

        /* 画布容器 (保持相对定位以便放置仪表盘) */
        .canvas-wrapper {
            position: relative;
            padding: 15px;
            background: #252525;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        canvas {
            display: block;
            border-radius: 4px;
            background: #000;
            /* 确保画布不会溢出屏幕 */
            max-width: 95%; 
            max-height: 85vh;
        }

        /* 仪表盘样式 */
        .voltmeter {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 130px;
            height: 90px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px #000, 0 5px 10px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .vm-screen {
            font-family: 'Courier New', monospace;
            font-size: 1.6em;
            color: #e74c3c;
            background: #000;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #444;
            min-width: 90px;
            text-align: right;
            text-shadow: 0 0 5px rgba(231, 76, 60, 0.5);
        }
        .vm-label { font-size: 0.75em; color: #aaa; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }

        /* --- 右侧：功能控制区 --- */
        .controls-sidebar {
            width: 340px; /* 固定宽度 */
            min-width: 340px;
            height: 100%;
            background: #2d2d2d;
            padding: 25px;
            box-sizing: border-box;
            border-left: 1px solid #3a3a3a;
            
            /* 关键：允许垂直滚动 */
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* 美化滚动条 */
        .controls-sidebar::-webkit-scrollbar { width: 8px; }
        .controls-sidebar::-webkit-scrollbar-track { background: #222; }
        .controls-sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .controls-sidebar::-webkit-scrollbar-thumb:hover { background: #777; }

        .control-section {
            background: #363636;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .section-title {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 15px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: #ddd;
        }

        .helper-text {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
            display: block;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            height: 6px;
            background: #555;
            border-radius: 3px;
            appearance: none;
            outline: none;
            margin-bottom: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #4facfe;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { background: #2ecc71; }

        .value-display { font-family: monospace; color: #4facfe; font-size: 1.1em; }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.85em;
            color: #bbb;
            margin-bottom: 8px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .symbol { width: 14px; text-align: center; display: inline-block; margin-right: 6px; font-weight: bold; color: #4facfe; }

        .info-box {
            font-size: 0.85em;
            color: #999;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="simulation-area">
        <div class="header-overlay">
            <h2>霍尔效应原理</h2>
            <div class="subtitle">Hall Effect Simulation</div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="hallCanvas" width="500" height="400"></canvas>
            
            <div class="voltmeter">
                <div class="vm-screen" id="voltageVal">0.00</div>
                <div class="vm-label">霍尔电压 (mV)</div>
            </div>
        </div>
    </div>

    <div class="controls-sidebar">
        
        <div class="control-section">
            <div class="section-title">参数设置</div>
            
            <div style="margin-bottom: 20px;">
                <label>
                    电流 (I)
                    <span id="val_I" class="value-display">5 A</span>
                </label>
                <span class="helper-text">正值: 电流向下 (电子向上)</span>
                <input type="range" id="input_I" min="-10" max="10" value="5" step="1">
            </div>

            <div>
                <label>
                    磁场 (B)
                    <span id="val_B" class="value-display">5 T</span>
                </label>
                <span class="helper-text">正值: 垂直向里 (×)</span>
                <input type="range" id="input_B" min="-10" max="10" value="5" step="1">
            </div>
        </div>

        <div class="control-section">
            <div class="section-title">图例说明</div>
            <div class="legend-item">
                <span class="dot" style="background:#3498db;"></span>
                <span>自由电子 (带负电)</span>
            </div>
            <div class="legend-item">
                <span class="symbol">×</span>
                <span>磁场垂直屏幕向里</span>
            </div>
            <div class="legend-item">
                <span class="symbol">•</span>
                <span>磁场垂直屏幕向外</span>
            </div>
            <div class="legend-item">
                <span class="symbol" style="color:#e74c3c;">+</span>
                <span>正电荷积累</span>
            </div>
            <div class="legend-item">
                <span class="symbol" style="color:#3498db;">-</span>
                <span>负电荷积累</span>
            </div>
        </div>

        <div class="control-section">
            <div class="section-title">物理原理</div>
            <div class="info-box">
                当电流通过位于磁场中的导体时，运动的载流子（电子）受到<strong>洛伦兹力</strong>作用发生偏转：
                <br><br>
                <div style="text-align:center; font-family:serif; font-style:italic; margin: 5px 0;">F = -e(v × B)</div>
                <br>
                这导致在导体两侧积累相反电荷，从而建立电场，产生<strong>霍尔电压</strong>。
            </div>
        </div>
        
        <div class="control-section">
            <div class="section-title">关于</div>
            <div class="info-box">
                此演示模型忽略了碰撞频率对漂移速度的复杂影响，仅展示理想情况下的电荷偏转与堆积效应。
            </div>
        </div>

    </div>

<script>
    const canvas = document.getElementById('hallCanvas');
    const ctx = canvas.getContext('2d');
    const voltageDisplay = document.getElementById('voltageVal');
    const inputI = document.getElementById('input_I');
    const inputB = document.getElementById('input_B');
    const labelI = document.getElementById('val_I');
    const labelB = document.getElementById('val_B');

    // --- 物理参数 ---
    let current = 5; 
    let bField = 5;  
    
    // --- 绘图配置 ---
    const PLATE_X = 100;
    const PLATE_Y = 50;
    const PLATE_W = 200;
    const PLATE_H = 300;
    
    const particles = [];
    const NUM_PARTICLES = 120;

    // 初始化电子
    for(let i=0; i<NUM_PARTICLES; i++) {
        particles.push({
            x: PLATE_X + Math.random() * PLATE_W,
            y: PLATE_Y + Math.random() * PLATE_H,
            speedOffset: Math.random() * 0.5 + 0.8
        });
    }

    function updateLabels() {
        labelI.textContent = inputI.value + " A";
        
        let bVal = parseInt(inputB.value);
        if (bVal > 0) labelB.textContent = `向里 ${bVal} T`;
        else if (bVal < 0) labelB.textContent = `向外 ${Math.abs(bVal)} T`;
        else labelB.textContent = "无磁场";

        current = parseInt(inputI.value);
        bField = parseInt(inputB.value);
    }

    inputI.addEventListener('input', updateLabels);
    inputB.addEventListener('input', updateLabels);


    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 绘制外部电路连线
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        ctx.beginPath();
        // 上下连线
        ctx.moveTo(PLATE_X + PLATE_W/2, 0); 
        ctx.lineTo(PLATE_X + PLATE_W/2, PLATE_Y);
        ctx.moveTo(PLATE_X + PLATE_W/2, PLATE_Y + PLATE_H); 
        ctx.lineTo(PLATE_X + PLATE_W/2, canvas.height);
        // 左右连线
        ctx.moveTo(PLATE_X, PLATE_Y + PLATE_H/2);
        ctx.lineTo(50, PLATE_Y + PLATE_H/2);
        ctx.moveTo(PLATE_X + PLATE_W, PLATE_Y + PLATE_H/2);
        ctx.lineTo(PLATE_X + PLATE_W + 50, PLATE_Y + PLATE_H/2);
        ctx.stroke();

        // 2. 绘制霍尔原件
        const gradient = ctx.createLinearGradient(PLATE_X, 0, PLATE_X + PLATE_W, 0);
        gradient.addColorStop(0, '#333');
        gradient.addColorStop(1, '#3b3b3b');
        ctx.fillStyle = gradient;
        ctx.fillRect(PLATE_X, PLATE_Y, PLATE_W, PLATE_H);
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        ctx.strokeRect(PLATE_X, PLATE_Y, PLATE_W, PLATE_H);

        // 3. 物理逻辑
        let v_y = -current * 0.8; 
        let v_x_deflect = 0;
        
        if (current !== 0 && bField !== 0) {
            v_x_deflect = current * bField * 0.02; 
        }

        // 4. 更新电子
        ctx.fillStyle = '#3498db'; 
        
        particles.forEach(p => {
            p.y += v_y * p.speedOffset;
            p.x += v_x_deflect + (Math.random() - 0.5) * 0.5;

            // Y轴循环
            if (p.y < PLATE_Y) p.y = PLATE_Y + PLATE_H;
            if (p.y > PLATE_Y + PLATE_H) p.y = PLATE_Y;

            // X轴限制
            if (p.x < PLATE_X + 2) p.x = PLATE_X + 2;
            if (p.x > PLATE_X + PLATE_W - 5) p.x = PLATE_X + PLATE_W - 5;
            
            // 无电流时的热运动
            if (current === 0) {
                p.x += (Math.random() - 0.5) * 2;
                p.y += (Math.random() - 0.5) * 2;
                if (p.x < PLATE_X) p.x = PLATE_X;
                if (p.x > PLATE_X + PLATE_W) p.x = PLATE_X + PLATE_W;
                if (p.y < PLATE_Y) p.y = PLATE_Y;
                if (p.y > PLATE_Y + PLATE_H) p.y = PLATE_Y + PLATE_H;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        // 5. 绘制磁场
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        if (bField !== 0) {
            let symbol = bField > 0 ? "×" : "•";
            let opacity = Math.abs(bField) / 10;
            ctx.fillStyle = `rgba(79, 172, 254, ${opacity})`; 
            
            for (let x = PLATE_X + 25; x < PLATE_X + PLATE_W; x += 50) {
                for (let y = PLATE_Y + 25; y < PLATE_Y + PLATE_H; y += 50) {
                    ctx.fillText(symbol, x, y);
                }
            }
        }

        // 6. 霍尔电压可视化
        let hallV = (current * bField * 1.5).toFixed(2);
        voltageDisplay.textContent = hallV;
        
        ctx.font = "bold 24px Arial";
        let chargeOpacity = Math.min(Math.abs(current * bField) / 20, 1);
        
        if (Math.abs(parseFloat(hallV)) > 0.5) {
            let leftSign = hallV > 0 ? "+" : "-";
            let rightSign = hallV > 0 ? "-" : "+";
            let leftColor = hallV > 0 ? "#e74c3c" : "#3498db";
            let rightColor = hallV > 0 ? "#3498db" : "#e74c3c";

            ctx.globalAlpha = chargeOpacity;
            
            ctx.fillStyle = leftColor;
            ctx.fillText(leftSign, PLATE_X - 15, PLATE_Y + PLATE_H/2 - 40);
            ctx.fillText(leftSign, PLATE_X - 15, PLATE_Y + PLATE_H/2);
            ctx.fillText(leftSign, PLATE_X - 15, PLATE_Y + PLATE_H/2 + 40);

            ctx.fillStyle = rightColor;
            ctx.fillText(rightSign, PLATE_X + PLATE_W + 15, PLATE_Y + PLATE_H/2 - 40);
            ctx.fillText(rightSign, PLATE_X + PLATE_W + 15, PLATE_Y + PLATE_H/2);
            ctx.fillText(rightSign, PLATE_X + PLATE_W + 15, PLATE_Y + PLATE_H/2 + 40);
            
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(loop);
    }

    updateLabels();
    loop();

</script>
</body>
</html>
