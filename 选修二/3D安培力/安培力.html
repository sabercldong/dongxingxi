<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampère's Force Interactive Demo</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #fff; color: #333; }
        
        /* 3D 容器 */
        #canvas-container { width: 100vw; height: 100vh; display: block; background: #fff; }

        /* 右侧功能区 */
        #ui-panel {
            position: absolute; top: 0; right: 0; width: 340px; height: 100vh;
            background: rgba(250, 250, 252, 0.95); border-left: 1px solid #e0e0e0;
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            box-shadow: -2px 0 15px rgba(0,0,0,0.05); z-index: 10;
        }

        h2 { font-size: 18px; margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        h3.section-title { font-size: 14px; color: #666; margin: 20px 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; font-weight: bold; }
        
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
        
        /* 新增：输入行布局 (滑块 + 数字框) */
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        input[type="range"] { flex-grow: 1; cursor: pointer; }
        input[type="number"] { 
            width: 60px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; 
            text-align: right; font-family: monospace; color: #3498db; font-weight: bold;
        }
        input[type="number"]:focus { border-color: #3498db; outline: none; }

        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; color: #444; }
        .color-box { width: 12px; height: 12px; margin-right: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.1); }
        
        #force-output {
            background: #fdf2f2; padding: 15px; border-radius: 6px;
            border: 1px solid #fadddd; margin-bottom: 20px; text-align: center;
        }
        .result-text { font-size: 22px; font-weight: bold; color: #c0392b; display: block; margin-top: 5px;}
        .formula { font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 16px; color: #555; text-align: center; margin-bottom: 10px; background: #eee; padding: 5px; border-radius: 4px;}

        /* 错误提示 */
        #error-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #error-box {
            background: #fff; padding: 30px; border-radius: 8px; max-width: 600px; text-align: left;
            border-left: 5px solid #e74c3c; font-family: monospace;
        }
    </style>
    
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
</head>
<body>

    <div id="error-overlay">
        <div id="error-box">
            <h3 style="margin-top:0; color:#c0392b;">Error</h3>
            <p id="error-text">Unknown Error</p>
            <button onclick="document.getElementById('error-overlay').style.display='none'" style="padding:5px 15px; cursor:pointer;">关闭提示</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>安培力演示 (Ampère's Force)</h2>

        <div class="formula">
            F = I × B · L
        </div>

        <div id="force-output">
            <span style="font-size: 12px; color: #c0392b;">安培力大小 |F|</span>
            <span class="result-text" id="force-magnitude">0.00</span>
        </div>

        <h3 class="section-title">环境磁场 (B)</h3>
        <div class="control-group">
            <label>磁感应强度 By (绿色)</label>
            <div class="input-row">
                <input type="range" id="range-b" min="-5" max="5" step="0.1" value="2.0">
                <input type="number" id="num-b" min="-5" max="5" step="0.1" value="2.0">
            </div>
        </div>
        
        <h3 class="section-title">电流向量 (I) & 导线方向</h3>
        <div class="control-group">
            <label>电流 Ix</label>
            <div class="input-row">
                <input type="range" id="range-ix" min="-5" max="5" step="0.1" value="3.0">
                <input type="number" id="num-ix" min="-5" max="5" step="0.1" value="3.0">
            </div>
        </div>
        <div class="control-group">
            <label>电流 Iy</label>
            <div class="input-row">
                <input type="range" id="range-iy" min="-5" max="5" step="0.1" value="0.0">
                <input type="number" id="num-iy" min="-5" max="5" step="0.1" value="0.0">
            </div>
        </div>
        <div class="control-group">
            <label>电流 Iz</label>
            <div class="input-row">
                <input type="range" id="range-iz" min="-5" max="5" step="0.1" value="2.0">
                <input type="number" id="num-iz" min="-5" max="5" step="0.1" value="2.0">
            </div>
        </div>

        <h3 class="section-title">图例</h3>
        <div style="margin-top:10px;">
            <div class="legend-item"><div class="color-box" style="background:#888;"></div>通电导线</div>
            <div class="legend-item"><div class="color-box" style="background:blue;"></div>电流方向 (I)</div>
            <div class="legend-item"><div class="color-box" style="background:rgba(0, 200, 0, 0.8);"></div>磁场方向 (B)</div>
            <div class="legend-item"><div class="color-box" style="background:magenta;"></div><strong>安培力 (F)</strong></div>
        </div>
        
        <div style="font-size: 12px; color:#888; margin-top:10px;">
            注：坐标轴 X(红), Y(绿), Z(蓝)
        </div>

        <div style="margin-top:20px; font-size:12px; color:#777; line-height: 1.5;">
            <p><strong>左手定则：</strong> 让磁感线(绿)穿入掌心，四指指向电流(蓝)，拇指即为安培力(品红)方向。</p>
        </div>
    </div>

    <script>
        // 错误捕获
        function showError(msg) {
            document.getElementById('error-overlay').style.display = 'flex';
            document.getElementById('error-text').innerText = msg;
            console.error(msg);
        }

        let scene, camera, renderer, controls;
        let wireMesh; 
        let iArrow, bMainArrow, fArrow; 
        let fieldArrowsGrid = []; 

        // 物理参数
        let params = {
            B: new THREE.Vector3(0, 2.0, 0),
            I: new THREE.Vector3(3.0, 0, 2.0)
        };
        
        const origin = new THREE.Vector3(0, 0, 0);

        // --- 1. 创建文字标签 (Canvas -> Texture -> Sprite) ---
        function createTextLabel(text, color) {
            try {
                const canvas = document.createElement('canvas');
                const size = 64; 
                canvas.width = size;
                canvas.height = size;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = color;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, size/2, size/2);
                
                const texture = new THREE.Texture(canvas);
                texture.needsUpdate = true;
                
                const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(3, 3, 3); // 标签大小
                return sprite;
            } catch (e) {
                return new THREE.Object3D(); 
            }
        }

        function initThree() {
            try {
                if (typeof THREE === 'undefined') throw new Error("three.min.js 未找到");

                const container = document.getElementById('canvas-container');

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xffffff);
                scene.fog = new THREE.Fog(0xffffff, 40, 120);

                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
                camera.position.set(25, 20, 25);
                camera.lookAt(origin);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // 控制器
                try {
                    if (typeof THREE.OrbitControls !== 'undefined') {
                        controls = new THREE.OrbitControls(camera, renderer.domElement);
                    } else if (typeof OrbitControls !== 'undefined') {
                        controls = new OrbitControls(camera, renderer.domElement);
                    }
                    if (controls) {
                        controls.enableDamping = true;
                        controls.dampingFactor = 0.05;
                    }
                } catch(e) {}

                // --- 新增：坐标轴与标签 ---
                const axesHelper = new THREE.AxesHelper(15);
                scene.add(axesHelper);

                const labelX = createTextLabel("X", "#cc0000"); labelX.position.set(16, 0, 0); scene.add(labelX);
                const labelY = createTextLabel("Y", "#00aa00"); labelY.position.set(0, 16, 0); scene.add(labelY);
                const labelZ = createTextLabel("Z", "#0000cc"); labelZ.position.set(0, 0, 16); scene.add(labelZ);

                // 网格
                const gridHelper = new THREE.GridHelper(50, 50, 0xdddddd, 0xf5f5f5);
                scene.add(gridHelper);

                // 灯光
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);

                // --- 导线模型 ---
                const wireGeo = new THREE.CylinderGeometry(0.3, 0.3, 12, 32);
                const wireMat = new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 50 });
                wireMesh = new THREE.Mesh(wireGeo, wireMat);
                scene.add(wireMesh);

                // --- 箭头 ---
                const arrowHeadLength = 1.0;
                const arrowHeadWidth = 0.5;

                iArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), origin, 1, 0x0000ff, arrowHeadLength, arrowHeadWidth);
                scene.add(iArrow);

                bMainArrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0, -6, 0), 1, 0x00cc00, arrowHeadLength, arrowHeadWidth);
                scene.add(bMainArrow);

                fArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,1), origin, 1, 0xff00ff, arrowHeadLength * 1.5, arrowHeadWidth * 1.5);
                fArrow.line.scale.set(3, 1, 3);
                scene.add(fArrow);

                createBackgroundField();
                window.addEventListener('resize', onWindowResize, false);

                animate();
            } catch (e) {
                showError("初始化失败: " + e.message);
            }
        }

        function createBackgroundField() {
            const spacing = 8; 
            const range = 24;  
            const initialDir = new THREE.Vector3(0, 1, 0);
            
            for (let x = -range; x <= range; x += spacing) {
                for (let y = -range; y <= range; y += spacing) {
                    for (let z = -range; z <= range; z += spacing) {
                        if (Math.abs(x) < 3 && Math.abs(z) < 3) continue;
                        const pos = new THREE.Vector3(x, y, z);
                        const arrow = new THREE.ArrowHelper(initialDir, pos, 1, 0x00aa00, 0.6, 0.3);
                        // 兼容性透明度
                        if(arrow.line && arrow.line.material) { arrow.line.material.transparent = true; arrow.line.material.opacity = 0.25; }
                        if(arrow.cone && arrow.cone.material) { arrow.cone.material.transparent = true; arrow.cone.material.opacity = 0.25; }
                        scene.add(arrow);
                        fieldArrowsGrid.push(arrow);
                    }
                }
            }
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 核心物理更新 ---
        function updatePhysics() {
            // 2. 更新导线姿态
            const iLen = params.I.length();
            
            if (iLen > 0.01) {
                const defaultDir = new THREE.Vector3(0, 1, 0);
                const targetDir = params.I.clone().normalize();
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(defaultDir, targetDir);
                wireMesh.setRotationFromQuaternion(quaternion);
                
                iArrow.visible = true;
                iArrow.setDirection(targetDir);
                const visualLen = 7; 
                iArrow.setLength(visualLen, 1.0, 0.5);
            } else {
                iArrow.visible = false;
            }

            // 3. 更新磁场
            const bLen = Math.abs(params.B.y);
            const bDir = params.B.clone().normalize();
            
            if (bLen > 0.05) {
                bMainArrow.visible = true;
                bMainArrow.setDirection(bDir);
                bMainArrow.setLength(bLen + 2); 
            } else {
                bMainArrow.visible = false;
            }

            const gridArrowLen = 3; 
            fieldArrowsGrid.forEach(arrow => {
                if (bLen > 0.05) {
                    arrow.visible = true;
                    arrow.setDirection(bDir);
                    arrow.setLength(gridArrowLen, gridArrowLen*0.25, gridArrowLen*0.15);
                } else {
                    arrow.visible = false;
                }
            });

            // 4. 计算安培力 F = I x B
            const F = new THREE.Vector3().copy(params.I).cross(params.B);
            
            const fLen = F.length();
            const outEl = document.getElementById('force-magnitude');
            if(outEl) outEl.innerText = fLen.toFixed(2);

            if (fLen > 0.05) {
                fArrow.visible = true;
                fArrow.setDirection(F.clone().normalize());
                let visualFLen = fLen * 0.8; 
                if (visualFLen > 15) visualFLen = 15;
                fArrow.setLength(visualFLen, visualFLen * 0.2, visualFLen * 0.1);
            } else {
                fArrow.visible = false;
            }
        }

        // --- 双向绑定逻辑：滑块 <-> 输入框 ---
        function bindDualInput(rangeId, numId, paramKey, subKey) {
            const rangeEl = document.getElementById(rangeId);
            const numEl = document.getElementById(numId);
            if(!rangeEl || !numEl) return;

            // 滑块变动
            rangeEl.addEventListener('input', () => {
                numEl.value = rangeEl.value;
                updateParam(paramKey, subKey, parseFloat(rangeEl.value));
            });

            // 输入框变动
            numEl.addEventListener('input', () => {
                rangeEl.value = numEl.value; 
                updateParam(paramKey, subKey, parseFloat(numEl.value));
            });
        }

        function updateParam(key, subKey, value) {
            if (isNaN(value)) return;
            if (subKey) {
                params[key][subKey] = value;
            } else {
                params[key] = value; // 预留给未来可能的标量参数
            }
            updatePhysics();
        }

        function initInputs() {
            bindDualInput('range-b',  'num-b',  'B', 'y');
            bindDualInput('range-ix', 'num-ix', 'I', 'x');
            bindDualInput('range-iy', 'num-iy', 'I', 'y');
            bindDualInput('range-iz', 'num-iz', 'I', 'z');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.onload = function() {
            initThree();
            initInputs();
            updatePhysics();
        };

    </script>
</body>
</html>
