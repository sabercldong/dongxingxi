<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电磁驱动演示 - 删除黄块版 (No Sticker)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 3D 容器 */
        #canvas-container { width: 100vw; height: 100vh; display: block; background: radial-gradient(circle, #f0f0f0 0%, #c0c0c0 100%); }

        /* 右侧功能区 */
        #ui-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: rgba(40, 40, 40, 0.9);
            border-left: 1px solid #555;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            backdrop-filter: blur(5px);
            z-index: 10;
            color: #eee;
        }

        h2 { color: #fff; font-size: 18px; margin-top: 0; border-bottom: 1px solid #666; padding-bottom: 10px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; color: #ccc; margin-bottom: 5px; font-size: 14px; }
        
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 14px;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-start:hover { background-color: #218838; transform: translateY(-1px); }
        .btn-pause { background-color: #ffc107; color: black; }
        .btn-pause:hover { background-color: #e0a800; transform: translateY(-1px); }
        .btn-reset { background-color: #dc3545; color: white; }
        .btn-reset:hover { background-color: #c82333; transform: translateY(-1px); }
        .btn-toggle-chart { background-color: #17a2b8; color: white; }

        /* 左上角图表容器 */
        #chart-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 420px;
            height: 260px;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #555;
            border-radius: 8px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: block;
        }

        #chart-header {
            height: 35px;
            background: #444;
            border-bottom: 1px solid #555;
            cursor: move;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: #fff;
            font-size: 13px;
            user-select: none;
        }

        #chart-header span { flex-grow: 1; }
        #btn-close-chart { cursor: pointer; color: #aaa; font-size: 20px; }
        #btn-close-chart:hover { color: white; }

        .canvas-wrapper {
            position: relative;
            height: 215px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .info-text { color: #bbb; font-size: 13px; line-height: 1.6; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; }
    </style>
    
    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./chart.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="chart-wrapper">
        <div id="chart-header">
            <span>实时转速对比 (Angular Velocity)</span>
            <span id="btn-close-chart">×</span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="speedChart"></canvas>
        </div>
    </div>

    <div id="ui-sidebar">
        <h2>铝框运动演示</h2>
        
        <div class="control-group">
            <button class="btn-start" onclick="startSim()">▶ 摇动曲柄 (Start)</button>
            <button class="btn-pause" onclick="pauseSim()">⏸ 停止摇动 (Stop)</button>
            <button class="btn-reset" onclick="resetSim()">↺ 重置 (Reset)</button>
        </div>

        <div class="control-group">
             <button class="btn-toggle-chart" onclick="toggleChart()">📊 显示/隐藏 图表</button>
        </div>

        <div class="control-group">
            <label>实验现象说明：</label>
            <div class="info-text">
                <p><strong>1. 手摇磁铁：</strong><br>点击开始后，上方的曲柄带动 U 型磁铁旋转。</p>
                <p><strong>2. 磁通量变化：</strong><br>旋转的磁场切割下方的闭合铝框。</p>
                <p><strong>3. 铝框跟随：</strong><br>铝框中产生感应电流，受力同向旋转。铝框速度总是略慢于磁铁（异步）。</p>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局变量 =================
        let scene, camera, renderer, controls;
        let magnetGroup, frameGroup, crankHandle;
        
        // 物理状态
        let isRunning = false;
        let magnetSpeed = 0;
        let frameSpeed = 0;
        let magnetAngle = 0;
        let frameAngle = 0;

        // 参数配置
        const TARGET_MAGNET_SPEED = 4.0; 
        const COUPLING_FACTOR = 0.04;    
        const FRAME_FRICTION = 0.005;    
        const FRAME_INERTIA = 0.8;       

        // 图表相关
        let speedChart;
        let chartLabels = [];
        let dataMagnet = [];
        let dataFrame = [];
        let frameCount = 0;

        // ================= 初始化 =================
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xd0d0d0);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(16, 12, 16); 
            camera.lookAt(0, 3, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 3, 0);
            }

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            createExperimentSetup();
            initChart();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createExperimentSetup() {
            // --- 材质 ---
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xd2691e, roughness: 0.6 });
            const magnetRed = new THREE.MeshPhongMaterial({ color: 0xe63946, shininess: 80 });
            const magnetBlue = new THREE.MeshPhongMaterial({ color: 0x1d3557, shininess: 80 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.6 });
            const alumMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.4 });

            // 1. 底座 (Base)
            const baseGeo = new THREE.BoxGeometry(12, 0.5, 8);
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.25;
            base.receiveShadow = true;
            scene.add(base);

            // 2. 木支架 (Wooden Stand)
            const standGroup = new THREE.Group();
            const postGeo = new THREE.BoxGeometry(0.8, 8, 0.8);
            const postL = new THREE.Mesh(postGeo, woodMat);
            postL.position.set(-5, 4.25, 0); 
            postL.castShadow = true;
            const postR = new THREE.Mesh(postGeo, woodMat);
            postR.position.set(5, 4.25, 0); 
            postR.castShadow = true;
            const beamGeo = new THREE.BoxGeometry(11.6, 0.8, 0.8); 
            const beam = new THREE.Mesh(beamGeo, woodMat);
            beam.position.set(0, 8.25, 0);
            beam.castShadow = true;
            standGroup.add(postL, postR, beam);
            scene.add(standGroup);

            // 3. 铝框 (Aluminum Frame)
            frameGroup = new THREE.Group();
            
            // 顶针
            const pinBase = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16), new THREE.MeshStandardMaterial({color:0xeeeeee}));
            pinBase.position.set(0, 0.75, 0);
            scene.add(pinBase);
            const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.8, 8), steelMat);
            pin.position.set(0, 1.6, 0);
            scene.add(pin);

            // 铝框本体
            const fw = 2.2; 
            const fh = 2.8; 
            const th = 0.12;
            const fTop = new THREE.Mesh(new THREE.BoxGeometry(fw, th, th), alumMat);
            fTop.position.y = fh/2;
            const fBot = new THREE.Mesh(new THREE.BoxGeometry(fw, th, th), alumMat);
            fBot.position.y = -fh/2;
            const fLeft = new THREE.Mesh(new THREE.BoxGeometry(th, fh, th), alumMat);
            fLeft.position.x = -fw/2;
            const fRight = new THREE.Mesh(new THREE.BoxGeometry(th, fh, th), alumMat);
            fRight.position.x = fw/2;
            
            frameGroup.add(fTop, fBot, fLeft, fRight);
            
            // --- 已删除黄色标记贴纸 ---
            // const sticker = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.13), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            // sticker.position.set(fw/2, 0, 0);
            // frameGroup.add(sticker);
            // -------------------------

            frameGroup.position.set(0, 3.2, 0); 
            scene.add(frameGroup);

            // 4. 磁铁与曲柄 (Magnet & Crank)
            magnetGroup = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4, 16), steelMat);
            shaft.position.y = 1;
            magnetGroup.add(shaft);
            const magWidth = 7.5; 
            const magTopGeo = new THREE.BoxGeometry(magWidth, 1, 1.5);
            const magTop = new THREE.Mesh(magTopGeo, steelMat);
            magTop.position.y = 0;
            const poleOffset = 3.0; 
            const poleGeo = new THREE.BoxGeometry(1.5, 4.0, 1.5); 
            const poleN = new THREE.Mesh(poleGeo, magnetRed);
            poleN.position.set(-poleOffset, -2.5, 0); 
            const poleS = new THREE.Mesh(poleGeo, magnetBlue);
            poleS.position.set(poleOffset, -2.5, 0);
            magnetGroup.add(magTop, poleN, poleS);
            magnetGroup.position.set(0, 7.0, 0);
            scene.add(magnetGroup);

            // 5. 曲柄
            crankHandle = new THREE.Group();
            const topShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16), steelMat);
            topShaft.position.y = 0.75;
            const arm = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.4), steelMat);
            arm.position.set(0.8, 1.5, 0);
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1, 16), woodMat);
            handle.position.set(1.6, 2.0, 0);
            crankHandle.add(topShaft, arm, handle);
            crankHandle.position.set(0, 8.65, 0);
            scene.add(crankHandle);
        }

        // ================= 图表逻辑 =================
        function initChart() {
            const ctx = document.getElementById('speedChart').getContext('2d');
            speedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '磁铁转速',
                            data: [],
                            borderColor: '#ff4444',
                            borderWidth: 2,
                            pointRadius: 0
                        },
                        {
                            label: '铝框转速',
                            data: [],
                            borderColor: '#00ccff',
                            borderWidth: 2,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: { suggestedMax: 5, ticks: { color: '#ccc' }, grid: { color: '#444' } }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }

        function updateChart() {
            if (frameCount % 5 === 0) {
                if (chartLabels.length > 50) {
                    chartLabels.shift();
                    dataMagnet.shift();
                    dataFrame.shift();
                }
                chartLabels.push('');
                dataMagnet.push(magnetSpeed);
                dataFrame.push(frameSpeed);
                
                speedChart.data.labels = chartLabels;
                speedChart.data.datasets[0].data = dataMagnet;
                speedChart.data.datasets[1].data = dataFrame;
                speedChart.update();
            }
        }

        // ================= 动画循环 =================
        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                magnetSpeed += (TARGET_MAGNET_SPEED - magnetSpeed) * 0.05;
            } else {
                magnetSpeed *= 0.95;
                if(magnetSpeed < 0.01) magnetSpeed = 0;
            }

            let slipSpeed = magnetSpeed - frameSpeed;
            let magneticTorque = slipSpeed * COUPLING_FACTOR;
            let frictionTorque = frameSpeed * FRAME_FRICTION;
            let netTorque = magneticTorque - frictionTorque;
            let alpha = netTorque / FRAME_INERTIA;

            frameSpeed += alpha;
            if(frameSpeed < 0 && magnetSpeed === 0) frameSpeed = 0;

            magnetAngle += magnetSpeed * 0.05;
            frameAngle += frameSpeed * 0.05;

            magnetGroup.rotation.y = magnetAngle;
            crankHandle.rotation.y = magnetAngle;
            frameGroup.rotation.y = frameAngle;

            updateChart();
            frameCount++;

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ================= 交互 =================
        function startSim() { isRunning = true; }
        function pauseSim() { isRunning = false; }
        function resetSim() {
            isRunning = false;
            magnetSpeed = 0; frameSpeed = 0; magnetAngle = 0; frameAngle = 0;
            magnetGroup.rotation.y = 0; crankHandle.rotation.y = 0; frameGroup.rotation.y = 0;
            chartLabels = []; dataMagnet = []; dataFrame = [];
            speedChart.data.labels = []; speedChart.data.datasets[0].data = []; speedChart.data.datasets[1].data = [];
            speedChart.update();
        }
        function toggleChart() {
            const el = document.getElementById('chart-wrapper');
            el.style.display = (el.style.display === 'none') ? 'block' : 'none';
        }
        document.getElementById('btn-close-chart').onclick = function() {
            document.getElementById('chart-wrapper').style.display = 'none';
        }
        
        // 拖拽
        const dragItem = document.getElementById('chart-wrapper');
        const dragHeader = document.getElementById('chart-header');
        let active = false;
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        dragHeader.addEventListener("mousedown", dragStart, false);
        window.addEventListener("mouseup", dragEnd, false);
        window.addEventListener("mousemove", drag, false);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === dragHeader || e.target.parentNode === dragHeader) active = true;
        }
        function dragEnd() {
            initialX = currentX; initialY = currentY; active = false;
        }
        function drag(e) {
            if (active) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                dragItem.style.transform = "translate3d(" + currentX + "px, " + currentY + "px, 0)";
            }
        }

        init();
    </script>
</body>
</html>
